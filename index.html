/* ===== s-overlays.js ===== */
/* =========================================================
   screens/overlays — Sheet / Alert
   HOM-02·REC-02 식단 기록·수정 · REC-03 삭제 · HOM-03 체중 기록 · SHO-03 결제 · SHO-05 메뉴 변경
   CRW-04 참가 · CRW-07 인증 업로드 · CRW-08 댓글 · 리워드 규칙 · 공통 확인 알럿
   ========================================================= */
(function () {
  const U = AF.utils; const SEL = AF.sel; const UI = AF.ui; const A = AF.actions; const D = AF.data;
  const O = (AF.overlays = {});
  O.readPhoto = (...a) => readPhoto(...a);
  const $ = (id) => document.getElementById(id);

  /* 사진 선택 → 최대 600px 로 줄여 dataURL 저장 (localStorage 용량 보호) */
  function readPhoto(file, cb, square) {
    if (!file) return cb(null);
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas');
        if (square) {
          // 프로필 사진: 가운데를 정사각형으로 잘라 320px
          const side = Math.min(img.width, img.height); c.width = c.height = 320;
          c.getContext('2d').drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, 320, 320);
        } else {
          const s = Math.min(1, 600 / Math.max(img.width, img.height));
          c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        }
        cb(c.toDataURL('image/jpeg', 0.7));
      };
      img.onerror = () => cb(null);
      img.src = fr.result;
    };
    fr.onerror = () => cb(null);
    fr.readAsDataURL(file);
  }
  const slotSeg = (cur, action) => UI.seg(D.slots.map((s) => [s, s]), cur, action, 'sm');
  const pickSeg = (el) => el.parentNode.querySelectorAll('button').forEach((b) => b.classList.toggle('active', b === el));

  /* ----- 공통 확인 알럿 ----- */
  O.confirm = ({ id, title, text, ok = '확인', danger, onOk }) => { O._ok = onOk; UI.openAlert(id || 'CONFIRM', { title, text, ok, danger }); };
  AF.handlers['confirm-ok'] = () => { const f = O._ok; O._ok = null; UI.closeOverlay(); if (f) f(); };
  AF.handlers['close-overlay'] = () => { O.live = null; O._ok = null; UI.closeOverlay(); };

  /* ----- HOM-02 / REC-02 식단 기록 · 수정 ----- */
  O.mealForm = ({ date, slot, id, quick }) => {
    const m = id ? SEL.dayMeals(date).find((x) => x.id === id) : null;
    AF.mf = { date, slot: m ? m.slot : slot, id: id || null, photo: m ? m.photo || null : null, from: AF.app.current() };
    const v = m || { name: '', cal: '', carb: '', prot: '', fat: '' };
    const f = (fid, label, value, unit, ph) => `<div class="field"><label for="${fid}">${label}</label><input id="${fid}" type="number" inputmode="numeric" value="${value}" placeholder="${ph || '0'}"><span class="f-unit">${unit}</span></div>`;
    UI.openSheet({
      id: quick ? 'HOM-02' : 'REC-02', title: m ? '식단 수정' : '식단 기록', sub: U.mdDow(date),
      left: { label: '취소' }, right: { label: '저장', action: 'mf-save' },
      body: `${slotSeg(AF.mf.slot, 'mf-slot')}
        <div class="group">
          <label class="photo-pick" id="mf-box">${photoThumb(AF.mf.photo)}<span class="r-main" style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:16px">사진</span><span class="t-foot">${AF.mf.photo ? '눌러서 바꾸기' : '선택 사항이에요'}</span></span>
            <input type="file" accept="image/*" data-change="mf-photo" hidden></label>
        </div>
        <div class="group">
          <div class="field"><label for="mf-name">음식명</label><input id="mf-name" value="${U.esc(v.name)}" placeholder="예) 닭가슴살 샐러드" autocomplete="off"></div>
          ${f('mf-cal', '칼로리', v.cal, 'kcal', '0')}
          ${f('mf-carb', '탄수화물', v.carb, 'g')}
          ${f('mf-prot', '단백질', v.prot, 'g')}
          ${f('mf-fat', '지방', v.fat, 'g')}
        </div>
        ${UI.group(UI.row({ icon: 'search', title: '음식 DB에서 찾기', action: 'mf-search' }))}
        ${m ? UI.group(UI.row({ title: '식단 삭제', action: 'mf-delete', cls: 'warn center', chevron: false })) : ''}`,
    });
  };
  const photoThumb = (photo) => `<span class="ph">${photo ? `<img src="${photo}" alt="">` : UI.icon('camera', 22, { sw: 1.6 })}</span>`;
  AF.handlers['open-meal-quick'] = () => O.mealForm({ date: U.today(), slot: AF.app.defaultSlot(), quick: true });
  AF.handlers['mf-slot'] = (el) => { AF.mf.slot = el.dataset.v; pickSeg(el); };
  AF.changes['mf-photo'] = (el) => readPhoto(el.files[0], (d) => {
    if (!d) return UI.toast('사진을 불러오지 못했어요.');
    AF.mf.photo = d; const box = $('mf-box'); if (box) box.querySelector('.ph').outerHTML = photoThumb(d);
  });
  // 칸별 검사 (오류는 칸 아래 표시)
  const mealFieldsOk = (nameId, calId) => {
    const n = $(nameId).value.trim(); const c = $(calId).value;
    if (!n) return UI.invalid(nameId, '음식명을 입력해 주세요.');

    return true;

  AF.mealFieldsOk = mealFieldsOk;
  AF.handlers['mf-save'] = () => {

    const r = f.id ? A.updateMeal(f.date, f.id, p) : A.addMeal(p);

  };
  AF.handlers['mf-search'] = () => {

    UI.closeNow(); AF.go('/home/food');
  };
  // REC-03 삭제 확인
  AF.handlers['mf-delete'] = () => {
    const f = AF.mf; const m = SEL.dayMeals(f.date).find((x) => x.id === f.id); if (!m) return;
    O.confirm({ id: 'REC-03', title: '식단을 삭제할까요?', text: `'${U.esc(m.name)}' 기록이 삭제돼요.`, ok: '삭제', danger: true, onOk: () => UI.toast(A.deleteMeal(f.date, m.id).msg) });
  };

  /* ----- HOM-03 체중 기록 (기록 탭의 날짜별 체중도 같은 시트) ----- */
  O.weightSheet = (date) => {
    date = date || U.today();
    const w = SEL.weightOn(date) != null ? SEL.weightOn(date) : SEL.latestWeight(date);
    AF.ws = { date };
    UI.openSheet({
      id: 'HOM-03', title: '체중 기록', sub: date === U.today() ? '오늘' : U.mdDow(date),
      left: { label: '취소' }, right: { label: '저장', action: 'qw-save' },

        ${SEL.weightOn(date) != null ? `<button class="text-btn" style="width:100%;justify-content:center;color:var(--warn)" data-action="qw-delete">이 날짜 체중 기록 삭제</button>` : ''}`,
    });
    setTimeout(() => { const i = $('qw'); if (i) { AF.inputs['qw-preview'](i); } }, 0);
  };
  AF.handlers['open-weight-sheet'] = () => O.weightSheet(U.today());
  AF.inputs['qw-preview'] = (el) => {
    const n = Number(el.value); const b = n >= 20 && n <= 300 ? U.round1(U.bmi(n, AF.state.data.user.height)) : null;
    const t = $('qw-bmi'); if (t) t.textContent = b ? `BMI ${b} · ${U.bmiStatus(b).label}` : '';
  };
  AF.handlers['qw-save'] = () => { const n = Number($('qw').value); if (!(n >= 20 && n <= 300)) return UI.invalid('qw', '체중은 20~300kg 사이로 입력해 주세요.'); const r = A.saveWeight(AF.ws.date, $('qw').value); UI.toast(r.msg); if (r.ok) { UI.closeOverlay(); if (AF.checkGoal) AF.checkGoal(); } };

  /* ----- SHO-03 결제 ----- */
  function checkout() {
    const c = AF.co; const p = D.product(c.id); const bal = AF.state.data.points.balance;
    const use = c.use ? Math.min(bal, p.price) : 0; const pay = p.price - use;
    UI.openSheet({
      id: 'SHO-03', title: '결제', left: { label: '닫기' },
      body: `${UI.group(`<div class="row" style="padding:12px 16px">${UI.ph(p.img, p.cat, '', '')}<span class="r-main"><span class="r-title clamp-2" style="font-size:15px">${U.esc(p.name)}</span><span class="r-sub">${p.cal} kcal · 1개</span></span><span class="r-value strong">${U.won(p.price)}</span></div>`.replace('class="ph ', 'style="width:56px;height:56px;border-radius:10px" class="ph '))}
        ${UI.group(`<div class="row"><span class="r-main"><span class="r-title">포인트 사용</span><span class="r-sub">보유 ${U.num(bal)}P</span></span>${UI.switchEl('data-change="co-points"', c.use, '포인트 사용')}</div>`)}
        <div class="group" style="padding:6px 0">
          <div class="row" style="min-height:40px"><span class="r-main"><span class="r-title t-sub" style="font-size:15px">상품 금액</span></span><span class="r-value">${U.won(p.price)}</span></div>
          <div class="row" style="min-height:40px"><span class="r-main"><span class="r-title t-sub" style="font-size:15px">포인트 할인</span></span><span class="r-value">${use ? '−' : ''}${U.won(use)}</span></div>
          <div class="row"><span class="r-main"><span class="r-title t-strong">최종 결제 금액</span></span><span class="num" style="font-size:22px;font-weight:700">${U.won(pay)}</span></div>
        </div>
        <button class="btn" data-action="co-pay">${U.won(pay)} 결제하기</button>`,
    });
  }
  AF.handlers['open-checkout'] = (el) => { AF.co = { id: el.dataset.product, use: false }; checkout(); };
  AF.changes['co-points'] = (el) => { AF.co.use = el.checked; checkout(); };
  AF.handlers['co-pay'] = () => { const r = A.purchase(AF.co.id, AF.co.use); UI.closeOverlay(); UI.toast(r.msg); };

  /* ----- SHO-05 다음 주 메뉴 변경 ----- */
  O.menuChange = () => {
    const cur = AF.state.data.subscription.menu;
    UI.openSheet({
      id: 'SHO-05', title: '다음 주 메뉴', left: { label: '닫기' },
      body: `${UI.group(D.subMenus.map((m) => UI.row({ title: U.esc(m), action: 'menu-pick', attrs: `data-v="${U.esc(m)}"`, cls: `choice ${cur === m ? 'selected' : ''}`, chevron: false, right: `<span class="check">${UI.icon('check', 20, { sw: 2.2 })}</span>` })).join(''))}
        <p class="t-foot" style="padding:0 4px">선택하면 다음 배송부터 바로 적용돼요.</p>`,
    });
  };
  AF.handlers['menu-pick'] = (el) => { const r = A.changeSubMenu(el.dataset.v); UI.closeOverlay(); UI.toast(r.msg); };

  /* ----- CRW-04 참가 신청 확인 ----- */
  O.joinAlert = (id) => {
    const c = AF.state.data.crews.find((x) => x.id === id); if (!c) return;
    O.confirm({ id: 'CRW-04', title: `'${U.esc(c.name)}'에 참가 신청할까요?`, text: `${U.esc(c.goal)}<br>현재 ${c.count}/${c.cap}명 · 크루장이 승인하면 참여할 수 있어요.`, ok: '신청', onOk: () => UI.toast(A.requestJoin(id).msg) });
  };

  /* ----- CRW-07 식단 인증 업로드 ----- */
  O.proof = () => {
    const c = SEL.currentCrew(); if (!c) return UI.toast('먼저 크루에 참여해 주세요.');
    AF.pf = { crewId: c.id, slot: AF.app.defaultSlot(), photo: null };
    UI.openSheet({
      id: 'CRW-07', title: '식단 인증', sub: U.esc(c.name),
      left: { label: '취소' }, right: { label: '올리기', action: 'pf-post' },
      body: `${slotSeg(AF.pf.slot, 'pf-slot')}
        <label class="ph photo-large" id="pf-box"><span class="ph-in">${UI.icon('camera', 28, { sw: 1.6 })}<span>사진 추가</span><span class="t-caption">사진이 있으면 피드에서 더 잘 보여요</span></span><input type="file" accept="image/*" data-change="pf-photo" hidden></label>
        <div class="group"><div class="field stack"><label class="f-label" for="pf-text">한마디</label><input id="pf-text" maxlength="60" placeholder="오늘 식단 소감을 남겨보세요" autocomplete="off"></div></div>`,
    });
  };
  AF.handlers['pf-slot'] = (el) => { AF.pf.slot = el.dataset.v; pickSeg(el); };
  AF.changes['pf-photo'] = (el) => readPhoto(el.files[0], (d) => {
    if (!d) return UI.toast('사진을 불러오지 못했어요.');
    AF.pf.photo = d; const box = $('pf-box'); if (box) box.innerHTML = `<img src="${d}" alt="선택한 인증 사진"><input type="file" accept="image/*" data-change="pf-photo" hidden>`;
  });
  AF.handlers['pf-post'] = () => {
    const r = A.postProof({ crewId: AF.pf.crewId, slot: AF.pf.slot, text: $('pf-text').value, img: AF.pf.photo });
    UI.closeOverlay(); UI.toast(r.msg);
  };

  /* ----- CRW-08 댓글 (live: 댓글 추가 시 다시 그림) ----- */
  function comments(id) {
    const f0 = AF.state.data.feed.find((x) => x.id === id); if (!f0) return;
    const bl = AF.state.data.user.blocked || [];
    const f = { ...f0, comments: f0.comments.filter((c) => !bl.includes(c.name)) }; // 차단한 사용자 댓글 숨김
    UI.openSheet({
      id: 'CRW-08', title: '댓글', sub: `${f.comments.length}개`, left: { label: '닫기' },
      body: `<div id="cm-list" style="display:flex;flex-direction:column;gap:14px;max-height:46vh;overflow-y:auto;padding:4px">${f.comments.length ? f.comments.map((c) => `<div style="display:flex;gap:10px">${UI.avatar(c.name, c.name === '나')}<div style="flex:1;min-width:0"><div style="display:flex;gap:6px;align-items:baseline"><span class="t-strong" style="font-size:14px">${U.esc(c.name)}</span><span class="t-caption">${U.relTime(c.ts)}</span></div><div style="font-size:15px;line-height:1.45">${U.esc(c.text)}</div></div></div>`).join('') : UI.empty('comment', '첫 댓글을 남겨보세요.')}</div>
        <div class="composer"><input id="cm-text" data-enter="cm-send" placeholder="댓글 입력" autocomplete="off" aria-label="댓글 입력"><button class="send-btn" data-action="cm-send" aria-label="댓글 보내기">${UI.icon('send', 18, { sw: 2.2 })}</button></div>`,
    });
    const l = $('cm-list'); if (l) l.scrollTop = l.scrollHeight;
  }
  O.comments = (id) => { O.live = { fn: () => comments(id), id }; O.live.fn(); };
  O.rerender = () => { if (O.live && UI.overlayOpen()) O.live.fn(); else O.live = null; };
  AF.handlers['cm-send'] = () => {
    const r = A.addComment(O.live.id, $('cm-text').value);
    if (!r.ok) UI.toast(r.msg); else { const i = $('cm-text'); if (i) i.focus(); }
  };

  /* ----- 크루 리워드 규칙 (기존 CRW-01 카드 내용을 시트로 이동) ----- */
  O.rewards = () => {
    const R = D.reward; const u = SEL.rewardUsage();
    const r = (t, p) => `<div class="row"><span class="r-main"><span class="r-title" style="font-size:15px">${t}</span></span><span class="r-value strong">+${p}P</span></div>`;
    UI.openSheet({
      id: 'CRW-RW', title: '리워드 규칙', left: { label: '닫기' },
      body: `${UI.group(r('식단 기록', R.meal) + r('크루 식단 인증', R.proof) + r('크루원 전원 인증 · 불꽃 +1', R.allDone) + r('7일 연속 인증', R.weekStreak))}
        <div style="display:flex;flex-direction:column;gap:12px;padding:4px">
          <div style="display:flex;flex-direction:column;gap:6px"><div class="t-foot" style="display:flex;justify-content:space-between"><span>오늘</span><span class="num">${u.day} / ${R.dayCap}P</span></div>${UI.bar(U.pct(u.day, R.dayCap), 'mid')}</div>
          <div style="display:flex;flex-direction:column;gap:6px"><div class="t-foot" style="display:flex;justify-content:space-between"><span>이번 주</span><span class="num">${u.week} / ${R.weekCap}P</span></div>${UI.bar(U.pct(u.week, R.weekCap), 'mid')}</div>
          <p class="t-caption">한도를 넘은 리워드는 적립되지 않아요.</p>
        </div>`,
    });
  };
})();

/* ===== s-extra.js ===== */
/* =========================================================
   screens/extra — 출시 준비 기능
   계정: AUTH-04 비밀번호 재설정 · MYP-10 계정 관리 · MYP-11 비밀번호 변경 · MYP-12 회원 탈퇴
   쇼핑: MYP-13 배송지 관리/편집 · MYP-14 결제 수단 · MYP-15 주문 상세(취소 · 환불 요청)
   커뮤니티: 게시물 더보기(수정 · 삭제 · 신고 · 차단) · MYP-16 차단한 사용자 · 크루 나가기/해체
   기록: 체중 기록 삭제 · 목표 달성 안내
   정보: MYP-17 개인정보 처리방침 · MYP-18 공지사항 · MYP-19 고객센터 · MYP-20 오픈소스 라이선스 · 화면 테마
   ========================================================= */
(function () {
  const U = AF.utils; const SEL = AF.sel; const UI = AF.ui; const A = AF.actions; const D = AF.data;
  const S = () => AF.state.data;
  const $ = (id) => document.getElementById(id);
  const save = () => { AF.state.save(); AF.app.refresh(); };
  const EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  const pwOk = (pw) => pw.length >= 8 && /[a-zA-Z]/.test(pw) && /\d/.test(pw);
  const checkRow = (title, sub, on, action, v) => UI.row({ title, sub, action, attrs: `data-v="${U.esc(v)}"`, cls: `choice ${on ? 'selected' : ''}`, chevron: false, right: `<span class="check">${UI.icon('check', 20, { sw: 2.2 })}</span>` });
  const pick = (el) => el.parentNode.querySelectorAll('.choice').forEach((b) => b.classList.toggle('selected', b === el));
  const notify = (kind, text) => { const st = S().notifSettings; if ((kind === 'delivery' && !st.delivery) || (kind === 'crew' && !st.crew)) return; S().notifs.unshift({ id: U.uid('n'), kind, icon: '', text, ts: Date.now(), read: false }); };

  /* =========================================================
     AUTH-04 비밀번호 재설정
     ========================================================= */
  AF.routes['/auth/reset'] = {
    id: 'AUTH-04', kind: 'sub', title: '비밀번호 재설정', back: '/auth/login', backLabel: '로그인', fit: true,
    render() {
      const sent = AF.resetSent;
      if (sent) {
        return `<div class="fit"><div class="pad" style="padding-top:40px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center">
            <span class="sk-flame on">${UI.icon('send', 34, { sw: 1.8 })}</span>
            <h2 style="font-size:22px;letter-spacing:-.4px">메일을 보냈어요</h2>
            <p class="t-sub" style="font-size:15px;line-height:1.55">${U.esc(sent)}(으)로 비밀번호 재설정 링크를 보냈어요.<br>메일이 오지 않으면 스팸함을 확인해 주세요.</p>
          </div>
          <div class="fit-cta" style="display:flex;flex-direction:column;gap:8px"><button class="btn" data-action="reset-done">로그인으로 돌아가기</button>
            <button class="text-btn" style="align-self:center" data-action="reset-again">다른 이메일로 다시 보내기</button></div></div>`;
      }
      return `<div class="fit"><p class="pad t-sub" style="padding-top:12px;font-size:15px">가입한 이메일을 입력하면 비밀번호를 다시 설정할 수 있는 링크를 보내드려요.</p>
        <div class="section tight"><div class="group"><div class="field stack"><label class="f-label" for="rs-email">이메일</label><input id="rs-email" type="email" placeholder="example@antifreeze.com" autocomplete="email" data-enter="reset-send"></div></div></div>
        <div class="fit-cta"><button class="btn" data-action="reset-send">재설정 링크 보내기</button></div></div>`;
    },
  };
  AF.handlers['reset-send'] = () => { UI.clearErrors(); const e = $('rs-email').value.trim(); if (!EMAIL.test(e)) return UI.invalid('rs-email', '이메일 형식을 확인해 주세요.'); AF.resetSent = e; AF.app.refresh(); };
  AF.handlers['reset-again'] = () => { AF.resetSent = null; AF.app.refresh(); };
  AF.handlers['reset-done'] = () => { AF.resetSent = null; AF.go('/auth/login', true); };

  /* =========================================================
     MYP-10 계정 관리 · MYP-11 비밀번호 변경 · MYP-12 회원 탈퇴
     ========================================================= */
  AF.routes['/my/account'] = {
    id: 'MYP-10', kind: 'sub', title: '계정 관리', back: '/my',
    render() {
      const u = S().user;
      return `<div class="section tight">${UI.group(UI.row({ title: '이메일', value: U.esc(u.email || '-') }) + UI.row({ title: '비밀번호 변경', to: '/my/password' }))}</div>
        <div class="section">${UI.group(UI.row({ title: '회원 탈퇴', to: '/my/withdraw', cls: 'warn' }))}
          <p class="section-foot">탈퇴하면 기록과 포인트가 모두 삭제되고 되돌릴 수 없어요.</p></div>`;
    },
  };
  AF.routes['/my/password'] = {
    id: 'MYP-11', kind: 'sub', title: '비밀번호 변경', back: '/my/account', backLabel: '계정 관리',
    render() {
      const f = (id, label, ph, ac) => `<div class="field stack"><label class="f-label" for="${id}">${label}</label><input id="${id}" type="password" placeholder="${ph}" autocomplete="${ac}"></div>`;
      return `<div class="section tight"><div class="group">${f('pw-cur', '현재 비밀번호', '현재 비밀번호', 'current-password')}${f('pw-new', '새 비밀번호', '영문, 숫자 포함 8자 이상', 'new-password')}${f('pw-new2', '새 비밀번호 확인', '한 번 더 입력', 'new-password')}</div>
        <p class="section-foot">다른 서비스와 같은 비밀번호는 피해 주세요.</p></div>
        <div class="bottom-cta"><button class="btn" data-action="pw-change">변경하기</button></div>`;
    },
  };
  AF.handlers['pw-change'] = () => {
    UI.clearErrors(); const v = (id) => $(id).value;
    if (!v('pw-cur')) return UI.invalid('pw-cur', '현재 비밀번호를 입력해 주세요.');
    if (!pwOk(v('pw-new'))) return UI.invalid('pw-new', '영문과 숫자를 포함해 8자 이상으로 입력해 주세요.');
    if (v('pw-new') === v('pw-cur')) return UI.invalid('pw-new', '현재 비밀번호와 다른 비밀번호를 입력해 주세요.');
    if (v('pw-new') !== v('pw-new2')) return UI.invalid('pw-new2', '새 비밀번호가 서로 달라요.');
    UI.toast('비밀번호를 변경했어요.'); AF.app.back('/my/account');
  };

  const REASONS = ['기록하기 번거로워요', '원하는 상품이 없어요', '다른 앱을 쓸 거예요', '개인정보가 걱정돼요', '기타'];
  AF.routes['/my/withdraw'] = {
    id: 'MYP-12', kind: 'sub', title: '회원 탈퇴', back: '/my/account', backLabel: '계정 관리',
    render() {
      const w = AF.wd || (AF.wd = { reason: null, agree: false }); const d = S(); const sub = d.subscription.status === 'active';
      return `<div class="pad" style="padding-top:8px"><h2 style="font-size:20px;letter-spacing:-.4px;line-height:1.4">${U.esc(d.user.name)}님, 탈퇴하기 전에<br>꼭 확인해 주세요</h2></div>
        <div class="section tight"><div class="group" style="padding:14px 16px"><ul class="wd-list">
          <li>식단 · 체중 기록과 프로필 정보가 <b>모두 삭제</b>되고 복구할 수 없어요.</li>
          <li>보유 포인트 <b>${U.num(d.points.balance)}P</b>가 소멸해요.</li>
          <li>크루 피드의 게시물은 '탈퇴한 회원'으로 표시돼요.</li>
          <li>주문 · 결제 기록은 관계 법령에 따라 일정 기간 보관돼요.</li>
        </ul></div>
        ${sub ? `<p class="section-foot t-warn" id="wd-sub">진행 중인 정기 구독이 있어요. 먼저 <button class="text-btn" style="height:auto;font-size:13px;padding:0" data-action="go" data-to="/shop/sub">정기 구독을 해지</button>해 주세요.</p>` : ''}</div>
        <div class="section"><div class="section-label">떠나시는 이유 (선택)</div>
          <div class="group" id="wd-reasons">${REASONS.map((r) => checkRow(r, '', w.reason === r, 'wd-reason', r)).join('')}</div></div>
        <div class="section tight">${UI.group(`<button class="agree ${w.agree ? 'on' : ''}" id="wd-agree" data-action="wd-agree" aria-pressed="${w.agree}"><span class="box">${UI.icon('check', 14, { sw: 2.6 })}</span><span style="flex:1">안내 사항을 모두 확인했어요</span></button>`)}</div>
        <div class="section tight"><div class="group"><div class="field stack"><label class="f-label" for="wd-pw">비밀번호 확인</label><input id="wd-pw" type="password" placeholder="현재 비밀번호" autocomplete="current-password"></div></div></div>
        <div class="bottom-cta"><button class="btn" style="background:var(--warn-fill)" data-action="wd-submit">탈퇴하기</button></div>`;
    },
  };
  AF.handlers['wd-reason'] = (el) => { AF.wd.reason = el.dataset.v; pick(el); };
  AF.handlers['wd-agree'] = (el) => { AF.wd.agree = !AF.wd.agree; el.classList.toggle('on', AF.wd.agree); el.setAttribute('aria-pressed', AF.wd.agree); };
  AF.handlers['wd-submit'] = () => {
    UI.clearErrors();
    if (S().subscription.status === 'active') return UI.invalid('wd-sub', '진행 중인 정기 구독을 먼저 해지해 주세요.');
    if (!AF.wd.agree) return UI.invalid('wd-agree', '안내 사항 확인에 체크해 주세요.');
    if (!$('wd-pw').value) return UI.invalid('wd-pw', '비밀번호를 입력해 주세요.');
    AF.overlays.confirm({
      id: 'MYP-12C', title: '정말 탈퇴할까요?', text: '모든 기록이 삭제되고 되돌릴 수 없어요.', ok: '탈퇴', danger: true,
      onOk: () => { AF.state.reset(); AF.onb = null; AF.wd = null; AF.go('/auth', true); UI.toast('탈퇴가 완료됐어요. 그동안 이용해 주셔서 감사해요.'); },
    });
  };

  /* =========================================================
     MYP-13 배송지 관리 · 편집
     ========================================================= */
  const addrLine = (a) => `${a.addr} ${a.detail}`.trim();
  AF.routes['/my/addresses'] = {
    id: 'MYP-13', kind: 'sub', title: '배송지 관리', back: '/my',
    right: () => '<button class="nav-text-btn" data-action="go" data-to="/my/address/new">추가</button>',
    render() {
      const list = S().user.addresses || [];
      return `<div class="section tight">${list.length ? UI.group(list.map((a) => `<button class="row" data-action="go" data-to="/my/address/${a.id}">
          <span class="r-main"><span class="r-title strong">${U.esc(a.label)}${a.def ? ' <span class="t-accent" style="font-size:12px;font-weight:700">기본</span>' : ''}</span>
          <span class="r-sub">${U.esc(addrLine(a))}</span><span class="r-sub">${U.esc(a.recipient)} · ${U.esc(a.phone)}</span></span>${UI.chev()}</button>`).join(''))
        : UI.group(UI.empty('truck', '등록된 배송지가 없어요.<br>오른쪽 위 추가 버튼으로 등록해 주세요.'))}</div>`;
    },
  };
  AF.routes['/my/address'] = {
    id: 'MYP-13E', kind: 'sub', back: '/my/addresses', backLabel: '배송지',
    title: (id) => (id === 'new' ? '배송지 추가' : '배송지 수정'),
    right: () => '<button class="nav-text-btn strong" data-action="addr-save">저장</button>',
    render(id) {
      const a = (S().user.addresses || []).find((x) => x.id === id) || { label: '집', recipient: S().user.name, phone: '', addr: '', detail: '', def: !(S().user.addresses || []).length };
      AF.addrDraft = { id: id === 'new' ? null : id, label: a.label };
      const t = (fid, label, v, ph, extra = '') => `<div class="field stack"><label class="f-label" for="${fid}">${label}</label><input id="${fid}" value="${U.esc(v)}" placeholder="${ph}" autocomplete="off" ${extra}></div>`;
      return `<div class="section tight"><div class="section-label">배송지 이름</div>${UI.seg([['집', '집'], ['회사', '회사'], ['기타', '기타']], a.label, 'addr-label')}</div>
        <div class="section tight"><div class="group">
          ${t('ad-name', '받는 분', a.recipient, '이름')}
          ${t('ad-phone', '연락처', a.phone, '010-0000-0000', 'inputmode="tel"')}
          ${t('ad-addr', '주소', a.addr, '도로명 주소')}
          ${t('ad-detail', '상세 주소', a.detail, '동 · 호수 (선택)')}
        </div><p class="section-foot">실제 앱에서는 주소 검색으로 도로명 주소를 입력해요.</p></div>
        <div class="section tight">${UI.group(`<div class="row"><span class="r-main"><span class="r-title">기본 배송지로 설정</span></span>${UI.switchEl('id="ad-def"', a.def, '기본 배송지')}</div>`)}</div>
        ${id !== 'new' ? `<div class="section">${UI.group(UI.row({ title: '배송지 삭제', action: 'addr-delete', cls: 'warn center', chevron: false }))}</div>` : ''}`;
    },
  };
  AF.handlers['addr-label'] = (el) => { AF.addrDraft.label = el.dataset.v; el.parentNode.querySelectorAll('button').forEach((b) => b.classList.toggle('active', b === el)); };
  AF.handlers['addr-save'] = () => {
    UI.clearErrors(); const v = (id) => $(id).value.trim();
    if (v('ad-name').length < 2) return UI.invalid('ad-name', '받는 분 이름을 2자 이상 입력해 주세요.');
    if (!/^01[0-9]-?\d{3,4}-?\d{4}$/.test(v('ad-phone'))) return UI.invalid('ad-phone', '연락처를 010-0000-0000 형식으로 입력해 주세요.');
    if (v('ad-addr').length < 5) return UI.invalid('ad-addr', '주소를 입력해 주세요.');
    const u = S().user; u.addresses = u.addresses || [];
    const def = $('ad-def').checked || !u.addresses.length;
    const data = { label: AF.addrDraft.label, recipient: v('ad-name'), phone: v('ad-phone'), addr: v('ad-addr'), detail: v('ad-detail'), def };
    if (def) u.addresses.forEach((x) => { x.def = false; });
    if (AF.addrDraft.id) Object.assign(u.addresses.find((x) => x.id === AF.addrDraft.id), data);
    else { const na = { id: U.uid('a'), ...data }; u.addresses.push(na); if (AF.co) AF.co.addrId = na.id; }
    if (!u.addresses.some((x) => x.def)) u.addresses[0].def = true;
    AF.state.save(); UI.toast('배송지를 저장했어요.'); AF.app.back('/my/addresses');
  };
  AF.handlers['addr-delete'] = () => AF.overlays.confirm({
    id: 'MYP-13D', title: '배송지를 삭제할까요?', ok: '삭제', danger: true,
    onOk: () => { const u = S().user; u.addresses = u.addresses.filter((x) => x.id !== AF.addrDraft.id); if (u.addresses.length && !u.addresses.some((x) => x.def)) u.addresses[0].def = true; AF.state.save(); UI.toast('배송지를 삭제했어요.'); AF.app.back('/my/addresses'); },
  });

  /* =========================================================
     MYP-14 결제 수단 — 카드사 · 끝 4자리만 저장 (실제 앱은 PG 결제창)
     ========================================================= */
  const BRANDS = ['신한카드', '국민카드', '현대카드', '삼성카드', '우리카드'];
  AF.routes['/my/payments'] = {
    id: 'MYP-14', kind: 'sub', title: '결제 수단', back: '/my',
    right: () => '<button class="nav-text-btn" data-action="pay-add">추가</button>',
    render() {
      const list = S().user.payments || [];
      return `<div class="section tight">${list.length ? UI.group(list.map((p) => UI.row({ icon: 'wallet', title: `${U.esc(p.brand)} ···· ${U.esc(p.last4)}`, value: p.def ? '<span class="t-accent t-strong">기본</span>' : '', action: 'pay-menu', attrs: `data-id="${p.id}"` })).join(''))
        : UI.group(UI.empty('wallet', '등록된 결제 수단이 없어요.'))}
        <p class="section-foot">프로토타입에서는 카드사와 끝 4자리만 저장해요. 실제 앱에서는 결제 대행사(PG) 결제창에서 카드 정보를 입력하고, 앱에는 카드 번호를 저장하지 않아요.</p></div>`;
    },
  };
  function payAddSheet() {
    AF.payDraft = AF.payDraft || { brand: BRANDS[0] };
    UI.openSheet({
      id: 'MYP-14A', title: '결제 수단 추가', left: { label: '취소' }, right: { label: '저장', action: 'pay-save' },
      body: `<div class="group" id="pay-brands">${BRANDS.map((b) => checkRow(b, '', AF.payDraft.brand === b, 'pay-brand', b)).join('')}</div>
        <div class="group"><div class="field"><label for="pay-last4">카드 끝 4자리</label><input id="pay-last4" inputmode="numeric" maxlength="4" placeholder="0000" autocomplete="off"></div></div>`,
    });
  }
  AF.handlers['pay-add'] = () => { AF.payDraft = null; payAddSheet(); };
  AF.handlers['pay-brand'] = (el) => { AF.payDraft.brand = el.dataset.v; pick(el); };
  AF.handlers['pay-save'] = () => {
    UI.clearErrors(); const l4 = $('pay-last4').value.trim();
    if (!/^\d{4}$/.test(l4)) return UI.invalid('pay-last4', '카드 번호 끝 4자리 숫자를 입력해 주세요.');
    const u = S().user; u.payments = u.payments || [];
    const np = { id: U.uid('pm'), brand: AF.payDraft.brand, last4: l4, def: !u.payments.length };
    u.payments.push(np); if (AF.co) AF.co.payId = np.id;
    AF.state.save(); UI.closeOverlay(); UI.toast('결제 수단을 추가했어요.'); AF.app.refresh();
    if (AF.co && AF.co.reopen) setTimeout(() => AF.overlays.checkout(), 300);
  };
  AF.handlers['pay-menu'] = (el) => {
    const p = S().user.payments.find((x) => x.id === el.dataset.id); AF.payMenuId = p.id;
    UI.openSheet({ id: 'MYP-14M', title: `${p.brand} ···· ${p.last4}`, left: { label: '닫기' },
      body: UI.group((p.def ? '' : UI.row({ title: '기본 결제 수단으로 설정', action: 'pay-default', chevron: false })) + UI.row({ title: '결제 수단 삭제', action: 'pay-delete', cls: 'warn', chevron: false })) });
  };
  AF.handlers['pay-default'] = () => { S().user.payments.forEach((x) => { x.def = x.id === AF.payMenuId; }); UI.closeOverlay(); UI.toast('기본 결제 수단을 바꿨어요.'); save(); };
  AF.handlers['pay-delete'] = () => AF.overlays.confirm({ id: 'MYP-14D', title: '결제 수단을 삭제할까요?', ok: '삭제', danger: true,
    onOk: () => { const u = S().user; u.payments = u.payments.filter((x) => x.id !== AF.payMenuId); if (u.payments.length && !u.payments.some((x) => x.def)) u.payments[0].def = true; UI.toast('결제 수단을 삭제했어요.'); save(); } });

  /* ----- SHO-03 결제 시트 재정의: 배송지 · 결제 수단 선택 포함 ----- */
  function checkout() {
    const c = AF.co; const p = D.product(c.id); const u = S().user; const bal = S().points.balance;
    const addrs = u.addresses || []; const pays = u.payments || [];
    if (!c.addrId || !addrs.find((x) => x.id === c.addrId)) c.addrId = (addrs.find((x) => x.def) || addrs[0] || {}).id;
    if (!c.payId || !pays.find((x) => x.id === c.payId)) c.payId = (pays.find((x) => x.def) || pays[0] || {}).id;
    const ad = addrs.find((x) => x.id === c.addrId); const pm = pays.find((x) => x.id === c.payId);
    const use = c.use ? Math.min(bal, p.price) : 0; const pay = p.price - use;
    const needPay = pay > 0 && !pm; const ready = ad && !needPay;
    UI.openSheet({
      id: 'SHO-03', title: '결제', left: { label: '닫기' },
      body: `${UI.group(`<div class="row" style="padding:12px 16px">${UI.ph(p.img, p.cat, 'co-thumb')}<span class="r-main"><span class="r-title clamp-2" style="font-size:15px">${U.esc(p.name)}</span><span class="r-sub">${p.cal} kcal · 1개</span></span><span class="r-value strong">${U.won(p.price)}</span></div>`)}
        <div class="group">
          ${ad ? UI.row({ icon: 'truck', title: `배송지 · ${U.esc(ad.label)}`, sub: `${U.esc(addrLine(ad))} · ${U.esc(ad.recipient)}`, action: 'co-addr' }) : UI.row({ icon: 'truck', title: '배송지를 추가해 주세요', action: 'co-addr-new', cls: 'accent' })}
          ${pay === 0 ? UI.row({ icon: 'wallet', title: '포인트로 전액 결제', sub: '결제 수단이 필요 없어요' }) : pm ? UI.row({ icon: 'wallet', title: `${U.esc(pm.brand)} ···· ${U.esc(pm.last4)}`, sub: '결제 수단', action: 'co-pay-method' }) : UI.row({ icon: 'wallet', title: '결제 수단을 추가해 주세요', action: 'co-pay-new', cls: 'accent' })}
        </div>
        ${UI.group(`<div class="row"><span class="r-main"><span class="r-title">포인트 사용</span><span class="r-sub">보유 ${U.num(bal)}P</span></span>${UI.switchEl('data-change="co-points"', c.use, '포인트 사용')}</div>`)}
        <div class="group" style="padding:6px 0">
          <div class="row" style="min-height:40px"><span class="r-main"><span class="r-title t-sub" style="font-size:15px">상품 금액</span></span><span class="r-value">${U.won(p.price)}</span></div>
          <div class="row" style="min-height:40px"><span class="r-main"><span class="r-title t-sub" style="font-size:15px">포인트 할인</span></span><span class="r-value">${use ? '−' : ''}${U.won(use)}</span></div>
          <div class="row"><span class="r-main"><span class="r-title t-strong">최종 결제 금액</span></span><span class="num" style="font-size:22px;font-weight:700">${U.won(pay)}</span></div>
        </div>
        <button class="btn" data-action="co-pay" ${ready ? '' : 'disabled'}>${ready ? `${U.won(pay)} 결제하기` : !ad ? '배송지를 먼저 추가해 주세요' : '결제 수단을 먼저 추가해 주세요'}</button>`,
    });
  }
  AF.overlays.checkout = checkout;
  AF.handlers['open-checkout'] = (el) => { AF.co = { id: el.dataset.product, use: false }; checkout(); };
  AF.changes['co-points'] = (el) => { AF.co.use = el.checked; checkout(); };
  AF.handlers['co-pay'] = () => { const c = AF.co; const r = A.purchase(c.id, c.use, c.addrId, c.payId); AF.co = null; UI.closeOverlay(); UI.toast(r.msg); };
  // 배송지 · 결제 수단 고르기 (같은 시트 안에서 목록으로 전환)
  AF.handlers['co-addr'] = () => {
    const list = S().user.addresses;
    UI.openSheet({ id: 'SHO-03A', title: '배송지 선택', left: { label: '뒤로', action: 'co-back' },
      body: `<div class="group">${list.map((a) => checkRow(`${U.esc(a.label)}${a.def ? ' · 기본' : ''}`, `${U.esc(addrLine(a))} · ${U.esc(a.recipient)}`, a.id === AF.co.addrId, 'co-addr-pick', a.id)).join('')}</div>
        ${UI.group(UI.row({ icon: 'plus', title: '새 배송지 추가', action: 'co-addr-new', cls: 'accent' }))}` });
  };
  AF.handlers['co-addr-pick'] = (el) => { AF.co.addrId = el.dataset.v; checkout(); };
  AF.handlers['co-pay-method'] = () => {
    const list = S().user.payments;
    UI.openSheet({ id: 'SHO-03P', title: '결제 수단 선택', left: { label: '뒤로', action: 'co-back' },
      body: `<div class="group">${list.map((p) => checkRow(`${U.esc(p.brand)} ···· ${U.esc(p.last4)}`, p.def ? '기본 결제 수단' : '', p.id === AF.co.payId, 'co-pay-pick', p.id)).join('')}</div>
        ${UI.group(UI.row({ icon: 'plus', title: '새 결제 수단 추가', action: 'co-pay-new', cls: 'accent' }))}` });
  };
  AF.handlers['co-pay-pick'] = (el) => { AF.co.payId = el.dataset.v; checkout(); };
  AF.handlers['co-back'] = () => checkout();
  AF.handlers['co-addr-new'] = () => { UI.closeNow(); AF.go('/my/address/new'); };
  AF.handlers['co-pay-new'] = () => { AF.co.reopen = true; AF.payDraft = null; payAddSheet(); };

  /* =========================================================
     MYP-15 주문 상세 · 주문 취소 · 환불 요청
     ========================================================= */
  const STEPS = ['주문 완료', '배송 시작', '배송 완료'];
  AF.routes['/my/order'] = {
    id: 'MYP-15', kind: 'sub', title: '주문 상세', back: '/my/orders', backLabel: '내역',
    render(id) {
      const o = S().orders.find((x) => x.id === id); if (!o) return UI.empty('receipt', '주문을 찾을 수 없어요.');
      const p = D.product(o.productId) || {}; const hist = o.history || [[o.date, '주문 완료']];
      const stopped = ['주문 취소', '환불 요청', '환불 완료'].includes(o.status);
      const reached = stopped ? 1 : o.status === '배송 완료' ? 3 : o.status === '배송 중' ? 2 : 1;
      return `<div class="section tight">${UI.group(`<div class="row" style="padding:14px 16px">${UI.ph(p.img, p.cat, 'co-thumb')}<span class="r-main"><span class="r-title clamp-2" style="font-size:15px;font-weight:600">${U.esc(o.name)}</span><span class="r-sub">${U.dotDate(o.date)} 주문 · 1개</span></span></div>`)}</div>
        <div class="section">${UI.sectionHead('배송 상태', `<span class="${stopped ? 't-warn' : 't-accent'} t-strong" style="font-size:15px">${o.status}</span>`)}
          <div class="group" style="padding:18px 16px">
            ${stopped ? `<p class="t-sub" style="font-size:15px">${o.status === '주문 취소' ? '주문이 취소됐어요. 사용한 포인트는 돌려드렸어요.' : '환불 요청을 접수했어요. 상품 회수 후 1~3일 안에 처리돼요.'}</p>`
              : `<div class="ship-steps">${STEPS.map((s, i) => `<div class="${i < reached ? 'on' : ''}"><span class="dot"></span><span class="t-caption">${s}</span></div>`).join('')}</div>`}
            <div class="ship-hist">${hist.slice().reverse().map(([d, t]) => `<div><span class="t-caption num">${U.dotDate(d)}</span><span style="font-size:14px">${t}</span></div>`).join('')}</div>
          </div></div>
        <div class="section">${UI.sectionHead('배송지')}${UI.group(`<div class="row"><span class="r-main"><span class="r-title" style="font-size:15px">${U.esc(o.addr || '-')}</span></span></div>`)}</div>
        <div class="section">${UI.sectionHead('결제 정보')}<div class="group" style="padding:6px 0">
          <div class="row" style="min-height:40px"><span class="r-main"><span class="r-title t-sub" style="font-size:15px">상품 금액</span></span><span class="r-value">${U.won(o.price)}</span></div>
          <div class="row" style="min-height:40px"><span class="r-main"><span class="r-title t-sub" style="font-size:15px">포인트 사용</span></span><span class="r-value">${o.used ? '−' : ''}${U.won(o.used || 0)}</span></div>
          <div class="row"><span class="r-main"><span class="r-title t-strong">결제 금액</span><span class="r-sub">${U.esc(o.payLabel || '')}</span></span><span class="num" style="font-size:20px;font-weight:700">${U.won(o.pay != null ? o.pay : o.price)}</span></div>
        </div></div>
        <div class="section">${o.status === '배송 준비중' ? UI.group(UI.row({ title: '주문 취소', action: 'order-cancel', attrs: `data-id="${o.id}"`, cls: 'warn center', chevron: false }))
          : o.status === '배송 완료' ? UI.group(UI.row({ title: '환불 요청', action: 'order-refund', attrs: `data-id="${o.id}"`, cls: 'center', chevron: false }))
          : ''}
          <p class="section-foot">${o.status === '배송 준비중' ? '배송이 시작되기 전까지 바로 취소할 수 있어요.' : o.status === '배송 완료' ? '신선식품은 상품에 문제가 있을 때만 환불할 수 있어요.' : ''}</p></div>`;
    },
  };
  AF.handlers['order-cancel'] = (el) => AF.overlays.confirm({
    id: 'MYP-15C', title: '주문을 취소할까요?', text: '사용한 포인트는 바로 돌려드려요.', ok: '주문 취소', danger: true,
    onOk: () => {
      const o = S().orders.find((x) => x.id === el.dataset.id); o.status = '주문 취소'; (o.history = o.history || []).push([U.today(), '주문 취소']);
      if (o.used) { S().points.balance += o.used; S().points.log.unshift({ id: U.uid('pl'), date: U.today(), ts: Date.now(), label: `${o.name} 주문 취소 환불`, amount: o.used, type: 'refund' }); }
      notify('delivery', `'${o.name}' 주문을 취소했어요.`); UI.toast('주문을 취소했어요.'); save();
    },
  });
  const REFUND = ['상품이 파손됐어요', '다른 상품이 왔어요', '상품이 상했어요', '기타'];
  AF.handlers['order-refund'] = (el) => {
    AF.refund = { id: el.dataset.id, reason: null };
    UI.openSheet({ id: 'MYP-15R', title: '환불 요청', left: { label: '취소' }, right: { label: '요청', action: 'refund-submit' },
      body: `<div class="group" id="refund-reasons">${REFUND.map((r) => checkRow(r, '', false, 'refund-reason', r)).join('')}</div>
        <div class="group"><div class="field stack"><label class="f-label" for="refund-text">자세한 내용 (선택)</label><input id="refund-text" maxlength="100" placeholder="사진은 고객센터 1:1 문의로 보내 주세요" autocomplete="off"></div></div>` });
  };
  AF.handlers['refund-reason'] = (el) => { AF.refund.reason = el.dataset.v; pick(el); };
  AF.handlers['refund-submit'] = () => {
    UI.clearErrors(); if (!AF.refund.reason) return UI.invalid('refund-reasons', '환불 사유를 선택해 주세요.');
    const o = S().orders.find((x) => x.id === AF.refund.id); o.status = '환불 요청'; o.refundReason = AF.refund.reason; (o.history = o.history || []).push([U.today(), `환불 요청 · ${AF.refund.reason}`]);
    UI.closeOverlay(); UI.toast('환불 요청을 접수했어요.'); save();
  };

  /* =========================================================
     커뮤니티: 게시물 더보기 · 신고 · 차단 · 수정 · 삭제 / 크루 나가기 · 해체
     ========================================================= */
  AF.handlers['post-more'] = (el) => {
    const f = S().feed.find((x) => x.id === el.dataset.id); if (!f) return; AF.postId = f.id;
    const mine = f.authorId === 'me';
    UI.openSheet({ id: 'CRW-PM', title: mine ? '내 게시물' : `${U.esc(f.author)}님의 게시물`, left: { label: '닫기' },
      body: mine ? UI.group(UI.row({ icon: 'sliders', title: '수정', action: 'post-edit', chevron: false }) + UI.row({ title: '삭제', action: 'post-delete', cls: 'warn', chevron: false }))
        : UI.group(UI.row({ title: '신고하기', action: 'post-report', cls: 'warn', chevron: false }) + UI.row({ title: `${U.esc(f.author)}님 차단`, action: 'user-block', cls: 'warn', chevron: false })) + '<p class="t-foot" style="padding:0 4px">차단하면 이 사용자의 게시물과 댓글이 보이지 않아요.</p>' });
  };
  AF.handlers['post-edit'] = () => {
    const f = S().feed.find((x) => x.id === AF.postId);
    UI.openSheet({ id: 'CRW-PE', title: '게시물 수정', left: { label: '취소' }, right: { label: '저장', action: 'post-edit-save' },
      body: `<div class="group"><div class="field stack"><label class="f-label" for="pe-text">한마디</label><input id="pe-text" maxlength="60" value="${U.esc(f.text)}" autocomplete="off"></div></div>` });
  };
  AF.handlers['post-edit-save'] = () => { UI.clearErrors(); const t = $('pe-text').value.trim(); if (!t) return UI.invalid('pe-text', '내용을 입력해 주세요.'); S().feed.find((x) => x.id === AF.postId).text = t; UI.closeOverlay(); UI.toast('게시물을 수정했어요.'); save(); };
  AF.handlers['post-delete'] = () => AF.overlays.confirm({ id: 'CRW-PD', title: '게시물을 삭제할까요?', text: '삭제한 인증은 되돌릴 수 없어요.', ok: '삭제', danger: true,
    onOk: () => { S().feed = S().feed.filter((x) => x.id !== AF.postId); UI.toast('게시물을 삭제했어요.'); save(); } });
  const REPORT = ['욕설 · 비하 · 혐오 표현', '건강을 해치는 다이어트 권유', '음란 · 폭력적인 내용', '광고 · 스팸', '개인정보 노출', '기타'];
  AF.handlers['post-report'] = () => {
    AF.reportReason = null;
    UI.openSheet({ id: 'CRW-RP', title: '신고하기', left: { label: '취소' }, right: { label: '신고', action: 'report-submit' },
      body: `<div class="group" id="report-reasons">${REPORT.map((r) => checkRow(r, '', false, 'report-reason', r)).join('')}</div><p class="t-foot" style="padding:0 4px">신고한 게시물은 바로 숨겨지고, 운영 정책에 따라 검토해요.</p>` });
  };
  AF.handlers['report-reason'] = (el) => { AF.reportReason = el.dataset.v; pick(el); };
  AF.handlers['report-submit'] = () => {
    UI.clearErrors(); if (!AF.reportReason) return UI.invalid('report-reasons', '신고 사유를 선택해 주세요.');
    const f = S().feed.find((x) => x.id === AF.postId); f.reported = true; f.reportReason = AF.reportReason;
    UI.closeOverlay(); UI.toast('신고를 접수했어요. 검토 후 조치할게요.'); save();
  };
  AF.handlers['user-block'] = () => {
    const f = S().feed.find((x) => x.id === AF.postId);
    AF.overlays.confirm({ id: 'CRW-BL', title: `${U.esc(f.author)}님을 차단할까요?`, text: '이 사용자의 게시물과 댓글이 보이지 않아요. 마이 > 차단한 사용자에서 해제할 수 있어요.', ok: '차단', danger: true,
      onOk: () => { const u = S().user; u.blocked = u.blocked || []; if (!u.blocked.includes(f.author)) u.blocked.push(f.author); UI.toast(`${f.author}님을 차단했어요.`); save(); } });
  };
  AF.routes['/my/blocked'] = {
    id: 'MYP-16', kind: 'sub', title: '차단한 사용자', back: '/my',
    render() {
      const bl = S().user.blocked || [];
      return `<div class="section tight">${bl.length ? UI.group(bl.map((n) => `<div class="row">${UI.avatar(n)}<span class="r-main"><span class="r-title">${U.esc(n)}</span></span><button class="btn-sm tinted" style="height:32px;padding:0 14px" data-action="user-unblock" data-n="${U.esc(n)}">해제</button></div>`).join(''))
        : UI.group(UI.empty('users', '차단한 사용자가 없어요.'))}<p class="section-foot">차단을 해제하면 그 사용자의 게시물과 댓글이 다시 보여요.</p></div>`;
    },
  };
  AF.handlers['user-unblock'] = (el) => { const u = S().user; u.blocked = (u.blocked || []).filter((x) => x !== el.dataset.n); UI.toast(`${el.dataset.n}님 차단을 해제했어요.`); save(); };

  // 크루 더보기: 크루원은 나가기, 크루장은 해체
  AF.handlers['crew-more'] = () => {

    UI.openSheet({ id: 'CRW-MO', title: U.esc(c.name), left: { label: '닫기' },
      body: UI.group((c.leader ? UI.row({ icon: 'sliders', title: '크루 관리', action: 'crew-more-manage' }) : '') + UI.row({ title: c.leader ? '크루 해체' : '크루 나가기', action: 'crew-leave', cls: 'warn', chevron: false }))
        + `<p class="t-foot" style="padding:0 4px">${c.leader ? '크루를 해체하면 크루원 모두 크루에서 나가게 되고, 피드는 더 이상 볼 수 없어요.' : '크루를 나가도 내가 올린 인증은 피드에 남아요.'}</p>` });
  };
  AF.handlers['crew-more-manage'] = () => { UI.closeNow(); AF.go('/crew/manage'); };
  AF.handlers['crew-leave'] = () => {
    const c = SEL.currentCrew();
    AF.overlays.confirm({ id: 'CRW-LV', title: c.leader ? '크루를 해체할까요?' : '크루를 나갈까요?', text: `'${U.esc(c.name)}'${c.leader ? ' 크루가 사라져요.' : '에서 나가요.'}`, ok: c.leader ? '해체' : '나가기', danger: true,
      onOk: () => {

        const ui = AF.state.ui(); const rest = SEL.myCrews(); ui.crewId = rest[0] ? rest[0].id : null; if (!rest.length) ui.crewTab = 'explore';

    id: 'HOM-03D', title: '체중 기록을 삭제할까요?', text: `${AF.ws.date === U.today() ? '오늘' : U.mdDow(AF.ws.date)} 기록이 삭제돼요.`, ok: '삭제', danger: true,
    onOk: () => { delete S().weights[AF.ws.date]; UI.toast('체중 기록을 삭제했어요.'); save(); },
  });
  // 체중 저장 직후 목표 도달 여부 확인 (같은 목표로는 한 번만 안내)
  AF.checkGoal = () => {
    const u = S().user; const w = SEL.latestWeight(); if (w == null) return;
    const ws = Object.keys(S().weights).sort(); const start = S().weights[ws[0]];
    const reached = start >= u.targetWeight ? w <= u.targetWeight : w >= u.targetWeight;
    if (!reached || u.goalReachedFor === u.targetWeight) return;
    u.goalReachedFor = u.targetWeight; AF.state.save();
    setTimeout(() => UI.openSheet({ id: 'HOM-GOAL', title: '목표 달성', left: { label: '닫기' },
      body: `<div class="sk-hero"><span class="sk-flame on">${UI.icon('target', 40, { sw: 1.6 })}</span><div class="sk-num num">${u.targetWeight}<span>kg 달성</span></div>
        <p class="t-sub">${U.esc(u.name)}님, 목표 체중에 도착했어요. 정말 수고했어요.</p></div>
        <button class="btn" data-action="goal-new">새 목표 설정하기</button>
        <button class="btn plain" data-action="close-overlay">지금 체중 유지하기</button>` }), 350);
  };
  AF.handlers['goal-new'] = () => { UI.closeNow(); AF.go('/my/profile/edit'); };

  /* =========================================================
     정보 화면: 개인정보 처리방침 · 공지사항 · 고객센터 · 오픈소스 라이선스
     ========================================================= */
  const docHtml = (list, note) => `<div class="terms"><p class="t-foot" style="padding:4px var(--gutter) 14px">${note}</p>
    ${list.map(([h, items]) => `<section class="terms-sec"><h2>${U.esc(h)}</h2>${items.length > 1 ? `<ol>${items.map((it) => `<li>${U.esc(it)}</li>`).join('')}</ol>` : `<p>${U.esc(items[0])}</p>`}</section>`).join('')}</div>`;
  AF.routes['/my/privacy'] = { id: 'MYP-17', kind: 'sub', title: '개인정보 처리방침', back: '/my', white: true, render: () => docHtml(AF.PRIVACY, `최종 수정일 ${AF.TERMS_UPDATED.replace(/-/g, '.')} · 프로토타입용 초안이며, [대괄호] 항목은 출시 전에 확정돼요.`) };
  AF.routes['/my/licenses'] = { id: 'MYP-20', kind: 'sub', title: '오픈소스 라이선스', back: '/my', white: true, render: () => docHtml(AF.LICENSES, '이 앱에 사용된 외부 리소스와 라이선스예요.') };
  AF.routes['/my/notices'] = {
    id: 'MYP-18', kind: 'sub', title: '공지사항', back: '/my',
    render: () => `<div class="section tight"><div class="group">${D.notices.map((n, i) => `<details class="acc" ${i === 0 ? 'open' : ''}><summary><span class="r-main"><span class="r-title" style="font-size:15px;font-weight:600">${U.esc(n.title)}</span><span class="r-sub">${U.dotDate(n.date)}</span></span>${UI.chev()}</summary><p>${U.esc(n.body)}</p></details>`).join('')}</div></div>`,
  };
  const QTYPES = ['서비스 이용', '주문 · 배송', '포인트', '계정', '기타'];
  AF.routes['/my/help'] = {
    id: 'MYP-19', kind: 'sub', title: '고객센터', back: '/my',
    render() {
      const qs = S().inquiries || [];
      return `<div class="section tight">${UI.sectionHead('자주 묻는 질문')}<div class="group">${D.faq.map(([q, a]) => `<details class="acc"><summary><span class="r-main"><span class="r-title" style="font-size:15px">${U.esc(q)}</span></span>${UI.chev()}</summary><p>${U.esc(a)}</p></details>`).join('')}</div></div>
        <div class="section">${UI.sectionHead('1:1 문의')}${UI.group(UI.row({ icon: 'comment', title: '문의하기', sub: '평일 10:00~18:00 · 영업일 기준 1~2일 안에 답변해요', action: 'ask-open' }))}
          ${qs.length ? `<div class="group" style="margin-top:10px">${qs.map((q) => `<div class="row"><span class="r-main"><span class="r-title" style="font-size:15px">${U.esc(q.type)} · ${U.esc(q.text.slice(0, 24))}${q.text.length > 24 ? '…' : ''}</span><span class="r-sub">${U.dotDate(q.date)}</span></span><span class="r-value">답변 대기</span></div>`).join('')}</div>` : ''}</div>`;
    },
  };
  AF.handlers['ask-open'] = () => {
    AF.ask = { type: QTYPES[0] };
    UI.openSheet({ id: 'MYP-19Q', title: '1:1 문의', left: { label: '취소' }, right: { label: '보내기', action: 'ask-send' },
      body: `<div class="group" id="ask-types">${QTYPES.map((t, i) => checkRow(t, '', i === 0, 'ask-type', t)).join('')}</div>
        <div class="group"><div class="field stack"><label class="f-label" for="ask-text">문의 내용</label><textarea id="ask-text" class="ask-text" maxlength="500" placeholder="불편했던 점이나 궁금한 점을 자세히 적어 주세요"></textarea></div></div>
        <p class="t-foot" style="padding:0 4px">답변은 ${U.esc(S().user.email || '가입한 이메일')}과 알림으로 알려드려요.</p>` });
  };
  AF.handlers['ask-type'] = (el) => { AF.ask.type = el.dataset.v; pick(el); };
  AF.handlers['ask-send'] = () => {
    UI.clearErrors(); const t = $('ask-text').value.trim(); if (t.length < 5) return UI.invalid('ask-text', '문의 내용을 5자 이상 적어 주세요.');
    (S().inquiries = S().inquiries || []).unshift({ id: U.uid('q'), type: AF.ask.type, text: t, date: U.today() });
    UI.closeOverlay(); UI.toast('문의를 접수했어요.'); save();
  };

  /* =========================================================
     화면 테마 (시스템 · 라이트 · 다크)
     ========================================================= */
  const mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  AF.applyTheme = () => {
    const t = (S() && S().user && S().user.theme) || 'system';
    const dark = t === 'dark' || (t === 'system' && mq && mq.matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    const m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', dark ? '#0E1117' : '#F4F7FB');
  };
  if (mq && mq.addEventListener) mq.addEventListener('change', () => AF.applyTheme());
  AF.THEMES = [['system', '시스템 설정', '기기 설정에 맞춰 바뀌어요'], ['light', '라이트', '항상 밝은 화면'], ['dark', '다크', '항상 어두운 화면']];
  AF.handlers['theme-open'] = () => {
    const cur = S().user.theme || 'system';
    UI.openSheet({ id: 'MYP-TH', title: '화면 테마', left: { label: '닫기' }, body: `<div class="group">${AF.THEMES.map(([k, l, s]) => checkRow(l, s, cur === k, 'theme-pick', k)).join('')}</div>` });
  };
  AF.handlers['theme-pick'] = (el) => { S().user.theme = el.dataset.v; AF.state.save(); AF.applyTheme(); AF.handlers['theme-open'](); AF.app.refresh(); };

  /* 알림 권한 (브라우저/기기 알림) */
  AF.notifPermission = () => (typeof Notification === 'undefined' ? 'unsupported' : Notification.permission);
  AF.handlers['notif-permission'] = () => {
    if (typeof Notification === 'undefined') return UI.toast('이 환경에서는 기기 알림을 지원하지 않아요.');
    Notification.requestPermission().then(() => AF.app.refresh());
  };
})();

/* ===== v2-home.js ===== */
/* =========================================================
   V2 · Ice Ring (Action-first) — HOM-01 홈 재설계
   V1 리뷰에서 지적된 문제를 해결하는 방향:
   ① 1순위 정보(남은 칼로리)는 아이콘의 '링'을 닮은 원형 게이지로 브랜드와 연결
   ② 1순위 행동(식단 기록 · 체중 기록)을 게이지 바로 아래 큰 버튼으로 배치 — 구매 버튼보다 강하게
   ③ 오늘의 4끼를 한눈에 보는 타일 → 빈 끼니는 바로 기록
   ④ AI 추천 · 크루는 한 줄짜리 부가 정보로 낮춤
   기능 · 데이터는 V1과 동일 (기존 selector / action 재사용)
   ========================================================= */
(function () {
  const U = AF.utils; const SEL = AF.sel; const UI = AF.ui; const D = AF.data;

  // 원형 칼로리 게이지 (아이콘의 링 모티프)
  function ring(c) {
    const size = 228; const sw = 16; const r = (size - sw) / 2; const len = 2 * Math.PI * r;
    const pct = c.over ? 100 : c.pct; const dash = (len * pct) / 100;
    return `<div class="v2-ring" role="img" aria-label="${c.over ? `목표보다 ${U.num(-c.remaining)} kcal 초과` : `남은 칼로리 ${U.num(c.remaining)} kcal`}, 섭취 ${U.num(c.consumed)} / 목표 ${U.num(c.target)} kcal">
      <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
        <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${sw}"/>
        <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${c.over ? 'var(--warn)' : 'var(--accent-bright)'}" stroke-width="${sw}" stroke-linecap="round"
          stroke-dasharray="${dash.toFixed(1)} ${len.toFixed(1)}" transform="rotate(-90 ${size / 2} ${size / 2})" style="transition:stroke-dasharray .8s var(--ease)"/>
      </svg>
      <div class="v2-ring-center">
        <span class="k">${c.over ? '목표 초과' : '남은 칼로리'}</span>
        <span class="v ${c.over ? 't-warn' : ''}">${U.num(Math.abs(c.remaining))}</span>
        <span class="u">kcal</span>
      </div>
    </div>`;
  }

  function macros(c) {
    const M = [['carb', '탄수화물'], ['prot', '단백질'], ['fat', '지방']];
    return `<div class="v2-macros">${M.map(([k, l]) => {
      const v = c.macros[k]; const t = c.macroTarget[k];
      return `<div class="macro"><span class="k"><span class="mdot ${k}"></span>${l}</span><span class="v">${v}<small> / ${t}g</small></span>${UI.bar(U.pct(v, t), `thin m-${k}`)}</div>`;
    }).join('')}</div>`;
  }

  // 오늘의 4끼 타일 — 기록이 있으면 기록 탭으로, 없으면 바로 기록 시트
  function slots() {
    const t = U.today(); const meals = SEL.dayMeals(t);
    return `<div class="v2-slots">${D.slots.map((s) => {
      const list = meals.filter((m) => m.slot === s); const sum = list.reduce((a, m) => a + m.cal, 0);
      return list.length
        ? `<button class="v2-slot done" data-action="v2-open-record" aria-label="${s} ${sum} kcal, 기록 보기"><span class="s">${s}</span><span class="kc num">${U.num(sum)}</span><span class="t-caption">kcal</span></button>`
        : `<button class="v2-slot" data-action="v2-add-slot" data-slot="${s}" aria-label="${s} 기록하기"><span class="s">${s}</span><span class="plus">${UI.icon('plus', 20, { sw: 2 })}</span><span class="t-caption">기록하기</span></button>`;
    }).join('')}</div>`;
  }

  function weight() {
    const u = AF.state.data.user; const w = SEL.latestWeight(); const delta = SEL.weightDelta(7);
    const left = w != null ? U.round1(w - u.targetWeight) : null;
    const dTxt = delta == null ? '7일 기록 부족' : `7일간 ${delta > 0 ? '+' : delta < 0 ? '−' : ''}${Math.abs(delta)}kg`;
    return UI.group(`<button class="row" data-action="go" data-to="/my" style="padding:14px 16px">
      <span class="r-main"><span class="t-caption">체중</span><span style="font-size:22px;font-weight:700;letter-spacing:-.5px" class="num">${w != null ? w.toFixed(1) : '-'}<span class="unit"> kg</span></span>
      <span class="r-sub">${dTxt}${left != null ? (left > 0 ? ` · 목표까지 ${left}kg` : ' · 목표 달성') : ''}</span></span>
      ${UI.sparkline(SEL.weightSeries(7).map((p) => p.value), 88, 36)}${UI.chev()}</button>`);
  }

  function ai() {
    const { product: p } = SEL.aiPick(); const c = SEL.calorie();
    return `<section class="section">
      ${UI.sectionHead('AI 추천', `<button class="text-btn" data-action="ai-refresh"><span id="ai-ico" style="display:inline-flex">${UI.icon('refresh', 15, { sw: 2 })}</span>다른 추천</button>`)}
      <div class="group fade" id="ai-meal"><div class="row" style="padding:12px 16px;gap:14px">
        <button class="v2-ai-link" data-action="go" data-to="/shop/item/${p.id}">${UI.ph(p.img, p.cat, 'v2-ai-ph')}
          <span class="r-main"><span class="r-title clamp-2" style="font-size:15px;font-weight:600">${U.esc(p.name)}</span>
          <span class="r-sub num">${p.cal} kcal · 단백질 ${p.prot}g · ${U.won(p.price)}</span></span></button>
        <button class="btn-sm tinted" data-action="open-checkout" data-product="${p.id}">구매</button>
      </div></div>
      <p class="section-foot">${c.remaining > 0 ? `남은 ${U.num(c.remaining)} kcal 안에서 단백질을 가장 많이 채울 수 있는 메뉴예요.` : '오늘 목표를 채워서 가벼운 메뉴를 골랐어요.'}</p>
    </section>`;
  }

  function crew() {
    const c = SEL.currentCrew();
    if (!c) return `<section class="section">${UI.group(UI.row({ icon: 'users', title: '함께할 크루 찾기', sub: '크루와 식단을 인증하면 포인트가 쌓여요', to: '/crew' }))}</section>`;
    const t = SEL.crewToday(c);
    const dots = c.members.map((m) => (m.id === 'me' ? SEL.meVerifiedToday() : m.verified)).map((ok) => `<span class="${ok ? 'on' : ''}"></span>`).join('');
    return `<section class="section">${UI.sectionHead('크루')}
      ${UI.group(`<button class="row" data-action="go" data-to="/crew" style="padding:14px 16px">
        <span class="r-main"><span class="r-title strong">${U.esc(c.name)}</span><span class="r-sub">오늘 인증 ${t.verified}/${t.total}명 · 불꽃 ${c.flame}단계</span></span>
        <span class="v2-dots" aria-hidden="true">${dots}</span>${UI.chev()}</button>`)}
    </section>`;
  }

  AF.routes['/home'] = {
    id: 'HOM-01', kind: 'tab', tab: 'home', title: '오늘',
    caption: () => AF.todayCaption(),
    actions() {
      const un = SEL.unread();
      const st = SEL.logStreak();
      return `<button class="nav-pill streak ${st.today ? 'on' : ''}" data-action="open-streak" aria-label="연속 기록 ${st.days}일${st.today ? '' : ', 오늘 아직 기록 전'}">${UI.icon('flame', 18, { sw: 1.8, filled: st.today })}<span class="num">${st.days}</span></button>
        <button class="nav-pill" data-action="go" data-to="/my/points" aria-label="보유 포인트 ${U.num(AF.state.data.points.balance)}P"><span class="num">${U.num(AF.state.data.points.balance)}P</span></button>
        <button class="icon-btn" data-action="go" data-to="/home/notif" aria-label="알림${un ? `, 읽지 않은 알림 ${un}개` : ''}">${UI.icon('bell', 22)}${un ? '<span class="dot"></span>' : ''}</button>`;
    },
    render() {
      const c = SEL.calorie(); const u = AF.state.data.user;
      return `<h1 class="large-title">오늘</h1>
        <p class="pad t-sub" style="margin-top:2px;font-size:15px">${U.esc(u.name)}님, ${c.over ? '오늘은 목표를 넘었어요. 내일 다시 맞춰봐요.' : c.consumed === 0 ? '첫 끼를 기록해 볼까요?' : '좋은 흐름이에요.'}</p>
        <section class="v2-hero">
          ${ring(c)}
          <div class="v2-kpi num"><span>섭취 <b>${U.num(c.consumed)}</b></span><span class="sep"></span><span>목표 <b>${U.num(c.target)}</b> kcal</span></div>
          ${macros(c)}
        </section>
        <div class="v2-actions pad">
          <button class="btn" data-action="open-meal-quick">${UI.icon('plus', 20, { sw: 2.2 })}식단 기록</button>
          <button class="btn secondary" data-action="open-weight-sheet">${UI.icon('scale', 20, { sw: 1.8 })}체중 기록</button>
        </div>
        <section class="section">${UI.sectionHead('오늘 식사', '<button class="text-btn" data-action="v2-open-record">전체 보기</button>')}${slots()}</section>
        <section class="section">${weight()}</section>
        ${ai()}${crew()}`;
    },
  };

  /* ----- 개인 연속 기록 시트 (듀오링고식 스트릭) -----
     하루 1끼 이상 기록하면 +1일. 7일(1주) 연속마다 +5P. 하루 빠지면 0일부터 다시 */
  function streakSheet() {
    const st = SEL.logStreak(); const best = Math.max(SEL.bestLogStreak(), st.days); const t = U.today();
    const R = D.reward; const doneToday = st.today && st.days > 0 && st.days % 7 === 0;
    const week = U.weekDays(t).map((d) => {
      const on = SEL.loggedOn(d); const fut = d > t;
      return `<div class="sk-day ${on ? 'on' : ''} ${d === t ? 'today' : ''} ${fut ? 'fut' : ''}"><span class="sk-dot">${on ? UI.icon('check', 14, { sw: 2.6 }) : ''}</span><span class="t-caption">${U.DOW[U.dow(d)]}</span></div>`;
    }).join('');
    UI.openSheet({
      id: 'HOM-STK', title: '연속 기록', left: { label: '닫기' },
      body: `<div class="sk-hero">
          <span class="sk-flame ${st.today ? 'on' : ''}">${UI.icon('flame', 44, { sw: 1.6, filled: st.today })}</span>
          <div class="sk-num num">${st.days}<span>일 연속</span></div>
          <p class="t-sub">${st.today ? '오늘도 기록했어요. 내일도 이어가 볼까요?' : st.days ? `오늘 식단을 기록하면 ${st.days + 1}일이 돼요.` : '오늘 첫 기록으로 연속 기록을 시작해 보세요.'}</p>
        </div>
        <div class="group sk-week" aria-label="이번 주 기록">${week}</div>
        ${UI.group(UI.row({ title: '다음 보상', value: doneToday ? `오늘 +${R.logStreak}P 받았어요` : `${st.nextReward}일 후 +${R.logStreak}P`, valueStrong: true })
          + UI.row({ title: '최고 기록', value: `${best}일` }))}
        <p class="t-foot" style="padding:0 4px;line-height:1.5">하루에 한 끼 이상 기록하면 연속 기록이 이어져요. 7일 연속할 때마다 ${R.logStreak}P가 적립되고, 하루라도 빠지면 0일부터 다시 시작해요.</p>
        ${st.today ? '' : '<button class="btn" data-action="streak-record">오늘 식단 기록하기</button>'}`,
    });
  }
  AF.handlers['open-streak'] = streakSheet;
  AF.handlers['streak-record'] = () => { UI.closeNow(); AF.overlays.mealForm({ date: U.today(), slot: AF.app.defaultSlot(), quick: true }); };

  AF.handlers['v2-add-slot'] = (el) => AF.overlays.mealForm({ date: U.today(), slot: el.dataset.slot, quick: true });
  AF.handlers['v2-open-record'] = () => { AF.state.ui().recordDate = U.today(); AF.go('/record'); };
})();

/* ===== v2-record.js ===== */
/* =========================================================
   V2 · 기록 탭 — 식단 행 스와이프 삭제 (iOS 리스트 제스처)
   행을 왼쪽으로 밀면 '삭제' 버튼이 드러나고, 누르면 REC-03 확인 알럿
   ========================================================= */
(function () {
  const OPEN = -84;           // 열렸을 때 이동 거리(px)
  let drag = null; let openEl = null;
  const close = (el) => { if (el) { el.style.transform = ''; el.classList.remove('open'); } if (openEl === el) openEl = null; };

  document.addEventListener('pointerdown', (e) => {
    const row = e.target.closest('.meal-wrap .meal');
    if (openEl && openEl !== row && !e.target.closest('.meal-del')) close(openEl);
    if (!row) return;
    drag = { row, x: e.clientX, y: e.clientY, base: row.classList.contains('open') ? OPEN : 0, moved: false, axis: null };
  });
  document.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.x; const dy = e.clientY - drag.y;
    if (!drag.axis) { if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return; drag.axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y'; }
    if (drag.axis !== 'x') return;                     // 세로 스크롤은 그대로 둠
    drag.moved = true;
    const x = Math.max(OPEN - 24, Math.min(0, drag.base + dx));
    drag.row.style.transition = 'none'; drag.row.style.transform = `translateX(${x}px)`;
  });
  document.addEventListener('pointerup', (e) => {
    if (!drag) return;
    const { row, moved, base } = drag; drag = null;
    row.style.transition = '';
    if (!moved) return;
    const dx = e.clientX - (row._lastX || 0);
    const cur = new DOMMatrix(getComputedStyle(row).transform).m41;
    if (cur < OPEN / 2) { row.style.transform = `translateX(${OPEN}px)`; row.classList.add('open'); openEl = row; }
    else close(row);
    // 스와이프 직후의 클릭(수정 시트 열기)은 막음
    row.dataset.swiped = '1'; setTimeout(() => { delete row.dataset.swiped; }, 50);
    void dx; void base;
  });
  // 스와이프로 열린 행을 탭하면 닫기만 하고 수정 시트는 열지 않음
  document.addEventListener('click', (e) => {
    const row = e.target.closest('.meal-wrap .meal'); if (!row) return;
    if (row.dataset.swiped || row.classList.contains('open')) { e.stopImmediatePropagation(); e.preventDefault(); if (!row.dataset.swiped) close(row); }
  }, true);
})();

/* ===== app.js ===== */
/* =========================================================
   app.js — 라우터 · 내비게이션 바 · 탭바 · 이벤트 위임 · 부팅
   - AF.routes[path] = { id, kind('onb'|'tab'|'sub'), title, caption?, actions?, right?, back?, render(param), footer?, full?, white?, after? }
   - 클릭: data-action → AF.handlers[action](el, event)  (go / back 는 공통 처리)
   - 입력: data-input → AF.inputs[name] / data-enter → Enter 시 handlers / data-change → AF.changes[name]
   ========================================================= */
(function () {
  const U = AF.utils; const UI = AF.ui;
  AF.routes = AF.routes || {}; AF.handlers = AF.handlers || {}; AF.inputs = AF.inputs || {}; AF.changes = AF.changes || {};
  const $ = (id) => document.getElementById(id);
  const app = (AF.app = {});

  // 탭 순서: 매일 쓰는 '기록'을 두 번째로
  const TABS = [
    { key: 'home', path: '/home', label: '홈', icon: 'home' },
    { key: 'record', path: '/record', label: '기록', icon: 'calendar' },
    { key: 'crew', path: '/crew', label: '크루', icon: 'users' },
    { key: 'shop', path: '/shop', label: '쇼핑', icon: 'bag' },
    { key: 'my', path: '/my', label: '마이', icon: 'user' },
  ];
  const BACK_LABEL = { '/home': '홈', '/record': '기록', '/crew': '크루', '/shop': '쇼핑', '/my': '마이' };

  let cur = { path: '', route: null, param: null };
  let stack = [];

  // 바로 이전 화면 경로 (뒤로 버튼 라벨 계산용)
  app.prevPath = () => { const p = stack[stack.length - 2]; return p ? parse('#' + p).path : null; };
  app.current = () => cur.path + (cur.param ? '/' + cur.param : '');
  app.defaultSlot = () => { const h = new Date().getHours(); return h < 10 ? '아침' : h < 15 ? '점심' : h < 21 ? '저녁' : '간식'; };

  /* ---------- 라우팅 ---------- */
  const signedIn = () => AF.state.data.user.onboarded && !AF.state.data.user.loggedOut;
  const home = () => (signedIn() ? '/home' : '/auth');
  const isAuthFlow = (p) => p.startsWith('/onb') || p.startsWith('/auth');
  function parse(hash) {
    const p = (hash || '').replace(/^#/, '') || home();
    if (AF.routes[p]) return { path: p, param: null };
    const i = p.lastIndexOf('/');
    if (i > 0 && AF.routes[p.slice(0, i)]) return { path: p.slice(0, i), param: decodeURIComponent(p.slice(i + 1)) };
    return { path: home(), param: null };
  }
  AF.go = (path, replace) => {
    if (replace) location.replace('#' + path);
    else if (location.hash === '#' + path) route();
    else location.hash = path;
  };
  app.back = (fallback) => { if (stack.length > 1) history.back(); else AF.go(fallback || '/home', true); };
  function onHash() {
    const full = location.hash.replace(/^#/, '') || '/';
    if (stack.length >= 2 && stack[stack.length - 2] === full) stack.pop();
    else if (stack[stack.length - 1] !== full) stack.push(full);
    route();
  }
  function route() {
    const r = parse(location.hash);
    // 온보딩 전에는 메인 화면 접근 불가 / 온보딩 후에는 온보딩으로 돌아가지 않음
    if (!signedIn() && !isAuthFlow(r.path)) return AF.go('/auth', true);
    if (signedIn() && isAuthFlow(r.path)) return AF.go('/home', true);
    const changed = r.path !== cur.path || r.param !== cur.param;
    cur = { path: r.path, param: r.param, route: AF.routes[r.path] };
    if (changed) { UI.closeNow(); if (AF.overlays) AF.overlays.live = null; }
    render(changed);
  }

  /* ---------- 렌더 ---------- */
  const val = (v) => (typeof v === 'function' ? v(cur.param) : v);
  function navbarHtml(rt) {
    const title = val(rt.title) || '';
    if (rt.kind === 'tab') {
      return `<div class="nav-left"><span class="nav-caption">${val(rt.caption) || ''}</span></div>
        <div class="nav-title">${title}</div>
        <div class="nav-right">${val(rt.actions) || ''}</div>`;
    }
    const back = rt.back ? `<button class="nav-back" data-action="back" data-fallback="${val(rt.back)}" aria-label="뒤로">${UI.icon('back', 24, { sw: 2.2 })}${rt.kind === 'onb' ? '' : (val(rt.backLabel) || BACK_LABEL[val(rt.back)] || '뒤로')}</button>` : '';
    return `<div class="nav-left">${back}</div><div class="nav-title">${rt.kind === 'onb' ? '' : title}</div><div class="nav-right">${val(rt.right) || ''}</div>`;
  }

  function render(changed) {
    const rt = cur.route; const scr = $('screen'); const prev = scr.scrollTop;
    const frame = $('app'); const nav = $('navbar');
    frame.classList.toggle('white', !!rt.white);
    nav.className = 'navbar ' + rt.kind;
    nav.innerHTML = navbarHtml(rt);
    $('tabbar').style.display = rt.kind === 'tab' ? '' : 'none';
    $('tabbar').innerHTML = TABS.map((t) => {
      const on = rt.tab === t.key;
      return `<button class="tab-item ${on ? 'active' : ''}" data-action="tab" data-to="${t.path}" aria-label="${t.label}" ${on ? 'aria-current="page"' : ''}>${UI.icon(t.icon, 26, { sw: 1.6, filled: on })}<span>${t.label}</span></button>`;
    }).join('');
    const foot = rt.footer ? rt.footer(cur.param) : '';
    $('footer').innerHTML = foot; $('footer').style.display = foot ? '' : 'none';
    scr.className = 'screen' + (rt.full ? ' full' : '') + (rt.fit ? ' fit-screen' : '');
    scr.setAttribute('data-screen', rt.id);
    scr.innerHTML = rt.render(cur.param);
    scr.scrollTop = changed ? 0 : prev;
    syncNav();
    if (rt.after) rt.after();
  }
  // 스크롤 시 내비 바에 구분선 + 작은 제목 표시 (Large Title 축소 효과)
  function syncNav() {
    const rt = cur.route; if (!rt) return;
    const y = $('screen').scrollTop;
    $('navbar').classList.toggle('scrolled', y > (rt.kind === 'tab' ? 34 : 4));
  }

  // 상태 변경 후 현재 화면(과 열려 있는 live 시트)을 다시 그림
  app.refresh = () => {
    if (!cur.route) return;
    const ae = document.activeElement;
    if (ae && ae.closest && ae.closest('#screen') && /^(INPUT|TEXTAREA)$/.test(ae.tagName) && ae.dataset.keep) return;
    render(false);
    if (AF.overlays && AF.overlays.rerender) AF.overlays.rerender();
  };

  /* ---------- 이벤트 위임 ---------- */
  document.addEventListener('click', (e) => {
    if (e.target.id === 'overlay') { AF.handlers['close-overlay'](); return; }
    const el = e.target.closest('[data-action]'); if (!el || el.disabled) return;
    const a = el.dataset.action;
    if (a === 'go') { AF.go(el.dataset.to); return; }
    if (a === 'tab') {
      // 같은 탭을 다시 누르면 맨 위로 스크롤
      if (('#' + el.dataset.to) === location.hash) { $('screen').scrollTo({ top: 0, behavior: 'smooth' }); return; }
      stack = [];
      AF.go(el.dataset.to); return;
    }
    if (a === 'back') { app.back(el.dataset.fallback); return; }
    const h = AF.handlers[a]; if (h) h(el, e); else console.warn('no handler for', a);
  });
  document.addEventListener('input', (e) => { const n = e.target.dataset && e.target.dataset.input; if (n && AF.inputs[n]) AF.inputs[n](e.target, e); });
  document.addEventListener('change', (e) => { const n = e.target.dataset && e.target.dataset.change; if (n && AF.changes[n]) AF.changes[n](e.target, e); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && UI.overlayOpen()) return AF.handlers['close-overlay']();
    if (e.key !== 'Enter' || e.isComposing) return;
    const n = e.target.dataset && e.target.dataset.enter; if (n && AF.handlers[n]) { e.preventDefault(); AF.handlers[n](e.target, e); }
  });

  /* ---------- 부팅 ---------- */
  function boot() {
    // 시연용: ?today=2026-10-13 으로 오늘 날짜 고정
    try { const t = new URLSearchParams(location.search).get('today'); if (t && /^\d{4}-\d{2}-\d{2}$/.test(t)) U.setToday(t); } catch (e) { /* 무시 */ }
    AF.state.load();
    if (AF.applyTheme) AF.applyTheme();
    $('screen').addEventListener('scroll', syncNav, { passive: true });
    window.addEventListener('hashchange', onHash);
    const full = location.hash.replace(/^#/, '');
    if (!full) location.replace('#' + home());
    stack = [location.hash.replace(/^#/, '')];
    route();
    // 스플래시 (앱 실행 시 아이콘 1~2초 표시 후 사라짐)
    const sp = $('splash');
    if (sp) { setTimeout(() => sp.classList.add('hide'), 1400); setTimeout(() => sp.remove(), 1900); }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
