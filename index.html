<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* =========================================================
   Antifreeze — iOS Design System v1
   무채색 4단계 + Accent 1색(#2A62D6). Warning(#C2410C)은 초과·삭제에만.
   카드 대신 Typography · 여백 · Divider · Grouped List 로 위계를 만든다.
   ========================================================= */

/* ---------- 1. Tokens ---------- */
:root {
  /* Color */
  --bg: #F4F7FB;            /* 아이스 톤 Off-white 화면 배경 (아이콘 색 기반) */
  --surface: #FFFFFF;       /* 그룹 리스트 / 시트 */
  --label: #0F1722;         /* 본문 · 숫자 */
  --label-2: #586170;       /* 보조 텍스트 */
  --label-3: #646C77;       /* 비활성 탭 · 축 (배경 · 흰 면 모두 4.5:1 이상) */
  --label-4: #9AA2AD;       /* chevron · disabled · placeholder */
  --sep: #E2E8EF;           /* 1px 구분선 */
  --sep-inset: #EAEFF5;     /* 그룹 내부 구분선 */
  --fill: #EBF0F6;          /* 세그먼트 · 검색창 배경 */
  --track: #DFE6EE;         /* 진행 막대 트랙 */
  --accent: #1F6BCB;          /* 텍스트 · 버튼용 (아이콘 블루를 대비 5.2:1로 조정) */
  --accent-bright: #3B86E0;   /* 진행 막대 · 그래프 (아이콘 메인 블루) */
  --mint: #2AA6A3;            /* 아이콘 링의 민트 — 완료 상태 */
  /* 영양소 고정 색 (모든 화면 공통 · 항상 텍스트 라벨과 함께 사용) */
  --macro-carb: #3B86E0;      /* 탄수화물 — 블루 */
  --macro-prot: #2AA6A3;      /* 단백질 — 민트 */
  --macro-fat: #8E9BB0;       /* 지방 — 슬레이트 */
  --accent-press: #185AAE;
  --accent-tint: #E8F2FE;
  --warn: #C2410C;
  --warn-tint: #FDF1EC;
  --on-accent: #FFFFFF;     /* 강조색 위 글자 */
  --accent-fill: #1F6BCB;   /* 채움 버튼 배경 (흰 글자 대비 4.5:1 이상) */
  --warn-fill: #C2410C;
  --dim: rgba(17, 18, 20, .38);

  /* 이미지 플레이스홀더 (단색) */
  --ph-ready: #E9E6E0;
  --ph-mealkit: #E2E9E4;
  --ph-protein: #E4E7EE;
  --ph-drink: #DDE8EF;
  --ph-photo: #E6EAF0;

  /* Radius */
  --r-seg: 7px; --r-sm: 10px; --r-md: 12px; --r-lg: 14px; --r-sheet: 20px;

  /* Spacing */
  --gutter: 20px; --group-gutter: 16px;

  /* Typography */
  --font: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;

  /* Motion */
  --ease: cubic-bezier(.32, .72, 0, 1);
}

/* ---------- 2. Base ---------- */
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: var(--font); color: var(--label); background: #DCE3EC;
  font-size: 16px; line-height: 1.45; letter-spacing: -0.2px;
  -webkit-font-smoothing: antialiased;
  display: flex; justify-content: center; align-items: center; min-height: 100dvh;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; letter-spacing: inherit; }
button:disabled { cursor: default; }
input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
img { display: block; max-width: 100%; }
h1, h2, h3 { font-weight: 700; }
.num { font-variant-numeric: tabular-nums; }
.hidden { display: none !important; }
button:focus:not(:focus-visible) { outline: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

/* ---------- 3. App frame ---------- */
.app-frame {
  width: 100%; max-width: 430px; height: 100dvh; background: var(--bg);
  position: relative; overflow: hidden; display: flex; flex-direction: column;
}
@media (min-width: 500px) {
  .app-frame { height: min(860px, calc(100dvh - 32px)); border-radius: 44px; box-shadow: 0 0 0 10px #18191B, 0 30px 60px rgba(0,0,0,.25); }
}
.screen-wrap { flex: 1; position: relative; overflow: hidden; }
.screen { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; padding-bottom: 40px; scrollbar-width: none; }
.screen::-webkit-scrollbar { display: none; }
.screen.full { overflow: hidden; padding-bottom: 0; display: flex; flex-direction: column; }
.app-frame.white .screen-wrap, .app-frame.white { background: var(--surface); }

/* ---------- 4. Navigation bar ---------- */
.navbar {
  flex-shrink: 0; position: relative; z-index: 5;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 8px 0 8px; height: calc(env(safe-area-inset-top, 0px) + 54px);
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  background: var(--bg); border-bottom: 1px solid transparent; transition: border-color .2s, background .2s;
}
@media (min-width: 500px) { .navbar { padding-top: 18px; height: 62px; } }
.app-frame.white .navbar { background: var(--surface); }
.navbar.scrolled { border-bottom-color: var(--sep); background: rgba(244,247,251,.94); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
.app-frame.white .navbar.scrolled { background: rgba(255,255,255,.94); }
.nav-left { display: flex; align-items: center; min-width: 0; padding-left: 12px; }
.nav-right { display: flex; align-items: center; justify-content: flex-end; gap: 2px; }
.nav-title { font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; text-align: center; }
.navbar.tab .nav-title { opacity: 0; transform: translateY(4px); transition: opacity .2s, transform .2s; }
.navbar.tab.scrolled .nav-title { opacity: 1; transform: none; }
.nav-caption { font-size: 13px; font-weight: 500; color: var(--label-2); transition: opacity .2s; white-space: nowrap; }
.navbar.tab.scrolled .nav-caption { opacity: 0; }
.nav-back { display: flex; align-items: center; gap: 0; height: 44px; padding: 0 8px 0 2px; color: var(--accent); font-size: 17px; margin-left: -10px; }
.nav-back svg { margin-right: -2px; }
.icon-btn { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; color: var(--label); position: relative; border-radius: 22px; }
.icon-btn.accent { color: var(--accent); }
.icon-btn .dot { position: absolute; top: 11px; right: 11px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent-fill); }
.icon-btn .count { position: absolute; top: 7px; right: 5px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--accent-fill); color: var(--on-accent); font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.nav-text-btn { height: 44px; padding: 0 12px; font-size: 16px; color: var(--accent); white-space: nowrap; }
.nav-text-btn.strong { font-weight: 600; }
.nav-points { height: 32px; padding: 0 8px; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }

/* Large title */
.large-title { padding: 2px var(--gutter) 0; font-size: 32px; font-weight: 700; letter-spacing: -0.6px; line-height: 40px; }

/* ---------- 5. Tab bar ---------- */
.tabbar {
  flex-shrink: 0; display: grid; grid-template-columns: repeat(5, 1fr);
  padding: 6px 4px calc(env(safe-area-inset-bottom, 0px) + 6px);
  background: rgba(255,255,255,.94); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  border-top: 1px solid var(--sep);
}
@media (min-width: 500px) { .tabbar { padding-bottom: 24px; } }
.tab-item { display: flex; flex-direction: column; align-items: center; gap: 1px; padding-top: 2px; min-height: 48px; color: var(--label-3); font-size: 10px; font-weight: 500; }
.tab-item.active { color: var(--accent); font-weight: 600; }

/* 하단 고정 액션 영역 (상품 상세 구매 / 채팅 입력) */
.footer-bar { flex-shrink: 0; background: rgba(255,255,255,.96); border-top: 1px solid var(--sep); padding: 10px var(--gutter) calc(env(safe-area-inset-bottom, 0px) + 10px); }
@media (min-width: 500px) { .footer-bar { padding-bottom: 26px; } }

/* ---------- 6. Section / Group / Row ---------- */
.section { padding: 32px var(--group-gutter) 0; }
.section.tight { padding-top: 20px; }
.section-head { display: flex; justify-content: space-between; align-items: center; padding: 0 4px 8px; min-height: 40px; }
.section-head h2 { font-size: 20px; letter-spacing: -0.4px; }
.section-head .text-btn { height: 36px; }
.section-label { padding: 0 16px 6px; font-size: 13px; color: var(--label-2); }
.section-foot { padding: 8px 16px 0; font-size: 13px; color: var(--label-2); line-height: 1.5; }
.pad { padding-left: var(--gutter); padding-right: var(--gutter); }

.group { background: var(--surface); border-radius: var(--r-lg); overflow: hidden; }
.row {
  width: 100%; min-height: 52px; padding: 10px 16px; display: flex; align-items: center; gap: 12px;
  text-align: left; position: relative; background: transparent;
}
button.row:active, a.row:active, .row.tap:active { background: #F2F2F0; }
.row + .row::before { content: ''; position: absolute; top: 0; left: 16px; right: 0; height: 1px; background: var(--sep-inset); }
.row.has-icon + .row.has-icon::before { left: 50px; }
.row .r-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row .r-title { font-size: 16px; }
.row .r-title.strong { font-weight: 600; }
.row .r-sub { font-size: 13px; color: var(--label-2); }
.row .r-value { font-size: 15px; color: var(--label-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.row .r-value.strong { color: var(--label); font-weight: 600; font-size: 16px; }
.row .r-ico { width: 22px; display: flex; justify-content: center; color: var(--label); flex-shrink: 0; }
.row .chev { color: var(--label-4); flex-shrink: 0; display: flex; }
.row.warn .r-title, .row .warn { color: var(--warn); }
.row.accent .r-title { color: var(--accent); }
.row.center { justify-content: center; }
.row .check { color: var(--accent); display: flex; }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

.divider { height: 1px; background: var(--sep); }
.spacer-8 { height: 8px; background: var(--bg); }

/* ---------- 7. Typography helpers ---------- */
.t-caption { font-size: 12px; color: var(--label-2); }
.t-foot { font-size: 13px; color: var(--label-2); }
.t-sub { color: var(--label-2); }
.t-muted { color: var(--label-3); }
.t-accent { color: var(--accent); }
.t-warn { color: var(--warn); }
.t-strong { font-weight: 600; }
.display { font-size: 60px; font-weight: 700; letter-spacing: -2px; line-height: 68px; font-variant-numeric: tabular-nums; }
.unit { font-size: 15px; font-weight: 500; color: var(--label-2); letter-spacing: -0.2px; }

/* ---------- 8. Buttons ---------- */
.btn {
  height: 50px; width: 100%; border-radius: var(--r-md); background: var(--accent-fill); color: var(--on-accent);
  font-size: 16px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  transition: background .15s, opacity .15s;
}
.btn:active { background: var(--accent-press); }
.btn:disabled { background: var(--track); color: var(--label-3); }
.btn.secondary { background: var(--accent-tint); color: var(--accent); }
.btn.secondary:active { background: #E1EAFA; }
.btn.plain { background: var(--fill); color: var(--label); }
.btn-sm { height: 36px; padding: 0 16px; border-radius: var(--r-sm); background: var(--accent-fill); color: var(--on-accent); font-size: 15px; font-weight: 600; white-space: nowrap; }
.btn-sm:active { background: var(--accent-press); }
.btn-sm.tinted { background: var(--accent-tint); color: var(--accent); }
.btn-sm:disabled { background: var(--fill); color: var(--label-3); }
.btn-pill { height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid #DADAD6; font-size: 13px; font-weight: 600; white-space: nowrap; }
.btn-pill.on { border-color: transparent; background: var(--accent-tint); color: var(--accent); }
.text-btn { height: 44px; color: var(--accent); font-size: 15px; font-weight: 500; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.text-btn.warn { color: var(--warn); }
.text-btn:disabled { color: var(--label-4); }

/* ---------- 9. Controls ---------- */
.seg { height: 34px; border-radius: 9px; background: var(--fill); padding: 2px; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; }
.seg.sm { height: 32px; }
.seg button { border-radius: var(--r-seg); font-size: 14px; font-weight: 500; color: var(--label-2); transition: background .15s; }
.seg.sm button { font-size: 13px; }
.seg button.active { background: #fff; color: var(--label); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 0 0 .5px rgba(0,0,0,.04); }
.seg button:disabled { color: var(--label-4); }

.switch { position: relative; width: 51px; height: 31px; flex-shrink: 0; display: inline-block; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; width: 100%; height: 100%; }
.switch .track { position: absolute; inset: 0; border-radius: 16px; background: var(--track); transition: background .2s; }
.switch .track::after { content: ''; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.15); transition: transform .2s var(--ease); }
.switch input:checked + .track { background: var(--accent-fill); }
.switch input:checked + .track::after { transform: translateX(20px); }

.search { height: 38px; border-radius: var(--r-sm); background: var(--fill); display: flex; align-items: center; gap: 6px; padding: 0 10px; color: var(--label-3); }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 16px; color: var(--label); }
.search input::placeholder { color: var(--label-3); }

/* Inset field (라벨 왼쪽 · 값 오른쪽) */
.field { min-height: 50px; padding: 0 16px; display: flex; align-items: center; gap: 12px; position: relative; }
.field + .field::before, .field + .row::before, .row + .field::before { content: ''; position: absolute; top: 0; left: 16px; right: 0; height: 1px; background: var(--sep-inset); }
.field label, .field .f-label { width: 96px; flex-shrink: 0; font-size: 16px; }
.field input, .field select { flex: 1; min-width: 0; height: 48px; border: 0; outline: 0; background: transparent; font-size: 16px; text-align: right; color: var(--label); }
.field input.left { text-align: left; }
.field input::placeholder { color: var(--label-4); }
.field .f-unit { font-size: 16px; color: var(--label-2); min-width: 34px; }
.field.stack { flex-direction: column; align-items: stretch; gap: 0; padding-top: 10px; }
.field.stack input { text-align: left; height: 34px; }
.field.stack .f-label { width: auto; font-size: 13px; color: var(--label-2); }

/* 체크 리스트 선택 */
.choice .check { visibility: hidden; }
.choice.selected .check { visibility: visible; }

/* Progress */
.bar { height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: inherit; background: var(--accent-bright); transition: width .6s var(--ease); }
.bar.thin { height: 3px; }
.bar.mid { height: 4px; }
.bar.dark > i { background: var(--label); }
.bar.warn > i { background: var(--warn); }

/* Stepper */
.stepper { display: inline-flex; align-items: center; background: var(--fill); border-radius: 9px; height: 32px; }
.stepper button { width: 44px; height: 32px; display: flex; align-items: center; justify-content: center; color: var(--label); }
.stepper span { min-width: 36px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }

/* Chips (카테고리 · 크루 전환) */
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 0 var(--gutter); scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { height: 34px; padding: 0 14px; border-radius: 17px; background: var(--surface); border: 1px solid var(--sep); font-size: 14px; font-weight: 500; color: var(--label-2); white-space: nowrap; flex-shrink: 0; }
.chip.active { background: var(--label); border-color: var(--label); color: var(--on-accent); font-weight: 600; }

/* ---------- 10. Images (사진 / 단색 플레이스홀더) ---------- */
.ph { position: relative; overflow: hidden; background: var(--ph-photo); flex-shrink: 0; }
.ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.ph.ready { background: var(--ph-ready); }
.ph.mealkit { background: var(--ph-mealkit); }
.ph.protein { background: var(--ph-protein); }
.ph.drink { background: var(--ph-drink); }
.ph .ph-label { position: absolute; left: 10px; bottom: 8px; font-size: 11px; font-weight: 600; color: rgba(17,18,20,.32); letter-spacing: .2px; }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: #E9E8E4; color: var(--label-2); font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.avatar.me { background: var(--accent-tint); color: var(--accent); }
.avatar.lg { width: 58px; height: 58px; font-size: 22px; }

/* ---------- 11. Home ---------- */
.hero { padding: 24px var(--gutter) 0; }
.hero .k { font-size: 15px; font-weight: 500; color: var(--label-2); }
.hero .v { display: flex; align-items: baseline; gap: 6px; margin-top: 2px; }
.hero .v .unit { font-size: 20px; font-weight: 600; }
.hero .bar { margin-top: 16px; }
.hero .meta { display: flex; justify-content: space-between; margin-top: 8px; font-size: 13px; color: var(--label-2); font-variant-numeric: tabular-nums; }
.macros { margin: 24px var(--gutter) 0; padding-top: 20px; border-top: 1px solid var(--sep); display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.macro { display: flex; flex-direction: column; gap: 6px; }
.macro .k { font-size: 13px; color: var(--label-2); }
.macro .v { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.macro .v small { font-size: 13px; font-weight: 500; color: var(--label-2); }
.weight-row { padding: 16px; display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; }
.weight-row .big { font-size: 28px; font-weight: 700; letter-spacing: -0.8px; font-variant-numeric: tabular-nums; }
.ai-item { display: flex; gap: 14px; padding: 16px; width: 100%; text-align: left; }
.ai-item .ph { width: 84px; height: 84px; border-radius: var(--r-sm); }
.ai-reason { padding: 0 16px 14px; font-size: 13px; line-height: 1.5; color: var(--label-2); }
.ai-foot { border-top: 1px solid var(--sep-inset); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; }
.price { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
.strike { font-size: 13px; font-weight: 400; color: var(--label-3); text-decoration: line-through; margin-left: 6px; }
.fade { transition: opacity .25s; }
.fade.out { opacity: .25; }
@keyframes spin { to { transform: rotate(360deg); } }
.spin { animation: spin .5s linear; }

/* ---------- 12. Record ---------- */
.week { padding: 12px 12px 0; display: grid; grid-template-columns: repeat(7, 1fr); }
.day { height: 66px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--label-2); }
.day .dw { font-size: 12px; }
.day .dn { width: 34px; height: 34px; border-radius: 17px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; color: var(--label); font-variant-numeric: tabular-nums; transition: background .15s; }
.day .pip { width: 4px; height: 4px; border-radius: 2px; background: var(--label-3); }
.day .pip.none { background: transparent; }
.day.today .dn { color: var(--accent); }
.day.active .dw { color: var(--accent); font-weight: 600; }
.day.active .dn { background: var(--accent-fill); color: var(--on-accent); font-weight: 700; }
.day.active .pip { background: var(--accent-fill); }
.day:disabled { color: var(--label-4); }
.day:disabled .dn { color: var(--label-4); font-weight: 500; }
.day-sum { margin: 12px var(--gutter) 0; padding: 16px 0 18px; border-top: 1px solid var(--sep); border-bottom: 1px solid var(--sep); display: flex; flex-direction: column; gap: 10px; }
.day-sum .top { display: flex; justify-content: space-between; align-items: baseline; }
.day-sum .big { font-size: 28px; font-weight: 700; letter-spacing: -0.8px; font-variant-numeric: tabular-nums; }
.timeline { padding: 18px var(--gutter) 0; }
.slot { display: flex; gap: 14px; }
.slot .rail { width: 10px; display: flex; flex-direction: column; align-items: center; padding-top: 16px; flex-shrink: 0; }
.slot .rail .node { width: 9px; height: 9px; border-radius: 5px; background: var(--label); }
.slot .rail .node.hollow { background: transparent; border: 1.5px solid var(--label-3); }
.slot .rail .line { width: 1px; flex: 1; background: #DADAD6; margin-top: 4px; }
.slot:last-child .rail .line { display: none; }
.slot .body { flex: 1; min-width: 0; padding-bottom: 14px; }
.slot-head { height: 40px; display: flex; align-items: center; gap: 8px; }
.slot-head .name { font-size: 17px; font-weight: 600; }
.slot-head .kcal { font-size: 13px; color: var(--label-2); font-variant-numeric: tabular-nums; }
.slot-head .grow { flex: 1; }
.meal { width: 100%; min-height: 54px; padding: 6px 0; display: flex; align-items: center; gap: 10px; text-align: left; border-radius: 8px; }
.meal:active { background: rgba(0,0,0,.03); }
.meal + .meal { border-top: 1px solid var(--sep-inset); }
.meal .ph { width: 40px; height: 40px; border-radius: 8px; }
.meal .m-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.meal .m-name { font-size: 15px; font-weight: 500; }
.meal .m-meta { font-size: 13px; color: var(--label-2); font-variant-numeric: tabular-nums; }

/* ---------- 13. Crew ---------- */
.crew-head { padding: 22px var(--gutter) 0; display: flex; flex-direction: column; gap: 6px; }
.crew-head h2 { font-size: 22px; letter-spacing: -0.5px; }
.flame { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; width: 90px; }
.flame span { height: 5px; border-radius: 3px; background: var(--track); }
.flame span.on { background: var(--accent-fill); }
.stats3 { margin: 18px var(--gutter) 0; padding: 16px 0; border-top: 1px solid var(--sep); border-bottom: 1px solid var(--sep); display: grid; grid-template-columns: repeat(3, 1fr); }
.stats3 > div { display: flex; flex-direction: column; gap: 2px; }
.stats3 > div + div { padding-left: 16px; border-left: 1px solid var(--sep); }
.stats3 .k { font-size: 12px; color: var(--label-2); }
.stats3 .v { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; font-variant-numeric: tabular-nums; }
.stats3 .v small { font-size: 15px; font-weight: 500; color: var(--label-2); }
.post { padding: 14px var(--gutter) 14px; display: flex; flex-direction: column; gap: 10px; }
.post + .post { border-top: 1px solid var(--sep-inset); }
.post .who { display: flex; align-items: center; gap: 10px; }
.post .ph { height: 234px; border-radius: var(--r-md); }
.post p { font-size: 15px; line-height: 1.5; }
.post .acts { display: flex; align-items: center; gap: 16px; }
.post .act { height: 36px; display: flex; align-items: center; gap: 5px; font-size: 14px; color: var(--label-2); }
.post .act.on { color: var(--label); }
.crew-list-item { padding: 14px 16px; display: flex; gap: 12px; align-items: center; }

/* Chat */
.chat-list { flex: 1; overflow-y: auto; padding: 12px var(--gutter) 16px; display: flex; flex-direction: column; gap: 10px; }
.msg { display: flex; flex-direction: column; align-items: flex-start; max-width: 78%; }
.msg.me { align-self: flex-end; align-items: flex-end; }
.msg .who { font-size: 12px; color: var(--label-2); margin: 0 0 3px 4px; }
.msg .bub { padding: 9px 13px; border-radius: 18px; background: var(--surface); font-size: 15px; line-height: 1.4; word-break: break-word; }
.msg.me .bub { background: var(--accent-fill); color: var(--on-accent); }
.msg .time { font-size: 11px; color: var(--label-3); margin: 3px 4px 0; }
.composer { display: flex; align-items: center; gap: 8px; }
.composer input { flex: 1; min-width: 0; height: 38px; border-radius: 19px; border: 1px solid var(--sep); background: var(--surface); padding: 0 14px; font-size: 16px; outline: 0; }
.send-btn { width: 38px; height: 38px; border-radius: 19px; background: var(--accent-fill); color: var(--on-accent); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

/* ---------- 14. Shop ---------- */
.sub-strip { margin: 16px var(--group-gutter) 0; }
.rail-scroll { display: flex; gap: 12px; overflow-x: auto; padding: 0 var(--gutter); scroll-snap-type: x mandatory; scrollbar-width: none; }
.rail-scroll::-webkit-scrollbar { display: none; }
.tile { width: 148px; flex-shrink: 0; scroll-snap-align: start; display: flex; flex-direction: column; gap: 3px; text-align: left; }
.tile .ph { width: 148px; height: 148px; border-radius: var(--r-md); margin-bottom: 6px; }
.grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px 12px; padding: 0 var(--gutter); }
.pcard { display: flex; flex-direction: column; gap: 3px; text-align: left; min-width: 0; position: relative; }
.pcard .ph { width: 100%; aspect-ratio: 1 / 1; border-radius: var(--r-md); margin-bottom: 7px; }
.p-cap { font-size: 12px; color: var(--label-2); }
.p-name { font-size: 15px; font-weight: 500; line-height: 1.35; }
.p-price { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }
.p-price .off { color: var(--accent); margin-right: 4px; }
.p-kcal { font-size: 12px; color: var(--label-2); font-variant-numeric: tabular-nums; }
.pcard-link { display: flex; flex-direction: column; gap: 3px; text-align: left; width: 100%; }
.quick-buy-btn { position: absolute; right: 8px; top: 8px; width: 34px; height: 34px; border-radius: 17px; background: rgba(255,255,255,.94); color: var(--label); display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.list-count { padding: 0 var(--gutter) 12px; font-size: 13px; color: var(--label-2); }
.detail-hero { width: 100%; height: 330px; }
.detail-body { padding: 20px var(--gutter) 0; display: flex; flex-direction: column; gap: 4px; }
.detail-body h1 { font-size: 22px; letter-spacing: -0.5px; line-height: 1.35; }
.detail-price { margin-top: 12px; font-size: 26px; font-weight: 700; letter-spacing: -0.6px; font-variant-numeric: tabular-nums; }
.nutri4 { margin: 0 var(--gutter); padding: 16px 0; border-top: 1px solid var(--sep); border-bottom: 1px solid var(--sep); display: grid; grid-template-columns: repeat(4, 1fr); }
.nutri4 > div { display: flex; flex-direction: column; gap: 2px; }
.nutri4 > div + div { padding-left: 14px; border-left: 1px solid var(--sep); }
.nutri4 .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.nutri4 .k { font-size: 12px; color: var(--label-2); }
.buybar { display: flex; align-items: center; gap: 16px; }
.buybar .btn { flex: 1; }
.big-stat { padding: 8px var(--gutter) 0; }
.big-stat .k { font-size: 15px; color: var(--label-2); font-weight: 500; }
.big-stat .v { font-size: 34px; font-weight: 700; letter-spacing: -1px; font-variant-numeric: tabular-nums; }

/* ---------- 15. Onboarding ---------- */
.onb { padding: 0 var(--gutter); }
.onb-progress { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 0 var(--gutter); }
.onb-progress span { height: 3px; border-radius: 2px; background: var(--track); }
.onb-progress span.on { background: var(--label); }
.brand { padding: 96px var(--gutter) 0; display: flex; flex-direction: column; gap: 10px; }
.brand-mark { width: 56px; height: 56px; border-radius: 14px; background: var(--label); color: var(--on-accent); display: flex; align-items: center; justify-content: center; }
.brand h1 { font-size: 34px; letter-spacing: -0.8px; margin-top: 12px; }
.bottom-cta { padding: 28px var(--gutter) 0; display: flex; flex-direction: column; gap: 12px; }

/* ---------- 16. Notifications ---------- */
.notif { display: flex; gap: 12px; padding: 14px var(--gutter); position: relative; }
.notif + .notif { border-top: 1px solid var(--sep-inset); }
.notif .n-ico { width: 34px; height: 34px; border-radius: 17px; background: var(--fill); color: var(--label); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.notif.unread .n-ico { background: var(--accent-tint); color: var(--accent); }
.notif .n-text { font-size: 15px; line-height: 1.45; }
.notif .u-dot { width: 8px; height: 8px; border-radius: 4px; background: var(--accent-fill); margin-top: 6px; flex-shrink: 0; }

/* Empty state */
.empty { padding: 36px 24px; text-align: center; color: var(--label-2); font-size: 15px; line-height: 1.5; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty .e-ico { color: var(--label-4); }

/* ---------- 17. Sheet / Alert / Toast ---------- */
.overlay { position: absolute; inset: 0; z-index: 40; background: transparent; pointer-events: none; transition: background .25s; display: flex; flex-direction: column; justify-content: flex-end; }
.overlay.active { pointer-events: auto; background: var(--dim); }
.overlay.closing { background: transparent; }
.sheet {
  background: var(--bg); border-radius: var(--r-sheet) var(--r-sheet) 0 0; max-height: 92%; display: flex; flex-direction: column;
  transform: translateY(100%); transition: transform .32s var(--ease); box-shadow: 0 -8px 30px rgba(0,0,0,.12);
}
.overlay.active .sheet { transform: none; }
.overlay.closing .sheet { transform: translateY(100%); }
.sheet .grabber { width: 36px; height: 5px; border-radius: 3px; background: #CDCDC9; margin: 6px auto 0; flex-shrink: 0; }
.sheet-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 8px; min-height: 52px; flex-shrink: 0; }
.sheet-head .s-title { font-size: 17px; font-weight: 600; text-align: center; }
.sheet-head .s-sub { font-size: 12px; color: var(--label-2); font-weight: 400; text-align: center; }
.sheet-head .left { justify-self: start; }
.sheet-head .right { justify-self: end; }
.sheet-body { overflow-y: auto; padding: 4px var(--group-gutter) calc(env(safe-area-inset-bottom, 0px) + 24px); display: flex; flex-direction: column; gap: 16px; }
@media (min-width: 500px) { .sheet-body { padding-bottom: 34px; } }

.overlay.alert-mode { justify-content: center; align-items: center; }
.alert {
  width: 272px; background: rgba(250,250,249,.98); border-radius: 14px; overflow: hidden; text-align: center;
  transform: scale(1.08); opacity: 0; transition: transform .22s var(--ease), opacity .18s;
}
.overlay.active .alert { transform: none; opacity: 1; }
.overlay.closing .alert { opacity: 0; }
.alert .a-body { padding: 20px 16px 16px; display: flex; flex-direction: column; gap: 4px; }
.alert h3 { font-size: 17px; font-weight: 600; }
.alert p { font-size: 13px; line-height: 1.45; color: var(--label); }
.alert .a-btns { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid #DDDDD9; }
.alert .a-btns button { height: 44px; font-size: 17px; color: var(--accent); }
.alert .a-btns button + button { border-left: 1px solid #DDDDD9; font-weight: 600; }
.alert .a-btns button.warn { color: var(--warn); }

.toast-root { position: absolute; bottom: 104px; left: 0; right: 0; z-index: 60; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; padding: 0 20px; }
.toast { max-width: 100%; padding: 11px 16px; border-radius: 14px; background: rgba(28,29,31,.92); color: #fff; font-size: 14px; line-height: 1.4; text-align: center; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); animation: toastIn .3s var(--ease); }
.toast.out { opacity: 0; transform: translateY(8px); transition: all .3s; }
@keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* Photo picker */
.photo-pick { display: flex; align-items: center; gap: 12px; padding: 12px 16px; width: 100%; text-align: left; cursor: pointer; }
.photo-pick .ph { width: 56px; height: 56px; border-radius: var(--r-sm); display: flex; align-items: center; justify-content: center; color: var(--label-3); }
.photo-large { display: block; width: 100%; aspect-ratio: 4 / 3; border-radius: var(--r-lg); cursor: pointer; }
.photo-large .ph-in { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--label-2); font-size: 15px; }

/* Weight sheet big input */
.big-input { display: flex; align-items: baseline; justify-content: center; gap: 6px; padding: 18px 0 6px; }
.big-input input { width: 170px; border: 0; outline: 0; background: transparent; text-align: right; font-size: 56px; font-weight: 700; letter-spacing: -2px; font-variant-numeric: tabular-nums; }
.big-input span { font-size: 22px; font-weight: 600; color: var(--label-2); }

/* 화면 ID 표시 (Figma 매핑용) */
body.show-ids [data-screen]::before {
  content: attr(data-screen); position: sticky; top: 0; float: right; z-index: 30; margin: 6px 8px 0 0;
  font: 600 10px/1 ui-monospace, Menlo, monospace; color: var(--accent); background: var(--accent-tint); padding: 4px 6px; border-radius: 4px;
}
.row.center .r-main { flex: 0 0 auto; align-items: center; }
.overlay.active ~ .toast-root { bottom: auto; top: 70px; }

/* ---------- 18. Splash / Auth ---------- */
.splash { position: absolute; inset: 0; z-index: 100; background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; transition: opacity .45s ease; }
.splash.hide { opacity: 0; pointer-events: none; }
.splash .brand-mark.lg { width: 84px; height: 84px; border-radius: 22px; animation: splashIn .6s var(--ease); }
.splash-name { font-size: 22px; font-weight: 700; letter-spacing: -0.4px; animation: splashIn .6s .1s var(--ease) both; }
@keyframes splashIn { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: none; } }
.auth-hero { padding: 120px var(--gutter) 0; display: flex; flex-direction: column; gap: 10px; }
.auth-hero h1 { font-size: 30px; letter-spacing: -0.7px; line-height: 1.3; margin-top: 14px; }
.auth-btns { padding: 0 var(--gutter); display: flex; flex-direction: column; gap: 10px; }
.auth-btn { height: 52px; width: 100%; border-radius: var(--r-md); border: 1px solid #DADAD6; background: var(--surface); font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; }
.auth-btn:active { background: #F2F2F0; }
.auth-btn.dark { background: var(--label); border-color: var(--label); color: var(--on-accent); }
.auth-btn.dark:active { background: #2A2B2E; }
.auth-sep { display: flex; align-items: center; gap: 12px; color: var(--label-3); font-size: 13px; margin: 6px 0; }
.auth-sep::before, .auth-sep::after { content: ''; flex: 1; height: 1px; background: var(--sep); }
.screen.auth-screen { display: flex; flex-direction: column; }
.agree { display: flex; align-items: center; gap: 10px; padding: 12px 16px; width: 100%; text-align: left; font-size: 15px; }
.agree .box { width: 22px; height: 22px; border-radius: 11px; border: 1.5px solid var(--label-4); display: flex; align-items: center; justify-content: center; color: transparent; flex-shrink: 0; }
.agree.on .box { background: var(--accent-fill); border-color: var(--accent); color: var(--on-accent); }
.agree + .agree { border-top: 1px solid var(--sep-inset); }
.agree.all { font-weight: 600; }
.field input[type="date"] { -webkit-appearance: none; appearance: none; min-height: 48px; }
.field input[type="date"]:invalid, .field input[type="date"].empty { color: var(--label-4); }
/* 한글은 단어 단위로 줄바꿈 */
body { word-break: keep-all; overflow-wrap: anywhere; }
.field input[type="date"] { text-align: right; line-height: 48px; }

/* ---------- 19. Picker field / Wheel date picker ---------- */
.picker-field { width: 100%; text-align: left; }
.picker-field:active { background: #F2F2F0; }
.pf-value { flex: 1; text-align: right; font-size: 16px; color: var(--label); font-variant-numeric: tabular-nums; }
.pf-value.empty { color: var(--label-4); }
.picker-field .chev { margin-left: -4px; }
.wheels { position: relative; height: 200px; display: grid; grid-template-columns: 1.3fr 1fr 1fr; background: var(--surface); border-radius: var(--r-lg); overflow: hidden; }
.wheel-band { position: absolute; left: 8px; right: 8px; top: 80px; height: 40px; border-radius: 8px; background: var(--fill); pointer-events: none; }
.wheel { position: relative; height: 200px; overflow-y: auto; scroll-snap-type: y mandatory; scrollbar-width: none; overscroll-behavior: contain;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 30%, #000 70%, transparent 100%); mask-image: linear-gradient(to bottom, transparent 0, #000 30%, #000 70%, transparent 100%); }
.wheel::-webkit-scrollbar { display: none; }
.wheel:focus-visible { outline: none; }
.wheel:focus-visible .wheel-item[aria-selected="true"] { color: var(--accent); }
.wheel-pad { height: 80px; }
.wheel-item { height: 40px; line-height: 40px; text-align: center; font-size: 20px; color: var(--label); scroll-snap-align: center; cursor: pointer; font-variant-numeric: tabular-nums; position: relative; }
.wheel-item[aria-selected="true"] { font-weight: 600; }
.wheel-item.off { color: var(--label-4); }
.picker-field .pf-value { margin-left: auto; flex: 0 1 auto; }
/* 숫자 입력 스핀 버튼 숨김 (iOS 느낌 유지) */
input[type="number"]::-webkit-outer-spin-button, input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
input[type="number"] { -moz-appearance: textfield; appearance: textfield; }

/* ---------- 20. Brand icon ---------- */
.brand-icon { width: 64px; height: 64px; display: block; filter: drop-shadow(0 6px 14px rgba(59,134,224,.25)); }
.splash .brand-icon { width: 112px; height: 112px; animation: splashIn .6s var(--ease); }
/* 식단 행 래퍼 (V2 스와이프 삭제용 · V1에서는 삭제 버튼 숨김) */
.meal-wrap { position: relative; overflow: hidden; border-radius: 8px; }
.meal-wrap + .meal-wrap { border-top: 1px solid var(--sep-inset); }
.meal-wrap .meal { position: relative; z-index: 1; background: var(--bg); transition: transform .25s var(--ease); touch-action: pan-y; }
.meal-del { display: none; }
.nav-count { display: inline-flex; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent-fill); color: var(--on-accent); font-size: 11px; font-weight: 700; align-items: center; justify-content: center; vertical-align: 2px; }

/* ---------- 21. 한 화면 맞춤 (가입 시작 · 신체 정보 · 식단 취향) ----------
   내용이 화면 높이 안에 들어가고, 주요 버튼은 항상 하단에 고정.
   아주 작은 화면에서는 잘리지 않도록 스크롤로 대체 (내용을 숨기지 않음) */
.screen.fit-screen { padding-bottom: 0; }
.fit { min-height: 100%; display: flex; flex-direction: column; }
.fit-cta { margin-top: auto; padding: 16px var(--gutter) calc(env(safe-area-inset-bottom, 0px) + 16px); }
@media (min-width: 500px) { .fit-cta { padding-bottom: 28px; } }
.fit-title { margin-top: 14px; }
.section.fit-sec { padding-top: clamp(14px, 2.6vh, 24px); }
.auth-hero { padding-top: clamp(36px, 11vh, 120px); }
.auth-btns.fit-cta { display: flex; flex-direction: column; gap: 10px; }

/* 옵션 카드: 가로 3칸 선택 (리스트보다 세로 공간을 적게 씀) */
.opt-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.opt { position: relative; min-height: 76px; border-radius: var(--r-lg); background: var(--surface); border: 1.5px solid transparent; padding: 12px 10px 10px; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; text-align: left; transition: border-color .15s, background .15s; }
.opt .o-t { font-size: 15px; font-weight: 600; }
.opt .o-s { font-size: 12px; color: var(--label-2); line-height: 1.35; }
.opt .check { position: absolute; top: 8px; right: 8px; width: 20px; height: 20px; border-radius: 10px; background: var(--accent-fill); color: var(--on-accent); display: flex; align-items: center; justify-content: center; visibility: hidden; }
.opt.selected { border-color: var(--accent); background: var(--accent-tint); }
.opt.selected .check { visibility: visible; }
.opt:active { transform: scale(.98); }
/* 짧은 화면(iPhone SE 등)에서 가입 시작 화면도 한 화면에 들어가도록 압축 */
@media (max-height: 700px) {
  .auth-hero { padding-top: 24px; gap: 6px; }
  .auth-hero h1 { font-size: 25px; margin-top: 8px; }
  .auth-hero .brand-icon { width: 60px; height: 60px; }
  .auth-btn { height: 48px; }
  .auth-btns.fit-cta { gap: 8px; padding-top: 10px; }
  .auth-sep { margin: 2px 0; }
}

/* ---------- 22. 기록: 주 단위 스와이프 + 월 달력 ---------- */
.week-head { display: flex; align-items: center; justify-content: space-between; padding-top: 6px; }
.week-head.pad { padding-right: calc(var(--gutter) - 10px); } /* 화살표 정렬 (음수 margin 대신 → 가로 넘침 방지) */
.week-label { font-size: 15px; font-weight: 600; }
.week-pager { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; }
.week-pager::-webkit-scrollbar { display: none; }
.week-pager .week { flex: 0 0 100%; scroll-snap-align: start; scroll-snap-stop: always; padding-top: 2px; }
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.cal-head .icon-btn:disabled { color: var(--label-4); }
.cal-title { font-size: 17px; font-weight: 600; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 2px; }
.cal-dow span { text-align: center; font-size: 12px; color: var(--label-2); padding: 4px 0 6px; }
.cal-day { height: 46px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
.cal-day .n { width: 34px; height: 34px; border-radius: 17px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums; }
.cal-day .pip { width: 4px; height: 4px; border-radius: 2px; background: var(--accent-bright); margin-top: -6px; }
.cal-day .pip.none { background: transparent; }
.cal-day.today .n { color: var(--accent); font-weight: 700; }
.cal-day.active .n { background: var(--accent-fill); color: var(--on-accent); font-weight: 700; }
.cal-day:disabled .n { color: var(--label-4); }

/* ---------- 23. 프로필 지표 · 이용약관 ---------- */
.pf-head { display: flex; align-items: center; gap: 16px; padding: 12px var(--gutter) 4px; }
.pf-trip { display: grid; grid-template-columns: repeat(3, 1fr); font-size: 13px; color: var(--label-2); }
.pf-trip span:nth-child(2) { text-align: center; } .pf-trip span:last-child { text-align: right; }
.pf-trip b { color: var(--label); font-weight: 600; }
.bmi-scale { position: relative; display: flex; gap: 3px; height: 8px; margin-top: 12px; }
.bmi-scale span { border-radius: 4px; background: var(--track); }
.bmi-scale span:nth-child(2) { background: var(--accent-bright); opacity: .55; }
.bmi-scale i { position: absolute; top: -4px; width: 4px; height: 16px; border-radius: 2px; background: var(--label); transform: translateX(-50%); box-shadow: 0 0 0 2px var(--surface); }
.bmi-legend { display: grid; grid-template-columns: 3.5fr 4.5fr 12fr; gap: 3px; margin-top: 6px; white-space: nowrap; }
.bmi-legend span { text-align: center; }
.pf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
.pf-grid .group { padding: 14px; display: flex; flex-direction: column; gap: 2px; }
.pf-grid b { font-size: 21px; font-weight: 700; letter-spacing: -.4px; margin: 2px 0; }
.macro-split { display: flex; gap: 3px; height: 10px; }
.macro-split span { border-radius: 5px; }
.macro-split .c, .pf-macros .dot.c { background: var(--macro-carb); }
.macro-split .p, .pf-macros .dot.p { background: var(--macro-prot); }
.macro-split .f, .pf-macros .dot.f { background: var(--macro-fat); }
.pf-macros { display: grid; grid-template-columns: repeat(3, 1fr); }
.pf-macros > div { display: grid; grid-template-columns: 12px 1fr; column-gap: 6px; align-items: center; }
.pf-macros .dot { width: 8px; height: 8px; border-radius: 4px; }
.pf-macros b { grid-column: 2; font-size: 17px; font-weight: 700; }
.pf-macros .t-caption { grid-column: 2; }
.terms { padding-bottom: 24px; }
.terms-sec { padding: 14px var(--gutter); border-top: 1px solid var(--sep-inset); }
.terms-sec h2 { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
.terms-sec p, .terms-sec li { font-size: 14px; line-height: 1.65; color: var(--label); }
.terms-sec ol { padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }

/* ---------- 24. 영양소 색 · 입력 오류 ---------- */
.mdot { display: inline-block; width: 7px; height: 7px; border-radius: 4px; margin-right: 5px; vertical-align: 1px; }
.mdot.carb { background: var(--macro-carb); } .mdot.prot { background: var(--macro-prot); } .mdot.fat { background: var(--macro-fat); }
.bar.m-carb > i { background: var(--macro-carb); } .bar.m-prot > i { background: var(--macro-prot); } .bar.m-fat > i { background: var(--macro-fat); }
.macro-line { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.field-error { padding: 0 16px 10px; margin-top: -2px; font-size: 13px; line-height: 1.4; color: var(--warn); }
.field-error::before { content: '! '; font-weight: 700; }
.opt-cards + .field-error, .group + .field-error, .big-input + .field-error { padding: 8px 4px 0; text-align: left; }
.big-input + .field-error { text-align: center; }
.field.is-invalid label, .field.is-invalid .f-label { color: var(--warn); }
.field.is-invalid input { color: var(--warn); }
.opt-cards.is-invalid .opt, .group.is-invalid { box-shadow: 0 0 0 1.5px var(--warn); }
.big-input.is-invalid input { color: var(--warn); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}

/* ---------- 25. 프로필 사진 ---------- */
.avatar.has-photo { overflow: hidden; background: var(--fill); }
.avatar.has-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.avatar.xl { width: 72px; height: 72px; font-size: 28px; }
.avatar.xxl { width: 112px; height: 112px; font-size: 42px; }
.avatar-edit { position: relative; flex-shrink: 0; border-radius: 50%; }
.avatar-badge { position: absolute; right: -2px; bottom: -2px; width: 28px; height: 28px; border-radius: 14px; background: var(--accent-fill); color: var(--on-accent); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 3px var(--bg); }
.avatar-edit:active .avatar { opacity: .8; }

/* ---------- 26. 출시 준비 화면 (계정 · 주문 · 고객센터) ---------- */
.post .who { align-items: center; }
.post-more { width: 36px; height: 36px; margin-right: -8px; color: var(--label-3); }
.wd-list { display: flex; flex-direction: column; gap: 10px; padding-left: 18px; font-size: 15px; line-height: 1.5; color: var(--label-2); }
.wd-list b { color: var(--label); font-weight: 600; }
.ship-steps { display: grid; grid-template-columns: repeat(3, 1fr); position: relative; margin-bottom: 18px; }
.ship-steps::before { content: ''; position: absolute; left: 16.6%; right: 16.6%; top: 6px; height: 2px; background: var(--track); }
.ship-steps > div { display: flex; flex-direction: column; align-items: center; gap: 8px; position: relative; color: var(--label-3); }
.ship-steps .dot { width: 14px; height: 14px; border-radius: 7px; background: var(--track); box-shadow: 0 0 0 3px var(--surface); }
.ship-steps .on { color: var(--label); }
.ship-steps .on .dot { background: var(--accent-bright); }
.ship-hist { display: flex; flex-direction: column; gap: 8px; padding-top: 14px; border-top: 1px solid var(--sep-inset); }
.ship-hist > div { display: flex; gap: 12px; align-items: baseline; }
.ship-hist .t-caption { width: 76px; flex-shrink: 0; }
.acc + .acc { border-top: 1px solid var(--sep-inset); }
.acc summary { list-style: none; display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 10px 16px; cursor: pointer; }
.acc summary::-webkit-details-marker { display: none; }
.acc summary .chev { transform: rotate(90deg); transition: transform .2s var(--ease); }
.acc[open] summary .chev { transform: rotate(-90deg); }
.acc p { padding: 0 16px 16px; font-size: 15px; line-height: 1.6; color: var(--label-2); white-space: pre-line; }
.ask-text { width: 100%; min-height: 120px; border: 0; outline: 0; resize: none; background: transparent; font-size: 16px; line-height: 1.5; padding: 4px 0 12px; }
.choice .r-sub { white-space: normal; }

/* ---------- 27. 다크 테마 (html[data-theme="dark"]) ---------- */
html[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0E1117; --surface: #1A1E26;
  --label: #EEF2F7; --label-2: #AEB7C3; --label-3: #8C96A4; --label-4: #5F6976;
  --sep: #2A303A; --sep-inset: #262B34; --fill: #252B34; --track: #2E3540;
  --accent: #4A90E6; --accent-bright: #4A92E8; --accent-press: #285FAA; --accent-tint: #1A2A40;
  --macro-carb: #4A92E8; --macro-prot: #34B5B1; --macro-fat: #8592A8;
  --warn: #F0814F; --warn-tint: #3A2219;
  --accent-fill: #2F6FC4; --warn-fill: #B84E25;  /* 다크: 텍스트용보다 진한 채움색 → 흰 글자 5:1 */ --dim: rgba(0, 0, 0, .55);
  --ph-ready: #2A2824; --ph-mealkit: #232A25; --ph-protein: #252830; --ph-drink: #212B32; --ph-photo: #262B33;
}
html[data-theme="dark"] body { background: #05070A; }
html[data-theme="dark"] .navbar.scrolled { background: rgba(14,17,23,.94); }
html[data-theme="dark"] .app-frame.white .navbar.scrolled { background: rgba(26,30,38,.94); }
html[data-theme="dark"] .tabbar { background: rgba(26,30,38,.94); }
html[data-theme="dark"] .footer-bar { background: rgba(26,30,38,.96); }
html[data-theme="dark"] .alert { background: rgba(38,43,52,.98); }
html[data-theme="dark"] .alert .a-btns, html[data-theme="dark"] .alert .a-btns button + button { border-color: var(--sep); }
html[data-theme="dark"] .seg button.active { background: #3A414D; }
html[data-theme="dark"] .chip.active { color: var(--bg); }
html[data-theme="dark"] .brand-mark { background: var(--fill); color: var(--label); }
html[data-theme="dark"] .quick-buy-btn { background: rgba(26,30,38,.94); }
html[data-theme="dark"] .avatar { background: #2C323C; }
html[data-theme="dark"] .btn-pill, html[data-theme="dark"] .auth-btn { border-color: var(--sep); }
html[data-theme="dark"] .slot .rail .line { background: var(--sep); }
html[data-theme="dark"] .sheet .grabber { background: #4A515C; }
html[data-theme="dark"] button.row:active, html[data-theme="dark"] a.row:active, html[data-theme="dark"] .row.tap:active,
html[data-theme="dark"] .picker-field:active, html[data-theme="dark"] .auth-btn:active { background: #232831; }
html[data-theme="dark"] .btn.secondary:active { background: #22344D; }
html[data-theme="dark"] .v2-slot { border-color: #3A4350; }
html[data-theme="dark"] .v2-slot.done { border-color: transparent; }
html[data-theme="dark"] .v2-slot:active { background: #222731; }
html[data-theme="dark"] .toast { background: rgba(58,64,74,.96); }
html[data-theme="dark"] img.ph-img, html[data-theme="dark"] .ph img { filter: brightness(.92); }
.acc summary .r-main { flex: 1; min-width: 0; }

/* ---------- 28. 스플래시 (아이콘 시안 기준: 중앙이 밝은 아이스 톤 배경 + 마크만 표시) ---------- */
.splash { background: radial-gradient(ellipse 75% 55% at 50% 50%, #F1F6FD 0%, #E7EEF7 55%, #DCE4EF 100%); }
.splash .brand-icon { width: 136px; height: 136px; }
html[data-theme="dark"] .splash { background: radial-gradient(ellipse 75% 55% at 50% 50%, #18202C 0%, #111721 60%, #0B0F15 100%); }

/* ---------- 29. 터치 영역 보정 — 보이는 크기는 유지하고 탭 영역만 44px 이상으로 확장 ---------- */
.seg button, .chip, .btn-pill, .act, .btn-sm, .nav-pill, .post-more, .stepper button, .icon-btn.accent, .day { position: relative; }
.seg button::before, .chip::before, .btn-pill::before, .act::before, .btn-sm::before, .nav-pill::before, .post-more::before,
.stepper button::before, .icon-btn.accent::before, .day::before, .rec-date::before, .quick-buy-btn::before {
  content: ''; position: absolute; left: 50%; top: 50%; width: max(100%, 44px); height: max(100%, 44px); transform: translate(-50%, -50%);
}

/* 새 아이콘(입체 큐브)은 형태가 복잡해 작게 보이면 뭉개지므로 시작 화면에서 크게 */
.auth-hero .brand-icon { width: 76px; height: 76px; margin-left: -4px; filter: drop-shadow(0 8px 16px rgba(31,107,203,.22)); }
@media (max-height: 700px) { .auth-hero .brand-icon { width: 60px; height: 60px; } }

/* =========================================================
   V2 · Ice Ring (Action-first) — V1 토큰 위에 덮어쓰는 차이만 정의
   · 아이콘의 링 모티프 → 원형 칼로리 게이지
   · 그룹 라운드 18, 면 대비를 조금 더 (흰 면 + 아이스 배경)
   · 리뷰 반영: 터치 영역 44px, 탭바 아이콘 < 텍스트 무게, 구매보다 기록이 강한 버튼 위계
   ========================================================= */
.variant-v2 { --r-lg: 18px; }

/* 홈 히어로: 원형 게이지 */
.v2-hero { padding: 20px var(--gutter) 0; display: flex; flex-direction: column; align-items: center; }
.v2-ring { position: relative; width: 228px; height: 228px; }
.v2-ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.v2-ring-center .k { font-size: 14px; font-weight: 500; color: var(--label-2); }
.v2-ring-center .v { font-size: 48px; font-weight: 700; letter-spacing: -1.6px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.v2-ring-center .u { font-size: 15px; font-weight: 600; color: var(--label-2); }
.v2-kpi { margin-top: 14px; display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--label-2); }
.v2-kpi b { color: var(--label); font-weight: 600; }
.v2-kpi .sep { width: 1px; height: 12px; background: var(--sep); }
.v2-macros { align-self: stretch; margin-top: 22px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.v2-actions { margin-top: 24px; display: grid; grid-template-columns: 1.4fr 1fr; gap: 10px; }
.v2-actions .btn { height: 54px; border-radius: 16px; }

/* 오늘 식사 4칸 */
.v2-slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.v2-slot { min-height: 96px; border-radius: 16px; background: var(--surface); display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; padding: 12px; text-align: left; border: 1px dashed #C9D5E3; }
.v2-slot.done { border: 1px solid transparent; }
.v2-slot:active { background: #F1F5FA; }
.v2-slot .s { font-size: 13px; color: var(--label-2); font-weight: 500; }
.v2-slot .kc { font-size: 19px; font-weight: 700; letter-spacing: -.4px; }
.v2-slot .plus { color: var(--accent); display: flex; }

/* AI 추천 한 줄 */
.v2-ai-link { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; text-align: left; }
.v2-ai-ph { width: 56px; height: 56px; border-radius: 12px; }

/* 크루 인증 점 */
.v2-dots { display: flex; gap: 4px; }
.v2-dots span { width: 8px; height: 8px; border-radius: 4px; background: var(--track); }
.v2-dots span.on { background: var(--mint); }

/* 탭바: 아이콘이 텍스트보다 강하지 않게 (24px · 선 1.5, 라벨 11px) */
.variant-v2 .tab-item svg { width: 24px; height: 24px; }
.variant-v2 .tab-item { font-size: 11px; gap: 2px; }
.variant-v2 .tab-item.active { font-weight: 700; }

/* 터치 영역 44px 확보 */
.variant-v2 .chip { height: 40px; padding: 0 16px; }
.variant-v2 .seg { height: 38px; }
.variant-v2 .seg.sm { height: 36px; }
.variant-v2 .nav-points { height: 44px; }
.variant-v2 .stepper, .variant-v2 .stepper button { height: 40px; }
.variant-v2 .btn-pill { height: 36px; position: relative; }
.variant-v2 .btn-pill::after, .variant-v2 .btn-sm::after { content: ''; position: absolute; inset: -6px -2px; }
.variant-v2 .btn-sm { position: relative; height: 38px; }
.variant-v2 .search { height: 42px; }

/* 쇼핑: 장바구니처럼 보이던 바로결제 아이콘 제거 (결제는 상세의 '구매하기'로 일원화) */
.variant-v2 .quick-buy-btn { display: none; }

/* 기록: 스와이프 삭제 */
.variant-v2 .meal-del { display: flex; position: absolute; right: 0; top: 0; bottom: 0; width: 84px; align-items: center; justify-content: center; background: var(--warn-fill); color: var(--on-accent); font-size: 15px; font-weight: 600; border-radius: 0 8px 8px 0; }
.variant-v2 .meal-wrap .meal { padding-right: 4px; }

/* 내비 바 알약 버튼 (연속 기록 · 포인트) — 보이는 높이 32, 터치 영역 44 */
.nav-pill { position: relative; height: 32px; padding: 0 10px; margin: 6px 2px; border-radius: 16px; background: var(--surface); display: inline-flex; align-items: center; gap: 4px; font-size: 15px; font-weight: 600; box-shadow: 0 0 0 1px var(--sep); }
.nav-pill::after { content: ''; position: absolute; inset: -6px -2px; }
.nav-pill.streak { color: var(--label-3); }
.nav-pill.streak .num { color: var(--label); }
.nav-pill.streak.on { color: var(--accent-bright); }

/* 연속 기록 시트 */
.sk-hero { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0 2px; text-align: center; }
.sk-flame { width: 76px; height: 76px; border-radius: 38px; background: var(--fill); color: var(--label-3); display: flex; align-items: center; justify-content: center; }
.sk-flame.on { background: var(--accent-tint); color: var(--accent-bright); }
.sk-num { font-size: 40px; font-weight: 700; letter-spacing: -1px; margin-top: 6px; }
.sk-num span { font-size: 18px; font-weight: 600; margin-left: 4px; letter-spacing: 0; }
.sk-week { display: grid; grid-template-columns: repeat(7, 1fr); padding: 14px 8px; }
.sk-day { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.sk-dot { width: 30px; height: 30px; border-radius: 15px; background: var(--fill); display: flex; align-items: center; justify-content: center; color: #fff; }
.sk-day.on .sk-dot { background: var(--accent-bright); }
.sk-day.today .sk-dot { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent-bright); }
.sk-day.fut .sk-dot { background: transparent; border: 1.5px dashed var(--label-4); }
.nav-pill { white-space: nowrap; }

/* 작은 화면(iPhone SE 등): 게이지를 줄여 '오늘 식사'까지 첫 화면에 더 보이게 */
@media (max-height: 700px) {
  .v2-ring, .v2-ring svg { width: 184px; height: 184px; }
  .v2-ring-center .v { font-size: 40px; }
  .v2-hero { padding-top: 12px; }
  .v2-macros { margin-top: 16px; }
  .v2-actions { margin-top: 18px; }
}

</style>
</head>

/* =========================================================

   (전역 네임스페이스 AF 사용: file:// 로도 바로 열 수 있도록 ES Module 미사용)
   ========================================================= */
window.AF = window.AF || {};

AF.utils = (function () {
  const U = {};

  /* ---------- 날짜 ---------- */
  U.DOW = ['일', '월', '화', '수', '목', '금', '토'];
  U.pad = (n) => String(n).padStart(2, '0');
  U.fmt = (d) => `${d.getFullYear()}-${U.pad(d.getMonth() + 1)}-${U.pad(d.getDate())}`;
  U.parse = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };

  // 테스트/시연용: URL에 ?today=2026-10-13 을 붙이면 오늘 날짜를 고정할 수 있음
  let todayOverride = null;
  U.setToday = (s) => { todayOverride = s; };
  U.today = () => todayOverride || U.fmt(new Date());

  U.addDays = (s, n) => { const d = U.parse(s); d.setDate(d.getDate() + n); return U.fmt(d); };
  U.dow = (s) => U.parse(s).getDay();
  U.diffDays = (a, b) => Math.round((U.parse(a) - U.parse(b)) / 86400000);
  U.mondayOf = (s) => { const w = U.dow(s); return U.addDays(s, w === 0 ? -6 : 1 - w); };
  U.weekDays = (s) => { const m = U.mondayOf(s); return Array.from({ length: 7 }, (_, i) => U.addDays(m, i)); };
  U.md = (s) => { const d = U.parse(s); return `${d.getMonth() + 1}월 ${d.getDate()}일`; };
  U.mdDow = (s) => `${U.md(s)} (${U.DOW[U.dow(s)]})`;
  U.dotDate = (s) => s.replace(/-/g, '.');
  // from 이후(당일 제외)로 처음 오는 요일(월/수 등)의 날짜
  U.nextWeekday = (from, ko) => {
    const target = U.DOW.indexOf(ko);
    let d = U.addDays(from, 1);
    while (U.dow(d) !== target) d = U.addDays(d, 1);
    return d;
  };
  U.relTime = (ts) => {
    const m = Math.floor((Date.now() - ts) / 60000);
    if (m < 1) return '방금 전';
    if (m < 60) return `${m}분 전`;
    const h = Math.floor(m / 60);
    if (h < 24) return `${h}시간 전`;
    return `${Math.floor(h / 24)}일 전`;
  };
  U.timeHM = (ts) => {
    const d = new Date(ts); const h = d.getHours();
    return `${h < 12 ? '오전' : '오후'} ${h % 12 === 0 ? 12 : h % 12}:${U.pad(d.getMinutes())}`;
  };

  /* ---------- 포맷 / 헬퍼 ---------- */
  U.num = (n) => Number(n || 0).toLocaleString('ko-KR');
  U.won = (n) => `${U.num(n)}원`;
  U.pt = (n) => `${U.num(n)} P`;
  U.signed = (n, unit = '') => `${n > 0 ? '+' : n < 0 ? '−' : ''}${U.num(Math.abs(n))}${unit}`;
  U.round1 = (n) => Math.round(n * 10) / 10;
  U.clamp = (n, a, b) => Math.min(b, Math.max(a, n));
  U.pct = (v, max) => (max > 0 ? U.clamp(Math.round((v / max) * 100), 0, 100) : 0);
  U.uid = (p = 'id') => `${p}_${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`;
  U.esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  U.deepClone = (o) => JSON.parse(JSON.stringify(o));

  /* ---------- 계산 로직 (화면 어디서든 같은 값을 쓰도록 한 곳에서 관리) ---------- */
  // 권장 칼로리: HTML 2(tlqkf.html)의 산식 그대로 — 체중 × 24 × 활동계수
  U.recommendCal = (weight, activity) => Math.round(weight * 24 * activity);
  // 탄단지 목표: 2,100kcal 기준 220/110/55g (HTML 1·2 값)을 목표 칼로리에 비례 적용
  U.macroTargets = (cal) => ({
    carb: Math.round((cal * 220) / 2100),
    prot: Math.round((cal * 110) / 2100),
    fat: Math.round((cal * 55) / 2100),
  });
  U.bmi = (kg, cm) => kg / Math.pow(cm / 100, 2);
  // 판정 기준: HTML 1(antifreeze_app.html)의 BMI 기준
  U.bmiStatus = (b) => {
    if (b < 18.5) return { label: '저체중', tone: 'blue' };
    if (b < 23) return { label: '정상 체중', tone: 'green' };
    return { label: '과체중', tone: 'amber' };
  };
  U.activityLabel = (v) => ({ '1.2': '비활동적 (운동 거의 안 함)', '1.375': '보통 활동 (주 1~3회 운동)', '1.55': '활동적 (주 4~5회 운동)' }[String(v)] || '');
