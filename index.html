        { id: 'n2', kind: 'meal', icon: '', text: '아직 오늘 간식 기록이 없어요. 식단을 기록하고 +5P를 받아보세요.', ts: now - 2 * 3600000, read: false },
        { id: 'n3', kind: 'ai', icon: '', text: '새로운 AI 추천 식단이 준비되었어요. 홈에서 확인해 보세요.', ts: now - 5 * 3600000, read: false },
      ],
      aiIndex: 0,
    };
  }

  /* ---------- 저장 / 불러오기 ---------- */
  function read() {
    try { return window.localStorage.getItem(KEY); } catch (e) { return memStore[KEY] || null; }
  }
  function write(str) {
    try { window.localStorage.setItem(KEY, str); } catch (e) { memStore[KEY] = str; }
  }
  function load() {
    try {
      const raw = read();
      const obj = raw ? JSON.parse(raw) : null;
      S = obj && obj.v === VERSION ? obj : seed();
    } catch (e) { S = seed(); }
    ensureDay();
    save();
    return S;
  }
  function save() { write(JSON.stringify(S)); }
  function reset() {
    try { window.localStorage.removeItem(KEY); } catch (e) { delete memStore[KEY]; }
    S = seed(); save();
    AF.ui_state = null;
  }

  /* ---------- 날짜 롤오버 (앱을 다음 날 열었을 때) ---------- */
  function ensureDay() {
    const t = U.today();
    if (S.meta.lastDay === t) return false;
    const last = S.meta.lastDay;
    const meVerifiedLast = S.user.verifyDates.includes(last);
    S.crews.forEach((c) => {
      if (!c.mine || !c.members) return;
      c.log = c.log || {};
      c.log[last] = c.members.filter((m) => (m.id === 'me' ? meVerifiedLast : m.verified)).length;
      c.members.forEach((m) => { if (m.id !== 'me') m.verified = !!m.sim; });   // 오늘 인증 현황 초기화(시뮬레이션 멤버는 인증 완료 상태로)
    });
    S.meta.lastDay = t;
    return true;
  }

  /* ---------- UI 상태 (저장하지 않는 값) ---------- */
  function ui() {
    if (!AF.ui_state) {
      const mine = S.crews.filter((c) => c.mine);
      AF.ui_state = {
        recordDate: U.today(),
        shopFilter: S.user.pref === 'ready' ? 'ready' : S.user.pref === 'mealkit' ? 'mealkit' : 'all',
        shopQuery: '',
        statsRange: 'week',
        crewId: mine[0] ? mine[0].id : null,
        crewTab: 'mine',
        exploreQuery: '',
        foodCtx: null,
        sheet: null,
      };
    }
    return AF.ui_state;
  }

  return { load, save, reset, ensureDay, ui, get data() { return S; }, KEY };
})();

/* =========================================================
   Selector — 상태에서 계산되는 값 (홈/기록/통계가 모두 같은 함수를 사용)
   ========================================================= */
AF.sel = (function () {
  const U = AF.utils;
  const S = () => AF.state.data;
  const sel = {};

  sel.today = () => U.today();
  sel.dayMeals = (date) => S().meals[date] || [];
  sel.dayTotals = (date) => sel.dayMeals(date).reduce(
    (a, m) => ({ cal: a.cal + (+m.cal || 0), carb: a.carb + (+m.carb || 0), prot: a.prot + (+m.prot || 0), fat: a.fat + (+m.fat || 0) }),
    { cal: 0, carb: 0, prot: 0, fat: 0 });
  sel.targets = () => ({ cal: S().user.targetCal, ...U.macroTargets(S().user.targetCal) });
  // 오늘의 칼로리 현황: 섭취 → 잔여 → 진행률
  sel.calorie = (date = U.today()) => {
    const tot = sel.dayTotals(date); const tg = sel.targets();
    const remaining = tg.cal - tot.cal;
    return { consumed: tot.cal, target: tg.cal, remaining, over: remaining < 0, pct: U.pct(tot.cal, tg.cal), rawPct: tg.cal ? Math.round((tot.cal / tg.cal) * 100) : 0, macros: tot, macroTarget: tg };
  };

  /* 체중 */
  sel.weightOn = (date) => S().weights[date];
  sel.latestWeight = (onOrBefore = U.today()) => {
    const keys = Object.keys(S().weights).filter((k) => k <= onOrBefore).sort();
    return keys.length ? S().weights[keys[keys.length - 1]] : null;
  };
  sel.weightSeries = (days) => {
    const t = U.today(); const from = U.addDays(t, -(days - 1));
    return Object.keys(S().weights).filter((k) => k >= from && k <= t).sort().map((k) => ({ date: k, value: S().weights[k] }));
  };
  sel.weightDelta = (days) => {
    const s = sel.weightSeries(days);
    return s.length >= 2 ? U.round1(s[s.length - 1].value - s[0].value) : null;
  };
  sel.bmi = (kg) => {
    const w = kg == null ? sel.latestWeight() : kg;
    return w ? U.round1(U.bmi(w, S().user.height)) : null;
  };

  /* 인증 / 스트릭 / 크루 */
  sel.meVerifiedToday = () => S().user.verifyDates.includes(U.today());
  sel.streak = () => {
    const set = new Set(S().user.verifyDates); const t = U.today();
    let d = set.has(t) ? t : U.addDays(t, -1); let n = 0;
    while (set.has(d)) { n++; d = U.addDays(d, -1); }
    return n;
  };
  /* 개인 연속 기록(식단): 하루 1끼 이상 기록한 날이 며칠 연속인지
     오늘 기록 전이면 어제까지의 연속 일수를 보여주고, 오늘 기록하면 이어짐 */
  sel.loggedOn = (date) => (S().meals[date] || []).length > 0;
  sel.logStreak = () => {
    const t = U.today(); let d = sel.loggedOn(t) ? t : U.addDays(t, -1); let n = 0;
    while (sel.loggedOn(d)) { n++; d = U.addDays(d, -1); }
    return { days: n, today: sel.loggedOn(t), nextReward: 7 - (n % 7) };
  };
  sel.bestLogStreak = () => {
    const days = Object.keys(S().meals).filter(sel.loggedOn).sort(); let best = 0; let cur = 0; let prev = null;
    days.forEach((x) => { cur = prev && U.addDays(prev, 1) === x ? cur + 1 : 1; best = Math.max(best, cur); prev = x; });
    return best;
  };
  sel.myCrews = () => S().crews.filter((c) => c.mine);
  sel.currentCrew = () => {
    const mine = sel.myCrews(); const id = AF.state.ui().crewId;
    return mine.find((c) => c.id === id) || mine[0] || null;
  };
  sel.crewToday = (c) => {
    const total = c.members.length;
    const verified = c.members.filter((m) => (m.id === 'me' ? sel.meVerifiedToday() : m.verified)).length;
    return { verified, total, pct: total ? Math.round((verified / total) * 100) : 0, allDone: total >= 2 && verified === total };
  };
  sel.crewWeekPct = (c) => {
    const t = U.today(); const start = [U.mondayOf(t), c.createdDate].sort().pop();
    let got = 0; let den = 0;
    for (let x = start; x <= t; x = U.addDays(x, 1)) {
      got += x === t ? sel.crewToday(c).verified : (c.log && c.log[x]) || 0;
      den += c.members.length;
    }
    return den ? Math.round((got / den) * 100) : 0;
  };
  // 신고한 게시물과 차단한 사용자의 게시물은 피드에서 숨김
  sel.crewFeed = (crewId) => { const bl = S().user.blocked || []; return S().feed.filter((f) => f.crewId === crewId && !f.reported && !bl.includes(f.author)).sort((a, b) => b.ts - a.ts); };

  /* 포인트: 하루 100P / 주간 300P 상한 (크루 리워드에만 적용, 구매 적립은 제외) */
  sel.rewardUsage = () => {
    const t = U.today(); const mon = U.mondayOf(t); const sun = U.addDays(mon, 6);
    let day = 0; let week = 0;
    S().points.log.forEach((l) => {
      if (l.type !== 'reward' || l.amount <= 0) return;
      if (l.date === t) day += l.amount;
      if (l.date >= mon && l.date <= sun) week += l.amount;
    });
    const R = AF.data.reward;
    return { day, week, dayLeft: Math.max(0, R.dayCap - day), weekLeft: Math.max(0, R.weekCap - week) };
  };

  /* AI 추천: 잔여 칼로리 + 취향(완제품/밀키트/혼합) 기반 */
  sel.aiList = () => {
    const rem = sel.calorie().remaining; const pref = S().user.pref;
    let list = AF.data.products.filter((p) => p.cat === 'mealkit' || p.cat === 'ready');
    if (pref === 'ready') list = list.filter((p) => p.cat === 'ready');
    if (pref === 'mealkit') list = list.filter((p) => p.cat === 'mealkit');
    const fit = list.filter((p) => p.cal <= rem);
    return fit.length ? fit.sort((a, b) => b.prot - a.prot) : list.sort((a, b) => a.cal - b.cal);
  };
  sel.aiPick = () => {
    const list = sel.aiList(); const c = sel.calorie();
    const p = list[S().aiIndex % list.length];
    const protShort = Math.max(0, c.macroTarget.prot - c.macros.prot);
    const label = AF.data.catLabel[p.cat];
    const reason = c.remaining > 0
      ? `오늘 잔여 ${U.num(c.remaining)} kcal 안에서 ${p.cal} kcal로 단백질 ${p.prot}g을 채울 수 있는 ${label}입니다.${protShort > 0 ? ` (단백질 부족분 ${protShort}g 보충)` : ''}`
      : `오늘 목표 칼로리를 이미 채웠어요. ${p.cal} kcal로 가볍게 즐길 수 있는 ${label}를 골랐어요.`;
    return { product: p, reason };
  };

  /* 구독 */
  sel.yesterdayExceeded = () => {
    const y = U.addDays(U.today(), -1); const tot = sel.dayTotals(y).cal;
    return tot > S().user.targetCal && tot > 0;
  };
  sel.subWeek = () => Math.floor(U.diffDays(U.today(), S().subscription.startDate) / 7) + 1;

  /* 알림 */
  sel.unread = () => S().notifs.filter((n) => !n.read).length;

  return sel;
})();

/* ===== actions.js ===== */
/* =========================================================
   actions.js — 상태를 바꾸는 모든 동작 (입력 → 저장 → 연관 화면 반영)
   화면 코드는 여기 함수만 호출하고, 계산/규칙은 이 파일에만 둔다.
   각 함수는 { ok, msg, ... } 를 반환 → 호출한 쪽에서 토스트로 안내
   ========================================================= */
window.AF = window.AF || {};

AF.actions = (function () {
  const U = AF.utils;
  const D = AF.data;
  const R = D.reward;
  const S = () => AF.state.data;
  const SEL = AF.sel;
  const A = {};

  const commit = () => { AF.state.save(); if (AF.app) AF.app.refresh(); };
  const fail = (msg) => ({ ok: false, msg });

  // 알림 추가 (알림 설정에서 꺼둔 종류는 쌓지 않음)
  function notify(kind, icon, text) {
    const st = S().notifSettings;
    if ((kind === 'meal' && !st.meal) || (kind === 'crew' && !st.crew) || (kind === 'delivery' && !st.delivery)) return;
    S().notifs.unshift({ id: U.uid('n'), kind, icon, text, ts: Date.now(), read: false });
  }

  /* ---------- 포인트 ---------- */
  // 크루/식단 리워드: 하루 100P · 주간 300P 상한 적용. 실제 지급된 포인트를 반환
  function grantReward(label, amount) {
    const u = SEL.rewardUsage();
    const g = Math.min(amount, u.dayLeft, u.weekLeft);
    if (g <= 0) return 0;
    S().points.balance += g;
    S().points.log.unshift({ id: U.uid('pl'), date: U.today(), ts: Date.now(), label, amount: g, type: 'reward' });
    return g;
  }
  const rewardNote = (g, want) => (g >= want ? `리워드 +${g}P` : g > 0 ? `리워드 +${g}P (한도 도달)` : '리워드 한도에 도달했어요');

  /* ---------- 온보딩 / 프로필 ---------- */
  A.completeOnboarding = (d) => {
    const u = S().user;
    Object.assign(u, { gender: d.gender, age: d.age, height: d.height, targetWeight: d.targetWeight, activity: d.activity, targetCal: d.targetCal, pref: d.pref, onboarded: true });
    // 가입 단계에서 받은 계정 · 프로필 정보 (있을 때만 반영)
    u.loggedOut = false;
    if (d.nickname) u.name = d.nickname;
    if (d.email) u.email = d.email;
    if (d.birth) u.birth = d.birth;
    if (d.provider) u.provider = d.provider;
    S().weights[U.today()] = d.weight;
    AF.ui_state = null;           // 취향(shopFilter 기본값) 반영을 위해 UI 상태 초기화
    commit();
    return { ok: true, msg: `${u.name}님, 환영해요. 오늘부터 시작해 볼까요?` };
  };

  A.loginDemo = (email) => {
    const u = S().user; if (email) u.email = email;
    u.onboarded = true; u.loggedOut = false; AF.ui_state = null; commit();
    return { ok: true, msg: `${u.name}님, 다시 만나서 반가워요.` };
  };

  // 로그아웃: 기기의 기록은 그대로 두고 로그인 화면으로 (다시 로그인하면 이어서 사용)
  A.logout = () => { S().user.loggedOut = true; AF.ui_state = null; AF.state.save(); return { ok: true, msg: '로그아웃했어요.' }; };
  // 프로필 사진: dataURL 저장 / null 이면 기본 프로필(이니셜)로
  A.setPhoto = (dataUrl) => { S().user.photo = dataUrl || null; commit(); return { ok: true, msg: dataUrl ? '프로필 사진을 바꿨어요.' : '기본 프로필로 바꿨어요.' }; };

  A.saveProfile = (d) => {
    const u = S().user;
    const cw = SEL.latestWeight() || 70;
    // 칼로리를 직접 고치지 않았다면 신체 정보 기준으로 권장 칼로리를 다시 계산 (HTML 2: 재계산 및 저장)
    const cal = d.calTouched ? d.targetCal : U.recommendCal(cw, d.activity);
    Object.assign(u, { gender: d.gender, age: d.age, height: d.height, activity: d.activity, targetWeight: d.targetWeight, targetCal: cal });
    commit();
    return { ok: true, msg: `목표를 저장했어요 · 하루 목표 ${U.num(cal)} kcal` };
  };

  /* ---------- 식단 ---------- */
  function validateMeal(p) {
    const name = String(p.name || '').trim();
    if (!name) return '음식명을 입력해 주세요.';
    const cal = Number(p.cal);
    if (p.cal === '' || p.cal == null || isNaN(cal) || cal < 0 || cal > 5000) return '칼로리는 0~5000 사이 숫자로 입력해 주세요.';
    if (p.date > U.today()) return '미래 날짜에는 기록할 수 없어요.';
    if (!D.slots.includes(p.slot)) return '식단 구분을 선택해 주세요.';
    return null;
  }
  const num0 = (v) => { const n = Number(v); return isNaN(n) || n < 0 ? 0 : Math.round(n); };

  A.addMeal = (p) => {
    const err = validateMeal(p); if (err) return fail(err);
    const meal = { id: U.uid('m'), slot: p.slot, name: String(p.name).trim(), cal: Math.round(Number(p.cal)), carb: num0(p.carb), prot: num0(p.prot), fat: num0(p.fat) };
    if (p.photo) meal.photo = p.photo;
    (S().meals[p.date] = S().meals[p.date] || []).push(meal);
    let g = 0; let streakNote = '';
    if (p.date === U.today()) {
      g = grantReward('식단 기록 인증', R.meal);     // 오늘 기록만 리워드
      // 개인 연속 기록: 7일(1주) 연속 달성할 때마다 +5P (크루 리워드 한도와 별개, 같은 날 중복 지급 없음)
      const st = SEL.logStreak().days; const u = S().user; u.streakRewards = u.streakRewards || [];
      if (st > 0 && st % 7 === 0 && !u.streakRewards.includes(U.today())) {
        u.streakRewards.push(U.today());
        S().points.balance += R.logStreak;
        S().points.log.unshift({ id: U.uid('pl'), date: U.today(), ts: Date.now(), label: `${st}일 연속 기록 달성`, amount: R.logStreak, type: 'streak' });
        notify('meal', '', `${st}일 연속으로 식단을 기록했어요. 연속 기록 보상 +${R.logStreak}P를 드렸어요.`);
        streakNote = ` · ${st}일 연속 기록 +${R.logStreak}P`;
      }
    }
    commit();
    return { ok: true, msg: `${meal.slot} 식단을 기록했어요${p.date === U.today() ? ` · ${rewardNote(g, R.meal)}` : ''}${streakNote}`, meal };
  };

  A.updateMeal = (date, id, p) => {
    const err = validateMeal({ ...p, date }); if (err) return fail(err);
    const m = SEL.dayMeals(date).find((x) => x.id === id); if (!m) return fail('식단을 찾을 수 없어요.');
    Object.assign(m, { slot: p.slot, name: String(p.name).trim(), cal: Math.round(Number(p.cal)), carb: num0(p.carb), prot: num0(p.prot), fat: num0(p.fat) });
    if (p.photo) m.photo = p.photo;
    commit();
    return { ok: true, msg: '식단을 수정했어요.' };
  };

  A.deleteMeal = (date, id) => {
    S().meals[date] = SEL.dayMeals(date).filter((m) => m.id !== id);
    commit();
    return { ok: true, msg: '식단을 삭제했어요.' };
  };

  /* ---------- 체중 ---------- */
  A.saveWeight = (date, kg) => {
    const w = Number(kg);
    if (isNaN(w) || w < 20 || w > 300) return fail('체중은 20~300kg 사이로 입력해 주세요.');
    if (date > U.today()) return fail('미래 날짜의 체중은 기록할 수 없어요.');
    S().weights[date] = U.round1(w);
    commit();
    const bmi = SEL.bmi(U.round1(w));
    return { ok: true, msg: `${date === U.today() ? '오늘' : U.md(date)} 체중 ${U.round1(w)}kg을 기록했어요 · BMI ${bmi}` };
  };

  /* ---------- 결제 ---------- */
  A.purchase = (productId, usePoints, addrId, payId) => {
    const p = D.product(productId); if (!p) return fail('상품을 찾을 수 없어요.');
    const use = usePoints ? Math.min(S().points.balance, p.price) : 0;
    const pay = p.price - use;
    const pts = S().points;
    if (use > 0) { pts.balance -= use; pts.log.unshift({ id: U.uid('pl'), date: U.today(), ts: Date.now(), label: `${p.name} 결제에 사용`, amount: -use, type: 'spend' }); }
    // 상품 구매는 포인트를 적립하지 않음 (포인트 사용만 가능)
    // 주문 시점의 배송지 · 결제 수단을 그대로 남김 (나중에 바꿔도 주문 내역은 유지)
    const u = S().user; const ad = (u.addresses || []).find((x) => x.id === addrId); const pm = (u.payments || []).find((x) => x.id === payId);
    S().orders.unshift({ id: U.uid('o'), productId: p.id, name: p.name, date: U.today(), price: p.price, used: use, pay, status: '배송 준비중',
      addr: ad ? `${[ad.addr, ad.detail].filter(Boolean).join(" ")} (${ad.recipient})` : '', payLabel: pay > 0 && pm ? `${pm.brand} ···· ${pm.last4}` : '포인트 전액 결제', history: [[U.today(), '주문 완료']] });
    notify('delivery', '', `'${p.name}' 주문이 접수되었어요. 곧 배송을 준비합니다.`);
    commit();
    return { ok: true, msg: use ? `결제를 완료했어요 · 포인트 ${U.num(use)}P 사용` : '결제를 완료했어요.', pay, use };
  };

  /* ---------- 크루 ---------- */
  A.postProof = ({ crewId, slot, text, img }) => {
    const c = S().crews.find((x) => x.id === crewId && x.mine);
    if (!c) return fail('크루를 찾을 수 없어요.');
    const today = U.today();
    const slotMeals = SEL.dayMeals(today).filter((m) => m.slot === slot);
    const kcal = slotMeals.length ? slotMeals.reduce((a, m) => a + m.cal, 0) : null;
    S().feed.unshift({
      id: U.uid('f'), crewId, author: '나', authorId: 'me', slot, kcal, ts: Date.now(),
      text: String(text || '').trim() || `${slot} 식단 인증 완료!`, img: img || null, likes: 0, liked: false, cheered: false, comments: [],
    });
    const first = !S().user.verifyDates.includes(today);
    const notes = [];
    if (first) {
      S().user.verifyDates.push(today);
      const g1 = grantReward('크루 식단 인증', R.proof);
      notes.push(`인증 ${g1 > 0 ? `+${g1}P` : '(리워드 한도 도달)'}`);
      // 전원 인증 → 불꽃 1단계 상승 + 전원 +20P (크루마다 하루 한 번)
      SEL.myCrews().forEach((mc) => {
        if (SEL.crewToday(mc).allDone && mc.allDoneDate !== today) {
          mc.allDoneDate = today; mc.flame = Math.min(5, (mc.flame || 0) + 1); mc.flameDays = (mc.flameDays || 0) + 1;
          const g2 = grantReward('크루 전원 인증 달성', R.allDone);
          notes.push(`'${mc.name}' 전원 인증! 불꽃 ${mc.flame}단계${g2 > 0 ? ` +${g2}P` : ''}`);
          notify('crew', '', `'${mc.name}' 크루원 전원이 오늘 식단을 인증했어요! 불꽃 ${mc.flame}단계로 올랐어요.`);
        }
      });
      // 7일 연속 인증 → +50P
      const st = SEL.streak();
      if (st > 0 && st % 7 === 0) {
        const g3 = grantReward('주간 연속 인증 달성', R.weekStreak);
        notes.push(`${st}일 연속 인증${g3 > 0 ? ` +${g3}P` : ''}`);
        notify('crew', '', `${st}일 연속 인증 달성! 주간 연속 인증 보상을 드렸어요.`);
      }
    }
    commit();
    return { ok: true, msg: `크루 피드에 인증을 올렸어요${notes.length ? ' · ' + notes.join(' · ') : ''}` };
  };

  const post = (id) => S().feed.find((f) => f.id === id);
  A.toggleLike = (id) => { const f = post(id); if (!f) return; f.liked = !f.liked; f.likes += f.liked ? 1 : -1; commit(); };
  A.toggleCheer = (id) => { const f = post(id); if (!f) return fail(''); f.cheered = !f.cheered; commit(); return { ok: true, msg: f.cheered ? '응원을 보냈어요.' : '응원을 취소했어요.' }; };
  A.addComment = (id, text) => {
    const f = post(id); const t = String(text || '').trim();
    if (!f || !t) return fail('댓글 내용을 입력해 주세요.');
    f.comments.push({ id: U.uid('cm'), name: '나', text: t, ts: Date.now() });
    commit();
    return { ok: true };
  };

  A.sendChat = (crewId, text) => {
    const t = String(text || '').trim(); if (!t) return fail('');
    (S().chat[crewId] = S().chat[crewId] || []).push({ id: U.uid('ch'), from: 'me', text: t, ts: Date.now() });
    AF.state.save();                // 채팅은 화면 전체를 다시 그리지 않고 호출한 쪽에서 목록만 갱신
    return { ok: true };
  };

  A.requestJoin = (crewId) => {
    const c = S().crews.find((x) => x.id === crewId); if (!c || c.mine) return fail('신청할 수 없는 크루예요.');
    if (c.count >= c.cap) return fail('정원이 가득 찬 크루예요.');
    c.requested = true;
    notify('crew', '', `'${c.name}' 크루에 참가 신청을 보냈어요. 크루장의 승인을 기다리고 있어요.`);
    commit();
    return { ok: true, msg: '참가 신청을 보냈어요.' };
  };

  A.createCrew = ({ name, goal, cap }) => {
    const n = String(name || '').trim();
    if (n.length < 2) return fail('크루 이름은 2자 이상 입력해 주세요.');
    const capN = Math.round(Number(cap));
    if (isNaN(capN) || capN < 2 || capN > 20) return fail('정원은 2~20명 사이로 입력해 주세요.');
    if (S().crews.some((c) => c.name === n)) return fail('이미 같은 이름의 크루가 있어요.');
    const c = {
      id: U.uid('c'), name: n, goal: String(goal || '').trim() || '함께 식단 인증하기', cap: capN, mine: true, leader: true,
      rank: null, flame: 1, flameDays: 0, createdDate: U.today(), log: {},
      members: [{ id: 'me', name: '나' }], pending: [],
    };
    S().crews.push(c);
    S().chat[c.id] = [];
    AF.state.ui().crewId = c.id;
    notify('crew', '', `'${n}' 크루가 개설되었어요! 크루원을 모아보세요.`);
    commit();
    return { ok: true, msg: '크루를 만들었어요.', crew: c };
  };

  A.acceptRequest = (crewId, reqId) => {
    const c = S().crews.find((x) => x.id === crewId && x.mine); if (!c) return fail('');
    const r = c.pending.find((x) => x.id === reqId); if (!r) return fail('');
    if (c.members.length >= c.cap) return fail(`정원(${c.cap}명)이 가득 차서 수락할 수 없어요.`);
    c.members.push({ id: r.id, name: r.name, sim: true, verified: false });
    c.pending = c.pending.filter((x) => x.id !== reqId);
    notify('crew', '', `${r.name} 님이 '${c.name}' 크루에 합류했어요.`);
    commit();
    return { ok: true, msg: `${r.name} 님의 참가를 수락했어요.` };
  };
  A.rejectRequest = (crewId, reqId) => {
    const c = S().crews.find((x) => x.id === crewId && x.mine); if (!c) return fail('');
    const r = c.pending.find((x) => x.id === reqId);
    c.pending = c.pending.filter((x) => x.id !== reqId);
    commit();
    return { ok: true, msg: `${r ? r.name + ' 님의 ' : ''}신청을 거절했어요.` };
  };

  /* ---------- 정기 구독 ---------- */
  A.saveSubscription = (pkg, dayKey) => {
    const sub = S().subscription;
    if (sub.status === 'cancelled') { sub.startDate = U.today(); sub.skipped = 0; sub.menu = null; }
    const wasActive = sub.status === 'active';
    Object.assign(sub, { status: 'active', pkg, day: dayKey, nextDate: U.nextWeekday(U.today(), dayKey) });
    notify('delivery', '', `정기 구독이 ${wasActive ? '변경' : '시작'}되었어요. 다음 배송일은 ${U.mdDow(sub.nextDate)}입니다.`);
    commit();
    return { ok: true, msg: wasActive ? '정기 구독 설정을 바꿨어요.' : '정기 구독을 시작했어요.' };
  };
  A.skipWeek = () => {
    const sub = S().subscription; if (sub.status !== 'active') return fail('진행 중인 구독이 없어요.');
    sub.nextDate = U.addDays(sub.nextDate, 7); sub.skipped += 1;
    notify('delivery', '⏭', `다음 배송이 1회 건너뛰기 되었어요. 새 배송일은 ${U.mdDow(sub.nextDate)}입니다.`);
    commit();
    return { ok: true, msg: '다음 배송을 1회 건너뛰었어요.' };
  };
  A.cancelSubscription = () => {
    S().subscription.status = 'cancelled';
    notify('delivery', '', '정기 구독이 해지되었어요.');
    commit();
    return { ok: true, msg: '정기 구독을 해지했어요.' };
  };
  A.changeSubMenu = (menu) => {
    S().subscription.menu = menu;
    notify('delivery', '', `다음 주 배송 메뉴가 '${menu}'(으)로 변경되었어요.`);
    commit();
    return { ok: true, msg: '다음 주 배송 메뉴를 바꿨어요.' };
  };

  /* ---------- 알림 ---------- */
  A.setNotifSetting = (kind, on) => { S().notifSettings[kind] = !!on; AF.state.save(); };
  A.markAllRead = () => { S().notifs.forEach((n) => { n.read = true; }); commit(); };
  A.refreshAI = () => { S().aiIndex += 1; AF.state.save(); };

  /* ---------- 개발 보조 ---------- */
  A.resetDemo = () => { AF.state.reset(); };

  return A;
})();

    err.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    return false;
  };
  document.addEventListener('input', (e) => {
    const box = e.target.closest && e.target.closest('.is-invalid'); if (!box) return;

    el.className = 'toast'; el.setAttribute('role', 'status'); el.textContent = msg;

  // 스파크라인 (홈 체중)
  UI.sparkline = (vals, w = 96, h = 40) => {
    if (vals.length < 2) return '';
    const mn = Math.min(...vals); const mx = Math.max(...vals); const r = mx - mn || 1;
    const pts = vals.map((v, i) => [2 + (i * (w - 4)) / (vals.length - 1), 4 + ((mx - v) / r) * (h - 8)]);
    const last = pts[pts.length - 1];
    return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts.map((p) => p.map((n) => n.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="var(--accent-bright)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3" fill="var(--accent-bright)"/></svg>`;
  };
  // 체중 라인 차트 (마이 주간/월간) — 그라데이션 없이 단색 선
  UI.lineChart = (pts) => {
    if (pts.length < 2) return UI.empty('scale', '체중을 2회 이상 기록하면<br>변화 추이를 볼 수 있어요.');
    const w = 326; const h = 150; const padL = 32; const padR = 10; const padT = 14; const padB = 24;
    const vals = pts.map((p) => p.value);
    const mn = Math.min(...vals); const mx = Math.max(...vals);
    const pad = (mx - mn) * 0.2 || 0.5; const lo = mn - pad; const hi = mx + pad;
    const X = (i) => padL + (i * (w - padL - padR)) / (pts.length - 1);
    const Y = (v) => padT + ((hi - v) / (hi - lo)) * (h - padT - padB);
    const grid = [0, 0.5, 1].map((r) => {
      const v = hi - (hi - lo) * r; const y = padT + (h - padT - padB) * r;
      return `<line x1="${padL}" x2="${w - padR}" y1="${y}" y2="${y}" stroke="#EDEDEA"/><text x="${padL - 6}" y="${y + 3.5}" text-anchor="end" font-size="10" fill="#8B8E95">${v.toFixed(1)}</text>`;
    }).join('');
    const line = pts.map((p, i) => `${X(i).toFixed(1)},${Y(p.value).toFixed(1)}`).join(' ');
    const step = Math.ceil(pts.length / 7);
    const labels = pts.map((p, i) => ((i % step === 0 || i === pts.length - 1) && !(i !== pts.length - 1 && pts.length - 1 - i < step / 2)
      ? `<text x="${X(i).toFixed(1)}" y="${h - 6}" text-anchor="middle" font-size="10" fill="${i === pts.length - 1 ? '#111214' : '#8B8E95'}" font-weight="${i === pts.length - 1 ? 600 : 400}">${p.label}</text>` : '')).join('');
    const lp = pts[pts.length - 1];
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="체중 변화 차트, 최근 ${lp.value}kg">${grid}
      <polyline points="${line}" fill="none" stroke="var(--accent-bright)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${X(pts.length - 1).toFixed(1)}" cy="${Y(lp.value).toFixed(1)}" r="4" fill="var(--accent-bright)"/>${labels}</svg>`;
  };

  return UI;
})();

    const s1 = ymd(o);
    const c = s1 < min ? min : s1 > max ? max : s1;
    const [y, m, d] = c.split('-').map(Number); return { y, m, d };
  }
  function wheelCols() {
    const { min, max } = birthRange(); const o = AF.dp;
    const minY = Number(min.slice(0, 4)); const maxY = Number(max.slice(0, 4));
    const years = []; for (let y = minY; y <= maxY; y++) years.push({ v: y, label: `${y}년`, ok: true });
    const months = []; for (let m = 1; m <= 12; m++) { const first = ymd({ y: o.y, m, d: daysIn(o.y, m) }); const last = ymd({ y: o.y, m, d: 1 }); months.push({ v: m, label: `${m}월`, ok: first >= min && last <= max }); }
    const days = []; for (let d = 1; d <= daysIn(o.y, o.m); d++) { const x = ymd({ y: o.y, m: o.m, d }); days.push({ v: d, label: `${d}일`, ok: x >= min && x <= max }); }
    return [['y', '년', years], ['m', '월', months], ['d', '일', days]];
  }
  const wheelHtml = () => `<div class="wheels" role="group" aria-label="생년월일 선택">
      <div class="wheel-band" aria-hidden="true"></div>
      ${wheelCols().map(([k, name, items]) => `<div class="wheel" id="wheel-${k}" data-k="${k}" tabindex="0" role="listbox" aria-label="${name}">
        <div class="wheel-pad"></div>${items.map((it) => `<div class="wheel-item ${it.ok ? '' : 'off'}" role="option" data-v="${it.v}" aria-selected="${AF.dp[k] === it.v}">${it.label}</div>`).join('')}<div class="wheel-pad"></div></div>`).join('')}
    </div>`;
  // 현재 값 위치로 각 휠 스크롤
  function syncWheels(smooth) {
    ['y', 'm', 'd'].forEach((k) => {
      const w = document.getElementById('wheel-' + k); if (!w) return;
      const items = [...w.querySelectorAll('.wheel-item')];
      const idx = items.findIndex((it) => Number(it.dataset.v) === AF.dp[k]);
      items.forEach((it, i) => it.setAttribute('aria-selected', i === idx));
      if (idx >= 0) { w._lock = true; w.scrollTo({ top: idx * ITEM_H, behavior: smooth ? 'smooth' : 'auto' }); setTimeout(() => { w._lock = false; }, smooth ? 350 : 30); }
    });
    const t = document.getElementById('dp-preview'); if (t) t.textContent = `${birthLabel(ymd(AF.dp))} · 만 ${ageFrom(ymd(AF.dp))}세`;
  }
  // 일(day) / 월 휠은 년·월에 따라 칸 수와 비활성 칸이 달라지므로 다시 그림
  function rebuildWheels() {
    const box = document.querySelector('.wheels'); if (!box) return;
    box.outerHTML = wheelHtml(); bindWheels(); syncWheels(false);
  }
  function commitWheel(k, v) {
    const before = { ...AF.dp }; AF.dp[k] = v;
    AF.dp = clampDate(AF.dp);
    if (AF.dp.y !== before.y || AF.dp.m !== before.m || k !== 'd') rebuildWheels(); else syncWheels(true);
  }
  function bindWheels() {
    document.querySelectorAll('.wheel').forEach((w) => {
      let t = null;
      w.addEventListener('scroll', () => {
        if (w._lock) return;
        clearTimeout(t);
        // 스크롤이 멈추면 가운데 칸을 선택 (스냅 이후)
        t = setTimeout(() => {
          if (!w.isConnected || w._lock) return;          // 다시 그려진(교체된) 휠의 늦은 이벤트는 무시
          const items = w.querySelectorAll('.wheel-item');
          const i = Math.max(0, Math.min(items.length - 1, Math.round(w.scrollTop / ITEM_H)));
          const v = Number(items[i].dataset.v);
          if (v !== AF.dp[w.dataset.k]) commitWheel(w.dataset.k, v); else if (Math.abs(w.scrollTop - i * ITEM_H) > 1) syncWheels(true);
        }, 120);
      }, { passive: true });
      // 항목을 탭하면 그 값으로 이동
      w.addEventListener('click', (e) => { const it = e.target.closest('.wheel-item'); if (it) commitWheel(w.dataset.k, Number(it.dataset.v)); });
      // 키보드: 위/아래 화살표로 한 칸씩
      w.addEventListener('keydown', (e) => {
        if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return; e.preventDefault();
        const vals = [...w.querySelectorAll('.wheel-item')].map((it) => Number(it.dataset.v));
        const i = vals.indexOf(AF.dp[w.dataset.k]); const n = vals[Math.max(0, Math.min(vals.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)))];
        commitWheel(w.dataset.k, n);
      });
    });
  }
  AF.handlers['open-birth-picker'] = () => {
    const d = draft(); const nickEl = document.getElementById('pi-nick'); if (nickEl) d.nickname = nickEl.value;
    const base = d.birth || `${Number(U.today().slice(0, 4)) - 25}-01-01`;   // 처음 열면 만 25세 1월 1일부터
    const [y, m, dd] = base.split('-').map(Number); AF.dp = clampDate({ y, m, d: dd });
    const { min, max } = birthRange();
    UI.openSheet({
      id: 'ONB-01P', title: '생년월일', left: { label: '취소' }, right: { label: '완료', action: 'birth-done' },
      body: `${wheelHtml()}
        <p class="t-foot" id="dp-preview" style="text-align:center"></p>
        <p class="t-caption" style="text-align:center;padding-bottom:6px">${birthLabel(min)} ~ ${birthLabel(max)} 사이에서 선택할 수 있어요 (만 10~100세)</p>`,
    });
    bindWheels(); syncWheels(false);
  };
  AF.handlers['birth-done'] = () => {
    const d = draft(); d.birth = ymd(AF.dp); d.age = ageFrom(d.birth);
    const v = document.getElementById('pi-birth-value'); if (v) { v.textContent = birthLabel(d.birth); v.classList.remove('empty'); }
    UI.closeOverlay();
  };
  AF.handlers['onb-gender'] = (el) => { draft().gender = el.dataset.v; el.parentNode.querySelectorAll('button').forEach((b) => b.classList.toggle('active', b === el)); };
  AF.handlers['onb-profile-next'] = () => {
    const d = draft(); const nick = document.getElementById('pi-nick').value.trim(); const birth = d.birth;
    if (nick.length < 2) return UI.invalid('pi-nick', '닉네임은 2자 이상 입력해 주세요.');
    if (!birth) return UI.invalid('pi-birth', '생년월일을 선택해 주세요.');
    const age = ageFrom(birth);
    if (!(age >= 10 && age <= 100)) return UI.invalid('pi-birth', '만 10~100세 사이의 생년월일을 선택해 주세요.');
    if (!d.gender) return UI.invalid('pi-gender', '성별을 선택해 주세요.');
    Object.assign(d, { nickname: nick, birth, age });
    AF.go('/onb/2');
  };

  /* ----- ONB-02 신체 정보 · 목표 — 빈 칸으로 시작 ----- */
  AF.routes['/onb/2'] = {
    id: 'ONB-02', kind: 'onb', back: '/onb/1', fit: true,
    render() {
      const d = draft();
      if (!d.nickname) { setTimeout(() => AF.go('/onb/1', true)); return ''; }   // 새로고침 등으로 앞 단계 값이 없으면 처음 단계로
      return `<div class="fit">${progress(2)}
        <h1 class="large-title fit-title">신체 정보와 목표</h1>
        <p class="pad t-sub" style="margin-top:4px;font-size:15px">입력한 정보로 하루 권장 칼로리를 계산해요.</p>
        <div class="section fit-sec">
          <div class="group">
            ${numField('onb-height', '키', d.height, 'cm', '0.1', '0')}
            ${numField('onb-weight', '현재 체중', d.weight, 'kg', '0.1', '0').replace('<input ', '<input data-input="onb-wdiff" ')}
            ${numField('onb-target', '목표 체중', d.target, 'kg', '0.1', '0').replace('<input ', '<input data-input="onb-wdiff" ')}
            <div class="field"><span class="f-label">목표 변화</span><span class="pf-value" id="onb-diff" aria-live="polite">${diffText(d.weight, d.target)}</span></div>
          </div>
        </div>
        <div class="section fit-sec">
          <div class="section-label">활동량</div>
          ${optCards(ACTIVITY, d.activity, 'onb-activity', '활동량', 'onb-activity-cards')}
        </div>
        <div class="fit-cta"><button class="btn" data-action="onb-next">다음</button></div></div>`;
    },
  };
  // 현재 체중 → 목표 체중 변화량: 입력할 때마다 바로 갱신
  AF.inputs['onb-wdiff'] = () => {
    const d = draft(); d.weight = document.getElementById('onb-weight').value; d.target = document.getElementById('onb-target').value;
    const el = document.getElementById('onb-diff'); if (el) el.innerHTML = diffText(d.weight, d.target);
  };
  // 입력 중인 값이 다시 그려질 때 사라지지 않도록 화면 갱신 없이 상태만 바꿈
  AF.handlers['onb-activity'] = (el) => { draft().activity = Number(el.dataset.v); pickChoice(el); };
  AF.handlers['onb-next'] = () => {
    const d = draft(); const v = (id) => Number(document.getElementById(id).value || NaN);
    const height = v('onb-height'); const weight = v('onb-weight'); const target = v('onb-target'); const age = d.age;
    if (!(height >= 100 && height <= 250)) return UI.invalid('onb-height', '키는 100~250cm 사이로 입력해 주세요.');
    if (!(weight >= 20 && weight <= 300)) return UI.invalid('onb-weight', '현재 체중은 20~300kg 사이로 입력해 주세요.');
    if (!(target >= 20 && target <= 300)) return UI.invalid('onb-target', '목표 체중은 20~300kg 사이로 입력해 주세요.');
    if (!d.activity) return UI.invalid('onb-activity-cards', '활동량을 선택해 주세요.');
    Object.assign(d, { age, height, weight: U.round1(weight), target: U.round1(target) });

    d.cal = U.recommendCal(d.weight, d.activity);
    AF.go('/onb/3');
  };

  /* ----- ONB-03 권장 칼로리 · 식단 취향 ----- */
  AF.routes['/onb/3'] = {
    id: 'ONB-03', kind: 'onb', back: '/onb/2', fit: true,
    render() {
      const d = draft();
      if (!d.weight) { setTimeout(() => AF.go(d.nickname ? '/onb/2' : '/onb/1', true)); return ''; }
      const cal = d.cal || U.recommendCal(d.weight, d.activity); d.cal = cal;
      const mt = U.macroTargets(cal); const diff = U.round1(d.target - d.weight);
      const goal = diff < 0 ? `${Math.abs(diff)}kg 감량` : diff > 0 ? `${diff}kg 증량` : '현재 체중 유지';
      return `<div class="fit">${progress(3)}
        <div class="hero" style="padding-top:22px">
          <div class="k">하루 권장 칼로리</div>
          <div class="v"><span class="display" style="font-size:52px;line-height:60px">${U.num(cal)}</span><span class="unit">kcal</span></div>
          <div class="t-foot" style="margin-top:6px">${d.weight}kg → ${d.target}kg · ${goal}</div>
        </div>
        <div class="macros">
          <div class="macro"><span class="k"><span class="mdot carb"></span>탄수화물</span><span class="v">${mt.carb}<small>g</small></span></div>
          <div class="macro"><span class="k"><span class="mdot prot"></span>단백질</span><span class="v">${mt.prot}<small>g</small></span></div>
          <div class="macro"><span class="k"><span class="mdot fat"></span>지방</span><span class="v">${mt.fat}<small>g</small></span></div>
        </div>
        <div class="section fit-sec">
          <div class="section-label">선호하는 식단 방식</div>
          ${optCards(PREFS, d.pref, 'onb-pref', '선호하는 식단 방식', 'onb-pref-cards')}
          <div class="section-foot">AI 추천과 쇼핑 카테고리에 반영돼요. 마이에서 언제든 바꿀 수 있어요.</div>
        </div>
        <div class="fit-cta"><button class="btn" data-action="onb-finish">시작하기</button></div></div>`;
    },
  };
  AF.handlers['onb-pref'] = (el) => { draft().pref = el.dataset.v; pickChoice(el); };
  AF.handlers['onb-finish'] = () => {
    const d = draft();
    if (!d.pref) return UI.invalid('onb-pref-cards', '선호하는 식단 방식을 선택해 주세요.');
    const r = A.completeOnboarding({ nickname: d.nickname, email: d.email, birth: d.birth, provider: d.provider, gender: d.gender, age: d.age, height: d.height, weight: d.weight, targetWeight: d.target, activity: d.activity, targetCal: d.cal, pref: d.pref });
    AF.onb = null;
    AF.go('/home', true);
    UI.toast(r.msg);
  };
})();

/* ===== s-home.js ===== */
/* =========================================================
   screens/home — HOM-01 홈(SUMMARY) / HOM-04 음식 검색·직접 입력
   위계: ① 남은 칼로리 → ② 탄단지 · 체중 → ③ AI 추천 · 크루 (포인트·알림은 내비 바)
   ========================================================= */
(function () {
  const U = AF.utils; const SEL = AF.sel; const UI = AF.ui; const A = AF.actions; const D = AF.data;

  const todayCaption = () => { const t = U.today(); const d = U.parse(t); return `${d.getMonth() + 1}월 ${d.getDate()}일 ${U.DOW[d.getDay()]}요일`; };
  AF.todayCaption = todayCaption;

  /* ① 남은 칼로리 */
  function hero() {
    const c = SEL.calorie();
    return `<section class="hero">
      <div class="k">${c.over ? '목표 칼로리 초과' : '남은 칼로리'}</div>
      <div class="v"><span class="display ${c.over ? 't-warn' : ''}">${U.num(Math.abs(c.remaining))}</span><span class="unit">kcal</span></div>
      ${UI.bar(c.over ? 100 : c.pct, c.over ? 'warn' : '')}
      <div class="meta"><span>섭취 ${U.num(c.consumed)} kcal</span><span>목표 ${U.num(c.target)} kcal</span></div>
    </section>`;
  }
  /* ② 탄단지 */
  function macros(c) {
    const M = [['carb', '탄수화물'], ['prot', '단백질'], ['fat', '지방']];
    return `<section class="macros">${M.map(([k, l]) => {
      const v = c.macros[k]; const t = c.macroTarget[k];
      return `<div class="macro"><span class="k"><span class="mdot ${k}"></span>${l}</span><span class="v">${v}<small> / ${t}g</small></span>${UI.bar(U.pct(v, t), `thin m-${k}`)}</div>`;
    }).join('')}</section>`;
  }
  /* ② 체중 */
  function weight() {
    const u = AF.state.data.user; const w = SEL.latestWeight(); const delta = SEL.weightDelta(7);
    const left = w != null ? U.round1(w - u.targetWeight) : null;
    const dTxt = delta == null ? '7일 기록 부족' : `7일간 ${delta > 0 ? '+' : delta < 0 ? '−' : ''}${Math.abs(delta)}kg`;
    const lTxt = left == null ? '' : left > 0 ? ` · 목표 ${u.targetWeight}kg까지 ${left}kg` : ' · 목표 체중 달성';
    return `<section class="section">
      ${UI.sectionHead('체중', '<button class="text-btn" data-action="open-weight-sheet">기록</button>')}
      <div class="group"><button class="weight-row" data-action="go" data-to="/my" aria-label="체중 통계 보기">
        <span style="flex:1;display:flex;flex-direction:column;gap:4px">
          <span class="big">${w != null ? w.toFixed(1) : '-'}<span class="unit"> kg</span></span>
          <span class="t-foot">${dTxt}${lTxt}</span>
        </span>
        ${UI.sparkline(SEL.weightSeries(7).map((p) => p.value))}${UI.chev()}
      </button></div>
    </section>`;
  }
  /* ③ AI 추천 — 잔여 칼로리와 취향 기반 (기존 로직 유지) */
  function ai() {
    const { product: p, reason } = SEL.aiPick();
    return `<section class="section">
      ${UI.sectionHead('AI 추천', `<button class="text-btn" data-action="ai-refresh"><span id="ai-ico" style="display:inline-flex">${UI.icon('refresh', 15, { sw: 2 })}</span>다른 추천</button>`)}
      <div class="group fade" id="ai-meal">
        <button class="ai-item" data-action="go" data-to="/shop/item/${p.id}">
          ${UI.ph(p.img, p.cat)}
          <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px">
            <span class="t-caption">${D.catLabel[p.cat]} · ${U.esc(p.tag)}</span>
            <span style="font-size:16px;font-weight:600;line-height:1.35">${U.esc(p.name)}</span>
            <span class="t-foot num">${p.cal} kcal · 단백질 ${p.prot}g</span>
          </span>
        </button>
        <p class="ai-reason">${U.esc(reason)}</p>
        <div class="ai-foot"><span class="price">${U.won(p.price)}${p.orig ? `<span class="strike">${U.won(p.orig)}</span>` : ''}</span>
          <button class="btn-sm" data-action="open-checkout" data-product="${p.id}">바로 구매</button></div>
      </div>
    </section>`;
  }
  /* ③ 크루 */
  function crew() {
    const c = SEL.currentCrew();
    if (!c) return `<section class="section">${UI.sectionHead('크루')}${UI.group(UI.row({ title: '참여 중인 크루가 없어요', sub: '함께 식단을 인증할 크루를 찾아보세요', to: '/crew', value: '<span class="t-accent t-strong">크루 찾기</span>' }))}</section>`;
    const t = SEL.crewToday(c); const done = SEL.meVerifiedToday();
    return `<section class="section">${UI.sectionHead('크루')}
      ${UI.group(UI.row({ title: U.esc(c.name), strong: true, sub: `오늘 인증 ${t.verified}/${t.total}명 · 불꽃 ${c.flame}단계`, to: '/crew', value: done ? '인증 완료' : '<span class="t-accent t-strong">인증하기</span>' }))}
    </section>`;
  }

  AF.routes['/home'] = {
    id: 'HOM-01', kind: 'tab', tab: 'home', title: '오늘',
    caption: todayCaption,
    actions() {
      const un = SEL.unread();
      return `<button class="nav-points" data-action="go" data-to="/my/points" aria-label="보유 포인트">${U.num(AF.state.data.points.balance)}P</button>
        <button class="icon-btn" data-action="go" data-to="/home/notif" aria-label="알림${un ? `, 읽지 않은 알림 ${un}개` : ''}">${UI.icon('bell', 22)}${un ? '<span class="dot"></span>' : ''}</button>
        <button class="icon-btn accent" data-action="open-meal-quick" aria-label="식단 기록">${UI.icon('plus', 24)}</button>`;
    },
    render() {
      const c = SEL.calorie();
      return `<h1 class="large-title">오늘</h1>${hero()}${macros(c)}${weight()}${ai()}${crew()}`;
    },
  };

  AF.handlers['ai-refresh'] = () => {
    const m = document.getElementById('ai-meal'); const ic = document.getElementById('ai-ico');
    if (m) m.classList.add('out'); if (ic) ic.classList.add('spin');
    setTimeout(() => { A.refreshAI(); AF.app.refresh(); }, 260);
  };

  /* =========================================================
     HOM-04 음식 검색 & 직접 입력 (식단 시트의 'DB에서 찾기'로 진입)
     ========================================================= */
  function foodCtx() {
    const ui = AF.state.ui();
    if (!ui.foodCtx) ui.foodCtx = { date: U.today(), slot: AF.app.defaultSlot(), mealId: null, from: '/home' };
    return ui.foodCtx;
  }
  function results(q) {
    const key = q.replace(/\s/g, '').toLowerCase();
    const list = D.foods.map((f, i) => ({ ...f, i })).filter((f) => !key || f.name.replace(/\s/g, '').toLowerCase().includes(key));
    if (!list.length) return UI.group(UI.empty('search', '검색 결과가 없어요.<br>아래에서 직접 입력할 수 있어요.'));
    return `<div class="section-label">${key ? `검색 결과 ${list.length}개` : '자주 찾는 음식'}</div>` + UI.group(list.map((f) => `
      <div class="row"><span class="r-main"><span class="r-title">${U.esc(f.name)}</span><span class="r-sub num">${f.cal} kcal · 탄 ${f.carb}g · 단 ${f.prot}g · 지 ${f.fat}g</span></span>
      <button class="btn-sm tinted" data-action="food-pick" data-idx="${f.i}" style="height:32px;padding:0 14px">${foodCtx().mealId ? '선택' : '추가'}</button></div>`).join(''));
  }
  AF.routes['/home/food'] = {
    id: 'HOM-04', kind: 'sub', title: '음식 검색',
    back: () => foodCtx().from || '/home',
    render() {
      const c = foodCtx();
      return `<div class="pad" style="padding-top:8px">
          <div class="search">${UI.icon('search', 18, { sw: 2 })}<input id="food-q" data-input="food-search" data-enter="food-search" data-keep="1" placeholder="음식 이름 검색" autocomplete="off" aria-label="음식 검색"></div>
          <div class="t-foot" style="margin-top:10px">${U.mdDow(c.date)} · ${c.slot} · ${c.mealId ? '선택한 음식으로 수정돼요' : '선택하면 바로 기록돼요'}</div>
        </div>
        <div class="section tight" id="food-results">${results('')}</div>
        <div class="section">
          <div class="section-label">찾는 음식이 없다면 직접 입력</div>
          <div class="group">
            <div class="field"><label for="fm-name">음식명</label><input id="fm-name" placeholder="예) 닭가슴살 볶음밥" autocomplete="off"></div>
            <div class="field"><label for="fm-cal">칼로리</label><input id="fm-cal" type="number" inputmode="numeric" placeholder="0"><span class="f-unit">kcal</span></div>
            <div class="field"><label for="fm-carb">탄수화물</label><input id="fm-carb" type="number" inputmode="numeric" placeholder="0"><span class="f-unit">g</span></div>
            <div class="field"><label for="fm-prot">단백질</label><input id="fm-prot" type="number" inputmode="numeric" placeholder="0"><span class="f-unit">g</span></div>
            <div class="field"><label for="fm-fat">지방</label><input id="fm-fat" type="number" inputmode="numeric" placeholder="0"><span class="f-unit">g</span></div>
          </div>
          <div style="padding-top:16px"><button class="btn secondary" data-action="food-manual">직접 입력한 내용 저장</button></div>
        </div>`;
    },
  };
  const runSearch = () => { const q = document.getElementById('food-q'); const box = document.getElementById('food-results'); if (q && box) box.innerHTML = results(q.value); };
  AF.inputs['food-search'] = runSearch;
  AF.handlers['food-search'] = runSearch;

  function saveFromSearch(food) {
    const c = foodCtx();
    const p = { ...food, date: c.date, slot: c.slot };
    const r = c.mealId ? A.updateMeal(c.date, c.mealId, p) : A.addMeal(p);
    UI.toast(r.msg);
    if (r.ok) { const from = c.from || '/home'; AF.state.ui().foodCtx = null; AF.app.back(from); }
  }
  AF.handlers['food-pick'] = (el) => saveFromSearch(D.foods[Number(el.dataset.idx)]);
  AF.handlers['food-manual'] = () => {
    if (!AF.mealFieldsOk('fm-name', 'fm-cal')) return;
    const v = (id) => document.getElementById(id).value;
    saveFromSearch({ name: v('fm-name'), cal: v('fm-cal'), carb: v('fm-carb'), prot: v('fm-prot'), fat: v('fm-fat') });
  };
})();

/* ===== s-record.js ===== */
/* =========================================================
   screens/record — REC-01 기록 (TODAY: 날짜 스트립 → 하루 합계 → 아침·점심·저녁·간식 타임라인 → 체중)
   REC-02 식단 추가/수정 시트, REC-03 삭제 알럿은 overlays
   ========================================================= */
(function () {
  const U = AF.utils; const SEL = AF.sel; const UI = AF.ui; const D = AF.data;

  /* ----- 날짜 탐색: 주 단위 가로 스와이프(최근 26주) + 월 달력 전체 보기 ----- */
  const WEEKS_BACK = 26;
  const dayBtn = (d, sel, t) => {
    const future = d > t; const has = SEL.dayMeals(d).length > 0;
    return `<button class="day ${d === sel ? 'active' : ''} ${d === t ? 'today' : ''}" data-action="rec-date" data-date="${d}" ${future ? 'disabled' : ''} aria-label="${U.mdDow(d)}" aria-selected="${d === sel}">
        <span class="dw">${U.DOW[U.dow(d)]}</span><span class="dn">${U.parse(d).getDate()}</span><span class="pip ${has && !future ? '' : 'none'}"></span></button>`;
  };
  const weekLabel = (mon) => { const d = U.parse(U.addDays(mon, 3)); return `${d.getFullYear()}년 ${d.getMonth() + 1}월`; };
  function weekPager(sel) {
    const t = U.today(); const cur = U.mondayOf(t);
    const weeks = []; for (let i = WEEKS_BACK; i >= 0; i--) weeks.push(U.addDays(cur, -7 * i));
    return `<div class="week-head pad">
        <span class="week-label" id="week-label">${weekLabel(U.mondayOf(sel))}</span>
        <span style="display:flex;gap:2px">
          <button class="icon-btn" data-action="rec-week" data-d="-1" aria-label="이전 주">${UI.icon('back', 20, { sw: 2 })}</button>
          <button class="icon-btn" data-action="rec-week" data-d="1" aria-label="다음 주">${UI.icon('chevron', 20, { sw: 2 })}</button>
        </span>
      </div>
      <div class="week-pager" id="week-pager" aria-label="주 단위 날짜, 좌우로 넘겨 보기">${weeks.map((m) => `<div class="week" data-mon="${m}">${U.weekDays(m).map((d) => dayBtn(d, sel, t)).join('')}</div>`).join('')}</div>`;
  }
  // 선택된 날짜가 있는 주로 스크롤 + 스크롤 위치에 따라 '2026년 10월' 라벨 갱신
  function syncPager(smooth) {
    const p = document.getElementById('week-pager'); if (!p) return;
    const mon = U.mondayOf(AF.state.ui().recordDate);
    const el = p.querySelector(`[data-mon="${mon}"]`); if (el) p.scrollTo({ left: el.offsetLeft, behavior: smooth ? 'smooth' : 'auto' });
    if (!p._bound) {
      p._bound = true; let t = null;
      p.addEventListener('scroll', () => { clearTimeout(t); t = setTimeout(() => {
        const i = Math.round(p.scrollLeft / p.clientWidth); const w = p.children[i];
        const lb = document.getElementById('week-label'); if (w && lb) lb.textContent = weekLabel(w.dataset.mon);
      }, 80); }, { passive: true });
    }
  }

  /* ----- 월 달력 (전체 보기) — 기록한 날은 점, 미래는 비활성 ----- */
  function monthHtml(ym) {
    const [y, m] = ym.split('-').map(Number); const t = U.today(); const sel = AF.state.ui().recordDate;
    const first = new Date(y, m - 1, 1); const lead = (first.getDay() + 6) % 7;   // 월요일 시작
    const days = new Date(y, m, 0).getDate();
    const cells = []; for (let i = 0; i < lead; i++) cells.push('<span></span>');
    for (let d = 1; d <= days; d++) {
      const ds = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`; const fut = ds > t;
      const kcal = SEL.dayTotals(ds).cal;
      cells.push(`<button class="cal-day ${ds === sel ? 'active' : ''} ${ds === t ? 'today' : ''}" data-action="cal-pick" data-date="${ds}" ${fut ? 'disabled' : ''} aria-label="${U.mdDow(ds)}${kcal ? `, ${kcal} kcal 기록` : ''}">
        <span class="n">${d}</span><span class="pip ${kcal && !fut ? '' : 'none'}"></span></button>`);
    }
    const tm = t.slice(0, 7); const minYm = U.addDays(U.mondayOf(t), -7 * WEEKS_BACK).slice(0, 7);
    const logged = Object.keys(AF.state.data.meals).filter((k) => k.startsWith(ym) && SEL.loggedOn(k)).length;
    return { cells: cells.join(''), canNext: ym < tm, canPrev: ym > minYm, logged, title: `${y}년 ${m}월` };
  }
  function openCalendar(ym) {
    AF.calYm = ym || AF.state.ui().recordDate.slice(0, 7);
    const c = monthHtml(AF.calYm);
    UI.openSheet({
      id: 'REC-CAL', title: '날짜 선택', left: { label: '닫기' }, right: { label: '오늘', action: 'cal-today' },
      body: `<div class="group" style="padding:12px 12px 14px">
          <div class="cal-head"><button class="icon-btn" data-action="cal-move" data-d="-1" ${c.canPrev ? '' : 'disabled'} aria-label="이전 달">${UI.icon('back', 20, { sw: 2 })}</button>
            <span class="cal-title">${c.title}</span>
            <button class="icon-btn" data-action="cal-move" data-d="1" ${c.canNext ? '' : 'disabled'} aria-label="다음 달">${UI.icon('chevron', 20, { sw: 2 })}</button></div>
          <div class="cal-grid cal-dow">${['월', '화', '수', '목', '금', '토', '일'].map((x) => `<span>${x}</span>`).join('')}</div>
          <div class="cal-grid">${c.cells}</div>
        </div>
        <p class="t-foot" style="text-align:center">이번 달 ${c.logged}일 기록했어요 · 점이 있는 날은 식단 기록이 있어요</p>`,
    });
  }
  AF.handlers['rec-calendar'] = () => openCalendar();
  AF.handlers['cal-move'] = (el) => { const [y, m] = AF.calYm.split('-').map(Number); const d = new Date(y, m - 1 + Number(el.dataset.d), 1); openCalendar(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`); };
  AF.handlers['cal-pick'] = (el) => { AF.state.ui().recordDate = el.dataset.date; UI.closeOverlay(); AF.app.refresh(); };
  AF.handlers['cal-today'] = () => { AF.state.ui().recordDate = U.today(); UI.closeOverlay(); AF.app.refresh(); };
  AF.handlers['rec-week'] = (el) => {
    const p = document.getElementById('week-pager'); if (!p) return;
    p.scrollBy({ left: Number(el.dataset.d) * p.clientWidth, behavior: 'smooth' });
  };

  function daySum(date) {
    const c = SEL.calorie(date);
    return `<section class="day-sum">
      <div class="top"><span class="big">${U.num(c.consumed)}<span class="unit"> / ${U.num(c.target)} kcal</span></span>
        <span class="${c.over ? 't-warn' : 't-accent'} t-strong" style="font-size:15px">${c.over ? `${U.num(-c.remaining)} 초과` : `${U.num(c.remaining)} 남음`}</span></div>
      ${UI.bar(c.over ? 100 : c.pct, `mid ${c.over ? 'warn' : ''}`)}
      <span class="t-foot num macro-line"><span><span class="mdot carb"></span>탄수화물 ${c.macros.carb}g</span><span><span class="mdot prot"></span>단백질 ${c.macros.prot}g</span><span><span class="mdot fat"></span>지방 ${c.macros.fat}g</span></span>
    </section>`;
  }

  function slot(date, s) {
    const list = SEL.dayMeals(date).filter((m) => m.slot === s);
    const sum = list.reduce((a, m) => a + m.cal, 0);
    return `<div class="slot">
      <div class="rail"><span class="node ${list.length ? '' : 'hollow'}"></span><span class="line"></span></div>
      <div class="body">
        <div class="slot-head"><span class="name" style="${list.length ? '' : 'color:var(--label-2)'}">${s}</span>
          <span class="kcal">${list.length ? `${U.num(sum)} kcal` : '기록 없음'}</span><span class="grow"></span>
          ${list.length ? `<button class="icon-btn accent" style="width:40px;height:40px" data-action="rec-add" data-slot="${s}" aria-label="${s} 식단 추가">${UI.icon('plus', 20, { sw: 2 })}</button>` : ''}</div>
        ${list.length ? list.map((m) => `
          <div class="meal-wrap"><button class="meal-del" data-action="rec-del" data-id="${m.id}" tabindex="-1">삭제</button>
          <button class="meal" data-action="rec-edit" data-slot="${s}" data-id="${m.id}" aria-label="${U.esc(m.name)} 수정">
            ${m.photo ? `<div class="ph"><img src="${m.photo}" alt=""></div>` : ''}
            <span class="m-main"><span class="m-name ellipsis">${U.esc(m.name)}</span><span class="m-meta">${m.cal} kcal · 탄 ${m.carb}g · 단 ${m.prot}g · 지 ${m.fat}g</span></span>
            ${UI.chev()}
          </button></div>`).join('')
        : `<button class="text-btn" data-action="rec-add" data-slot="${s}">${s} 기록하기</button>`}
      </div>
    </div>`;
  }

  AF.routes['/record'] = {
    id: 'REC-01', kind: 'tab', tab: 'record', title: '기록',
    caption() { const d = AF.state.ui().recordDate; return d === U.today() ? AF.todayCaption() : U.mdDow(d); },
    actions() {
      return `${AF.state.ui().recordDate === U.today() ? '' : '<button class="nav-text-btn" data-action="rec-today">오늘</button>'}
        <button class="icon-btn" data-action="rec-calendar" aria-label="달력으로 날짜 전체 보기">${UI.icon('calendar', 22)}</button>`;
    },
    after() { syncPager(false); },
    render() {
      const date = AF.state.ui().recordDate;
      const w = SEL.weightOn(date);
      const bmi = w ? U.round1(U.bmi(w, AF.state.data.user.height)) : null; const st = bmi ? U.bmiStatus(bmi) : null;
      const isToday = date === U.today();
      return `<h1 class="large-title">기록</h1>
        ${weekPager(date)}
        ${daySum(date)}
        <section class="timeline">${D.slots.map((s) => slot(date, s)).join('')}</section>
        <section class="section">
          ${UI.sectionHead('체중')}
          ${UI.group(UI.row({ title: isToday ? '오늘 체중' : `${U.md(date)} 체중`, value: w != null ? `${w} kg` : '기록하기', valueStrong: w != null, action: 'rec-weight' })
            + UI.row({ title: 'BMI', value: st ? `${bmi} · ${st.label}` : '-' }))}
          <div class="section-foot">저장하면 홈 그래프와 마이 통계에 바로 반영돼요.</div>
        </section>`;
    },
  };

  AF.handlers['rec-date'] = (el) => { AF.state.ui().recordDate = el.dataset.date; AF.app.refresh(); };
  AF.handlers['rec-today'] = () => { AF.state.ui().recordDate = U.today(); AF.app.refresh(); };
  AF.handlers['rec-add'] = (el) => AF.overlays.mealForm({ date: AF.state.ui().recordDate, slot: el.dataset.slot });
  AF.handlers['rec-edit'] = (el) => AF.overlays.mealForm({ date: AF.state.ui().recordDate, slot: el.dataset.slot, id: el.dataset.id });
  // 행을 왼쪽으로 밀면 나오는 삭제 버튼 (V2) → REC-03 확인
  AF.handlers['rec-del'] = (el) => {
    const date = AF.state.ui().recordDate; const m = SEL.dayMeals(date).find((x) => x.id === el.dataset.id); if (!m) return;
    AF.overlays.confirm({ id: 'REC-03', title: '식단을 삭제할까요?', text: `'${U.esc(m.name)}' 기록이 삭제돼요.`, ok: '삭제', danger: true, onOk: () => UI.toast(AF.actions.deleteMeal(date, m.id).msg) });
  };
  AF.handlers['rec-weight'] = () => AF.overlays.weightSheet(AF.state.ui().recordDate);
})();

/* ===== s-crew.js ===== */
/* =========================================================
   screens/crew — CRW-01 내 크루 / CRW-02 탐색 / CRW-03 개설 / CRW-06 관리 (채팅 없음 · 피드 중심)
   (CRW-04 참가 알럿, CRW-07 인증 시트, CRW-08 댓글 시트, 리워드 규칙 시트는 overlays)
   ========================================================= */
(function () {
  const U = AF.utils; const SEL = AF.sel; const UI = AF.ui; const A = AF.actions;

  const flame = (n) => `<div class="flame" aria-hidden="true">${[0, 1, 2, 3, 4].map((i) => `<span class="${i < n ? 'on' : ''}"></span>`).join('')}</div>`;

  function post(f) {
    const me = f.authorId === 'me';
    return `<article class="post">
      <div class="who">${UI.avatar(f.author, me)}
        <div style="flex:1;min-width:0;display:flex;flex-direction:column"><span style="font-size:15px;font-weight:600">${U.esc(f.author)}</span>
        <span class="t-caption num">${f.slot} · ${U.relTime(f.ts)}${f.kcal != null ? ` · ${f.kcal} kcal` : ''}</span></div>
        <button class="icon-btn post-more" data-action="post-more" data-id="${f.id}" aria-label="게시물 메뉴">${UI.icon('more', 22)}</button>
      </div>
      ${f.img ? UI.ph(f.img, '', '') : ''}
      <p>${U.esc(f.text)}</p>
      <div class="acts">
        <button class="act ${f.liked ? 'on' : ''}" data-action="feed-like" data-id="${f.id}" aria-pressed="${f.liked}" aria-label="좋아요 ${f.likes}">${UI.icon('heart', 21, { filled: f.liked })}<span class="num">${f.likes}</span></button>
        <button class="act" data-action="feed-comments" data-id="${f.id}" aria-label="댓글 ${f.comments.length}">${UI.icon('comment', 21)}<span class="num">${f.comments.length}</span></button>
        <span style="flex:1"></span>
        <button class="btn-pill ${f.cheered ? 'on' : ''}" data-action="feed-cheer" data-id="${f.id}" aria-pressed="${f.cheered}">${f.cheered ? '응원 완료' : '응원하기'}</button>
      </div>
    </article>`;
  }

  function mine(c) {
    const t = SEL.crewToday(c); const wk = SEL.crewWeekPct(c); const st = SEL.streak(); const done = SEL.meVerifiedToday();
    const feed = SEL.crewFeed(c.id); const u = SEL.rewardUsage(); const R = AF.data.reward;
    const left = t.total - t.verified;
    const msg = t.allDone ? '오늘 크루원 전원이 인증했어요. 불꽃 단계가 올랐어요.'
      : done ? `전원 인증까지 ${left}명 남았어요.` : left === 1 ? '나만 인증하면 전원 인증이에요.' : `전원 인증까지 ${left}명 남았어요.`;
    return `
      <section class="crew-head">
        <div style="display:flex;align-items:center;gap:8px"><h2 class="ellipsis">${U.esc(c.name)}</h2>${c.leader ? '<span class="t-caption t-strong">크루장</span>' : ''}</div>
        <p class="t-sub" style="font-size:14px">${U.esc(c.goal)}</p>
        <div style="display:flex;align-items:center;gap:10px;margin-top:6px">${flame(c.flame)}<span class="t-foot">불꽃 ${c.flame}단계 · ${c.flameDays}일째</span></div>
      </section>
      <section class="stats3">
        <div><span class="k">오늘 인증</span><span class="v">${t.verified}<small>/${t.total}명</small></span></div>
        <div><span class="k">주간 달성률</span><span class="v">${wk}<small>%</small></span></div>
        <div><span class="k">내 연속 인증</span><span class="v">${st}<small>일</small></span></div>
      </section>
      <section class="pad" style="padding-top:14px;display:flex;flex-direction:column;gap:10px">
        <span class="t-foot">${msg}</span>
        <button class="btn ${done ? 'secondary' : ''}" data-action="open-proof">${UI.icon('camera', 20, { sw: 1.8 })}${done ? '인증 추가로 공유하기' : '오늘 식단 인증하기'}</button>
        <button class="row" style="padding:0;min-height:46px" data-action="open-rewards"><span class="r-main"><span class="r-title" style="font-size:15px">리워드 규칙</span></span><span class="r-value">이번 주 ${u.week} / ${R.weekCap}P</span>${UI.chev()}</button>
      </section>
      <div class="spacer-8" style="margin-top:8px"></div>
      <div style="background:var(--surface)">
        <div class="section-head pad" style="padding-top:18px;padding-bottom:0"><h2>인증 피드 <span class="t-muted" style="font-weight:500;font-size:15px">${feed.length}</span></h2></div>
        ${feed.length ? feed.map(post).join('') : UI.empty('camera', '아직 인증이 없어요.<br>첫 번째로 오늘 식단을 인증해 보세요.')}
      </div>`;
  }

  function explore() {
    const q = AF.state.ui().exploreQuery;
    return `<div class="pad" style="padding-top:16px"><div class="search">${UI.icon('search', 18, { sw: 2 })}<input id="crew-q" data-input="crew-search" data-keep="1" value="${U.esc(q)}" placeholder="크루 이름 또는 목표 검색" autocomplete="off" aria-label="크루 검색"></div></div>
      <div class="section tight" id="crew-list">${exploreList(q)}</div>
      <div class="section tight">${UI.group(UI.row({ title: '새 크루 만들기', icon: 'plus', to: '/crew/new', cls: 'accent' }))}</div>`;
  }
  function exploreList(q) {
    const key = (q || '').trim().toLowerCase();
    const list = AF.state.data.crews.filter((c) => !c.mine && (!key || (c.name + c.goal).toLowerCase().includes(key)));
    if (!list.length) return UI.group(UI.empty('search', '조건에 맞는 크루가 없어요.<br>직접 크루를 만들어 보세요.'));
    return UI.group(list.map((c) => {
      const full = c.count >= c.cap;
      const btn = c.requested ? '<button class="btn-sm" disabled>승인 대기</button>'
        : full ? '<button class="btn-sm" disabled>정원 마감</button>'
        : `<button class="btn-sm tinted" data-action="crew-join" data-id="${c.id}">참가 신청</button>`;
      return `<div class="crew-list-item"><span class="r-main" style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
        <span style="font-size:16px;font-weight:600">${U.esc(c.name)}</span><span class="t-foot clamp-2">${U.esc(c.goal)}</span>
        <span class="t-caption num">${c.count}/${c.cap}명</span></span>${btn}</div>`;
    }).join('<div class="divider" style="margin-left:16px;background:var(--sep-inset)"></div>'));
  }

  AF.routes['/crew'] = {
    id: 'CRW-01', kind: 'tab', tab: 'crew', title: '크루',
    actions() {
      const c = SEL.currentCrew(); const ui = AF.state.ui();
      if (!c || ui.crewTab !== 'mine') return '';
      return `        ${AF.VARIANT === 'v2' ? `<button class="icon-btn" data-action="crew-more" aria-label="크루 메뉴${c.leader && c.pending.length ? `, 가입 신청 ${c.pending.length}건` : ''}">${UI.icon('more', 24)}${c.leader && c.pending.length ? `<span class="count">${c.pending.length}</span>` : ''}</button>` : ''}
        ${c.leader && AF.VARIANT !== 'v2' ? `<button class="icon-btn" data-action="go" data-to="/crew/manage" aria-label="크루 관리${c.pending.length ? `, 가입 신청 ${c.pending.length}건` : ''}">${UI.icon('sliders', 22)}${c.pending.length ? `<span class="count">${c.pending.length}</span>` : ''}</button>` : ''}`;
    },
    render() {
      const ui = AF.state.ui(); const my = SEL.myCrews(); const c = SEL.currentCrew();
      if (!my.length) ui.crewTab = 'explore';
      const isMine = ui.crewTab === 'mine' && c;
      const switcher = isMine && my.length > 1
        ? `<div class="chips" style="margin-top:14px">${my.map((m) => `<button class="chip ${m.id === c.id ? 'active' : ''}" data-action="crew-switch" data-id="${m.id}">${U.esc(m.name)}</button>`).join('')}</div>` : '';
      return `<h1 class="large-title">크루</h1>
        <div class="pad" style="padding-top:14px">${UI.seg([['mine', '내 크루', !my.length], ['explore', '크루 탐색']], ui.crewTab, 'crew-tab')}</div>
        ${switcher}
        ${isMine ? mine(c) : explore()}`;
    },
  };

  AF.handlers['crew-tab'] = (el) => { AF.state.ui().crewTab = el.dataset.v; AF.app.refresh(); };
  AF.handlers['crew-switch'] = (el) => { AF.state.ui().crewId = el.dataset.id; AF.app.refresh(); };
  AF.inputs['crew-search'] = (el) => { AF.state.ui().exploreQuery = el.value; document.getElementById('crew-list').innerHTML = exploreList(el.value); };
  AF.handlers['crew-join'] = (el) => AF.overlays.joinAlert(el.dataset.id);
  AF.handlers['feed-like'] = (el) => A.toggleLike(el.dataset.id);
  AF.handlers['feed-cheer'] = (el) => UI.toast(A.toggleCheer(el.dataset.id).msg);
  AF.handlers['feed-comments'] = (el) => AF.overlays.comments(el.dataset.id);
  AF.handlers['open-proof'] = () => AF.overlays.proof();
  AF.handlers['open-rewards'] = () => AF.overlays.rewards();

  /* ----- CRW-03 크루 개설 ----- */
  AF.routes['/crew/new'] = {
    id: 'CRW-03', kind: 'sub', title: '새 크루', back: '/crew',
    render() {
      const cap = AF.newCrewCap || 5;
      return `<div class="section tight">
          <div class="group">
            <div class="field"><label for="nc-name">이름</label><input id="nc-name" maxlength="20" placeholder="예) 아침식단 챌린저스" autocomplete="off"></div>
            <div class="field"><label for="nc-goal">목표</label><input id="nc-goal" maxlength="40" placeholder="예) 매일 아침 식단 인증" autocomplete="off"></div>
            <div class="field"><span class="f-label">정원</span><span style="flex:1"></span>
              <div class="stepper"><button data-action="nc-cap" data-d="-1" aria-label="정원 줄이기">${UI.icon('minus', 18, { sw: 2 })}</button><span id="nc-cap">${cap}</span><button data-action="nc-cap" data-d="1" aria-label="정원 늘리기">${UI.icon('plus', 18, { sw: 2 })}</button></div></div>
          </div>
          <div class="section-foot">정원은 2~20명까지 정할 수 있어요. 크루를 만들면 내가 크루장이 돼요.</div>
        </div>
        <div class="bottom-cta"><button class="btn" data-action="crew-create">크루 만들기</button></div>`;
    },
  };
  AF.handlers['nc-cap'] = (el) => { AF.newCrewCap = U.clamp((AF.newCrewCap || 5) + Number(el.dataset.d), 2, 20); document.getElementById('nc-cap').textContent = AF.newCrewCap; };
  AF.handlers['crew-create'] = () => {
    const v = (id) => document.getElementById(id).value;
    const d = { name: v('nc-name'), goal: v('nc-goal'), cap: AF.newCrewCap || 5 };
    if (String(d.name).trim().length < 2) return UI.invalid('nc-name', '크루 이름은 2자 이상 입력해 주세요.');
    AF.overlays.confirm({
      id: 'CRW-03M', title: '크루를 만들까요?', text: `'${U.esc(String(d.name).trim())}' · 정원 ${d.cap}명`, ok: '만들기',
      onOk: () => { const r = A.createCrew(d); UI.toast(r.msg); if (r.ok) { AF.newCrewCap = 5; AF.state.ui().crewTab = 'mine'; AF.go('/crew', true); } },
    });
  };

  /* CRW-05 채팅은 제거 — 크루 소통은 인증 피드와 댓글로만 */

  /* ----- CRW-06 크루 관리 (크루장) ----- */
  AF.routes['/crew/manage'] = {
    id: 'CRW-06', kind: 'sub', title: '크루 관리', back: '/crew',
    render() {
      const c = SEL.currentCrew(); if (!c || !c.leader) return UI.empty('lock', '크루장만 볼 수 있어요.');
      const pend = c.pending.length ? c.pending.map((r) => `<div class="row">${UI.avatar(r.name)}<span class="r-main"><span class="r-title">${U.esc(r.name)}</span><span class="r-sub">목표 ${U.esc(r.goal)}</span></span>
          <button class="text-btn" style="color:var(--label-2);padding:0 6px" data-action="crew-reject" data-id="${r.id}">거절</button>
          <button class="btn-sm tinted" style="height:32px;padding:0 14px" data-action="crew-accept" data-id="${r.id}">수락</button></div>`).join('')
        : '<div class="row"><span class="r-main"><span class="r-title t-sub" style="font-size:15px">대기 중인 신청이 없어요</span></span></div>';
      const members = c.members.map((m) => {
        const ok = m.id === 'me' ? SEL.meVerifiedToday() : m.verified;
        return `<div class="row">${UI.avatar(m.name, m.id === 'me')}<span class="r-main"><span class="r-title">${U.esc(m.name)}${m.id === 'me' ? ' (나)' : ''}</span></span><span class="r-value ${ok ? 't-accent' : ''}">${ok ? '오늘 인증 완료' : '미인증'}</span></div>`;
      }).join('');
      return `<div class="section tight"><div class="section-label">가입 신청 ${c.pending.length}</div>${UI.group(pend)}</div>
        <div class="section"><div class="section-label">크루원 ${c.members.length} / ${c.cap}명</div>${UI.group(members)}</div>`;
    },
  };
  AF.handlers['crew-accept'] = (el) => { const c = SEL.currentCrew(); UI.toast(A.acceptRequest(c.id, el.dataset.id).msg); };
  AF.handlers['crew-reject'] = (el) => { const c = SEL.currentCrew(); UI.toast(A.rejectRequest(c.id, el.dataset.id).msg); };
})();

/* ===== s-shop.js ===== */
/* =========================================================
   screens/shop — SHO-01 쇼핑 / SHO-02 상품 상세 / SHO-04 정기 구독
   (SHO-03 결제 시트, SHO-05 메뉴 변경 시트, SHO-06 건너뛰기·해지 알럿은 overlays)
   구성: 구독 상태 한 줄 → 검색 → 카테고리 → AI 추천 가로 스크롤 → 전체 상품 2열 그리드
   ========================================================= */
(function () {
  const U = AF.utils; const SEL = AF.sel; const UI = AF.ui; const D = AF.data;

  // 카테고리는 기존 4개 + 전체만 사용 (짧은 이름으로)
  const CATS = [['all', '전체'], ['ready', '완제품'], ['mealkit', '밀키트'], ['protein', '단백질'], ['drink', '음료']];
  const off = (p) => (p.orig ? Math.round((1 - p.price / p.orig) * 100) : 0);

  function filtered() {
    const ui = AF.state.ui(); const key = (ui.shopQuery || '').replace(/\s/g, '').toLowerCase();
    return D.products.filter((p) => (ui.shopFilter === 'all' || p.cat === ui.shopFilter) && (!key || (p.name + p.tag + p.sub).replace(/\s/g, '').toLowerCase().includes(key)));
  }

  // 2열 상품 카드 (이미지가 실제 콘텐츠이므로 이미지 영역만 라운드 처리, 텍스트는 카드 없이)
  function pcard(p) {
    return `<div class="pcard">
      <button class="pcard-link" data-action="go" data-to="/shop/item/${p.id}" aria-label="${U.esc(p.name)} 상세">
        ${UI.ph(p.img, p.cat, '', D.catLabel[p.cat])}
        <span class="p-cap">${U.esc(p.tag)}</span>
        <span class="p-name clamp-2">${U.esc(p.name)}</span>
        <span class="p-price">${p.orig ? `<span class="off">${off(p)}%</span>` : ''}${U.won(p.price)}</span>
        <span class="p-kcal">${p.cal} kcal · 단백질 ${p.prot}g</span>
      </button>
      <button class="quick-buy-btn" data-action="open-checkout" data-product="${p.id}" aria-label="${U.esc(p.name)} 바로 구매">${UI.icon('bag', 18, { sw: 1.8 })}</button>
    </div>`;
  }
  function tile(p) {
    return `<button class="tile" data-action="go" data-to="/shop/item/${p.id}">
      ${UI.ph(p.img, p.cat)}
      <span class="p-name clamp-2" style="font-size:14px">${U.esc(p.name)}</span>
      <span class="p-price" style="font-size:15px">${U.won(p.price)}</span>
      <span class="p-kcal">${p.cal} kcal</span>
    </button>`;
  }

  function listHtml() {
    const ui = AF.state.ui(); const l = filtered();
    const browsing = ui.shopFilter === 'all' && !(ui.shopQuery || '').trim();
    if (!l.length) return UI.empty('search', '조건에 맞는 상품이 없어요.<br>다른 이름이나 카테고리로 찾아보세요.');
    let html = '';
    if (browsing) {
      const rem = SEL.calorie().remaining; const picks = SEL.aiList().slice(0, 6);
      html += `<section style="padding-top:28px">
        <div class="section-head pad" style="padding-bottom:4px"><h2>AI 추천</h2></div>
        <p class="pad t-foot" style="margin:-4px 0 12px">${rem > 0 ? `오늘 남은 ${U.num(rem)} kcal 안에서 단백질을 채우기 좋은 순서예요` : '오늘은 목표를 채웠어요. 가벼운 메뉴부터 보여드려요'}</p>
        <div class="rail-scroll">${picks.map(tile).join('')}</div>
      </section>
      <div class="section-head pad" style="padding-top:32px;padding-bottom:12px"><h2>전체 상품</h2><span class="t-foot">${l.length}개</span></div>`;
    } else {
      html += `<div class="list-count" style="padding-top:20px">${l.length}개 상품</div>`;
    }
    return html + `<div class="grid2">${l.map(pcard).join('')}</div>`;
  }

  function subStrip() {
    const s = AF.state.data.subscription;
    const row = s.status === 'active'
      ? UI.row({ icon: 'truck', title: `다음 배송 ${U.mdDow(s.nextDate)}`, sub: `정기 구독 ${SEL.subWeek()}주차 · ${U.esc(s.menu || '기본 구성')}`, to: '/shop/sub', value: '관리' })
      : UI.row({ icon: 'truck', title: '정기 구독', sub: '매주 정한 요일에 식단을 받아보세요', to: '/shop/sub', value: '<span class="t-accent t-strong">시작하기</span>' });
    return `<div class="sub-strip">${UI.group(row)}</div>`;
  }

  AF.routes['/shop'] = {
    id: 'SHO-01', kind: 'tab', tab: 'shop', title: '쇼핑',
    actions: () => `<button class="icon-btn" data-action="go" data-to="/my/orders" aria-label="주문 내역">${UI.icon('receipt', 22)}</button>`,
    render() {
      const ui = AF.state.ui();
      // V2: 첫 진입은 항상 '전체' (AI 추천 + 전체 상품 구성이 먼저 보이도록). 취향은 AI 추천 순서에만 반영
      if (AF.VARIANT === 'v2' && !ui.shopV2Init) { ui.shopFilter = 'all'; ui.shopV2Init = true; }
      return `<h1 class="large-title">쇼핑</h1>
        ${subStrip()}
        <div class="pad" style="padding-top:16px"><div class="search">${UI.icon('search', 18, { sw: 2 })}<input id="shop-q" data-input="shop-search" data-keep="1" value="${U.esc(ui.shopQuery)}" placeholder="도시락, 밀키트, 프로틴 검색" autocomplete="off" aria-label="상품 검색"></div></div>
        <div class="chips" style="margin-top:14px" role="tablist">${CATS.map(([k, l]) => `<button class="chip ${ui.shopFilter === k ? 'active' : ''}" data-action="shop-filter" data-key="${k}" role="tab" aria-selected="${ui.shopFilter === k}">${l}</button>`).join('')}</div>
        <div id="shop-list">${listHtml()}</div>`;
    },
  };
  AF.handlers['shop-filter'] = (el) => { AF.state.ui().shopFilter = el.dataset.key; AF.app.refresh(); };
  AF.inputs['shop-search'] = (el) => { AF.state.ui().shopQuery = el.value; document.getElementById('shop-list').innerHTML = listHtml(); };

  /* ----- SHO-02 상품 상세 ----- */
  AF.routes['/shop/item'] = {
    id: 'SHO-02', kind: 'sub', title: '', white: true,
    back: () => (AF.app.prevPath && AF.app.prevPath() === '/home' ? '/home' : '/shop'),
    render(param) {
      const p = D.product(param); if (!p) return UI.empty('bag', '상품을 찾을 수 없어요.');
      const rem = SEL.calorie().remaining;
      const fit = p.cal <= rem
        ? `<span class="t-sub">오늘 남은 ${U.num(Math.max(0, rem))} kcal 안에 들어가요</span>`
        : `<span class="t-warn">오늘 남은 칼로리보다 ${U.num(p.cal - Math.max(0, rem))} kcal 많아요</span>`;
      return `${UI.ph(p.img, p.cat, 'detail-hero')}
        <section class="detail-body">
          <span class="t-foot">${D.catLabel[p.cat]} · ${U.esc(p.tag)}</span>
          <h1>${U.esc(p.name)}</h1>
          <p class="t-sub" style="font-size:15px">${U.esc(p.sub)}</p>
          <div class="detail-price">${p.orig ? `<span class="t-accent" style="margin-right:6px">${off(p)}%</span>` : ''}${U.won(p.price)}${p.orig ? `<span class="strike" style="font-size:15px">${U.won(p.orig)}</span>` : ''}</div>
          <span class="t-foot">보유 포인트로 결제할 수 있어요</span>
        </section>
        <div class="section-head pad" style="padding-top:28px;padding-bottom:10px"><h2 style="font-size:17px">영양 정보</h2><span class="t-foot">1회분</span></div>
        <section class="nutri4">
          <div><span class="v">${p.cal}</span><span class="k">kcal</span></div>
          <div><span class="v">${p.carb}g</span><span class="k">탄수화물</span></div>
          <div><span class="v">${p.prot}g</span><span class="k">단백질</span></div>
          <div><span class="v">${p.fat}g</span><span class="k">지방</span></div>
        </section>
        <p class="pad t-foot" style="padding-top:12px;font-size:14px">${fit}</p>`;
    },
    footer(param) {
      const p = D.product(param); if (!p) return '';
      return `<div class="buybar"><div style="display:flex;flex-direction:column"><span class="t-caption">결제 예정</span><span class="price" style="font-size:19px">${U.won(p.price)}</span></div>
        <button class="btn" data-action="open-checkout" data-product="${p.id}">구매하기</button></div>`;
    },
  };

  /* ----- SHO-04 정기 구독 ----- */
  function subDraft() {
    const s = AF.state.data.subscription;
    if (!AF.subDraft) AF.subDraft = { pkg: s.pkg, day: s.day };
    return AF.subDraft;
  }
  const checkRow = (title, sub, on, action, v) => UI.row({ title, sub, action, attrs: `data-v="${U.esc(v)}"`, cls: `choice ${on ? 'selected' : ''}`, chevron: false, right: `<span class="check">${UI.icon('check', 20, { sw: 2.2 })}</span>` });

  AF.routes['/shop/sub'] = {
    id: 'SHO-04', kind: 'sub', title: '정기 구독',
    back: () => (AF.app.prevPath && AF.app.prevPath() === '/my/orders' ? '/my/orders' : '/shop'),
    backLabel: () => (AF.app.prevPath && AF.app.prevPath() === '/my/orders' ? '내역' : '쇼핑'),
    render() {
      const s = AF.state.data.subscription; const d = subDraft(); const active = s.status === 'active';
      const status = active ? `
        <section class="big-stat" style="padding-top:12px">
          <div class="k">다음 배송</div>
          <div class="v">${U.mdDow(s.nextDate)}</div>
          <div class="t-foot" style="margin-top:4px">${SEL.subWeek()}주차 · 건너뛰기 ${s.skipped}회</div>
        </section>
        ${SEL.yesterdayExceeded() ? '<p class="pad t-warn" style="font-size:14px;padding-top:12px">어제 목표 칼로리를 넘었어요. 다음 주 메뉴를 가벼운 구성으로 바꿔 보세요.</p>' : ''}
        <div class="section tight">${UI.group(
          UI.row({ title: '패키지', value: `<span class="ellipsis" style="display:inline-block;max-width:190px;vertical-align:bottom">${U.esc(s.pkg)}</span>` })
          + UI.row({ title: '다음 주 메뉴', value: U.esc(s.menu || '기본 구성'), action: 'open-menu-change' })
          + UI.row({ title: '다음 배송 1회 건너뛰기', action: 'sub-skip', cls: 'accent', chevron: false })
          + UI.row({ title: '구독 해지', action: 'sub-cancel', cls: 'warn', chevron: false }))}</div>`
        : (s.status === 'cancelled' ? '<p class="pad t-sub" style="padding-top:12px;font-size:15px">구독이 해지된 상태예요. 아래에서 다시 시작할 수 있어요.</p>' : '');
      return `${status}
        <div class="section"><div class="section-label">${active ? '패키지 변경' : '패키지 선택'}</div>
          <div class="group" id="sub-pkg">${D.subPackages.map((p) => checkRow(U.esc(p), '', d.pkg === p, 'sub-pick-pkg', p)).join('')}</div></div>
        <div class="section"><div class="section-label">배송 요일</div>
          <div class="group" id="sub-day">${D.subDays.map((x) => checkRow(x.label, '', d.day === x.key, 'sub-pick-day', x.key)).join('')}</div></div>
        <div class="bottom-cta"><button class="btn" data-action="sub-save">${active ? '변경 내용 저장' : '구독 시작하기'}</button></div>`;
    },
  };
  const pick = (box, el) => document.querySelectorAll(`#${box} .choice`).forEach((b) => b.classList.toggle('selected', b === el));
  AF.handlers['sub-pick-pkg'] = (el) => { subDraft().pkg = el.dataset.v; pick('sub-pkg', el); };
  AF.handlers['sub-pick-day'] = (el) => { subDraft().day = el.dataset.v; pick('sub-day', el); };
  AF.handlers['sub-save'] = () => { const d = subDraft(); const r = AF.actions.saveSubscription(d.pkg, d.day); AF.subDraft = null; UI.toast(r.msg); AF.app.refresh(); };
  AF.handlers['sub-skip'] = () => AF.overlays.confirm({ id: 'SHO-06', title: '다음 배송을 건너뛸까요?', text: '배송일이 일주일 뒤로 미뤄집니다.', ok: '건너뛰기', onOk: () => UI.toast(AF.actions.skipWeek().msg) });
  AF.handlers['sub-cancel'] = () => AF.overlays.confirm({ id: 'SHO-06C', title: '정기 구독을 해지할까요?', text: '언제든 다시 시작할 수 있어요.', ok: '해지', danger: true, onOk: () => { AF.subDraft = null; UI.toast(AF.actions.cancelSubscription().msg); } });
  AF.handlers['open-menu-change'] = () => AF.overlays.menuChange();
})();

/* ===== s-my.js ===== */
/* =========================================================
   screens/my — MYP-01 마이(Settings형 grouped list) / 02 주문·구독 / 03 포인트 / 04 프로필·목표
                05 알림 설정 / 06A AI 추천 설정 / NOT-01 알림함
   구성: 프로필 ──── 포인트 · 체중 통계 ──── 설정 ──── 프로토타입 도구
   ========================================================= */
(function () {
  const U = AF.utils; const SEL = AF.sel; const UI = AF.ui; const A = AF.actions;

  function stats() {
    const range = AF.state.ui().statsRange; const days = range === 'week' ? 7 : 30;
    const series = SEL.weightSeries(days); const t = U.today();

  function profileInsights() {
    const u = AF.state.data.user; const w = SEL.latestWeight() || 0;
    const ws = Object.keys(AF.state.data.weights).sort(); const start = ws.length ? AF.state.data.weights[ws[0]] : w;
    const bmi = SEL.bmi(); const st = bmi ? U.bmiStatus(bmi) : null;
    const toGo = U.round1(w - u.targetWeight); const losing = start >= u.targetWeight;
    const total = Math.abs(start - u.targetWeight) || 1; const done = Math.abs(start - w);
    const prog = U.clamp(Math.round(((losing ? start - w : w - start) / total) * 100), 0, 100);
    const weeks = Math.ceil(Math.abs(toGo) / 0.5); const eta = U.addDays(U.today(), weeks * 7);
    const mt = U.macroTargets(u.targetCal); const kc = { carb: mt.carb * 4, prot: mt.prot * 4, fat: mt.fat * 9 }; const ks = kc.carb + kc.prot + kc.fat;

    const days = Array.from({ length: 7 }, (_, i) => U.addDays(U.today(), -i)).filter(SEL.loggedOn);
    const avg = days.length ? Math.round(days.reduce((a, d) => a + SEL.dayTotals(d).cal, 0) / days.length) : null;
    return { u, w, start, bmi, st, toGo, losing, done: U.round1(done), prog, weeks, eta, mt, kc, ks, avg, logged: days.length, bmrV: w ? bmr(u, w) : null };
